# areno examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. See docs/examples-guard-engine.md for the design.
#
# Guard state: projects/areno/examples_manifest.yaml promotes two agentic
# RLVR examples to supported - bash_game (single-turn) and codebreaker
# (multi-turn), each anchored on its run_agent.py entry file - and keeps
# the remaining .py files unsupported pending verification. The
# run-example matrix therefore schedules two 1-card NPU legs
# (linux-aarch64-a2-1), each running projects/areno/scripts/setup_example.sh
# (source build of areno.accel._areno_accel_npu) + run_example.sh.
# Refs: latest release v0.0.8 already ships the full examples/ tree
# (identical to main), so manifest-check and the daily examples-check
# resolve unchanged; but v0.0.8 predates the NPU backend, so the setup
# script switches the workspace checkout to upstream main before the
# source build (temporary - same handling as areno-quick-start.yml).

name: areno-examples

concurrency:
  # Schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'areno-examples-schedule' || format('manual-{0}', github.run_id) }}
  # A run cancelled mid-way loses its outcome writeback, and that outcome
  # drives the next scheduled cycle's retry.
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual rounds
  # are green. Re-enable:
  # schedule:
  #   - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA of inclusionAI/AReno to test (empty resolves to upstream latest release)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called workflows
# run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  areno-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces monitor-state cache keys, artifact names, and the
      # scheduling paths under projects/areno.
      project: areno
      upstream_repo: inclusionAI/AReno
      target_ref: ${{ inputs.target_ref }}
      # Bring-up phase: no supported entries yet (all 11 examples are
      # unsupported pending verification) so the matrix is empty; keep
      # one leg at a time until entries graduate and the source-install
      # stack settles.
      max_parallel: 8
