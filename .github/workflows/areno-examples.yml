# areno examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. See docs/examples-guard-engine.md for the design.
#
# Guard state: projects/areno/examples_manifest.yaml registers the supported
# entries - bash_game, codebreaker, coding, duelgrid, shopping,
# terminal_hacking, tictactoe (tool-call + XML no-tool), math (GSM8K RLVR),
# alpaca (SFT) and pi (pi coding agent). ave_event_recognition /
# tictactoe_image (NPU multimodal) are unsupported. The run-example matrix
# schedules one 1-card NPU leg per supported entry (linux-aarch64-a2-1), each
# running projects/areno/scripts/setup_example.sh (source build of
# areno.accel._areno_accel_npu) + run_example.sh.
# Refs: the guard targets the latest upstream release (v0.9.0, which ships the
# NPU backend), so schedule and manual dispatch (empty target_ref, or explicit
# ref) all build and test that ref directly - no main switch. setup_example.sh
# compiles areno.accel._areno_accel_npu from the release checkout.

name: areno-examples

concurrency:
  # Schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'areno-examples-schedule' || format('manual-{0}', github.run_id) }}
  # A run cancelled mid-way loses its outcome writeback, and that outcome
  # drives the next scheduled cycle's retry.
  cancel-in-progress: false

on:
  # Poll the upstream release signal every 6h. The engine's monitor resolves
  # the target as the latest release (v0.9.0, which ships the NPU backend);
  # the run builds and tests that release.
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA of inclusionAI/AReno to test (empty resolves to upstream latest release)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called workflows
# run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  areno-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces monitor-state cache keys, artifact names, and the
      # scheduling paths under projects/areno.
      project: areno
      upstream_repo: inclusionAI/AReno
      target_ref: ${{ inputs.target_ref }}
      # Upper bound on parallel run-example matrix legs (hardware-permitting);
      # the engine schedules one 1-card leg per active supported entry.
      max_parallel: 8
