# opencv quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.

name: opencv-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'opencv-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 6 hours: '0 */6 * * *' fires at minute 0 of every
    # 6th hour (00:00, 06:00, 12:00, 18:00). Cadence is loose enough
    # for an upstream that releases ~3-4 times a year (OpenCV 4.x: a
    # new minor every few months), but tight enough that doc fixes
    # propagate within a day.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencv-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-opencv_*), artifacts
      # (opencv-quick-start-<run_id>) and the test working dir
      # (workflows/projects/opencv).
      project: opencv
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-4"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # OpenCV source build needs ~6 GB free disk + 32-core build
      # parallelism; --privileged lets cmake's IPPICV download helper
      # write into /tmp without sandbox surprises, --shm-size=64g
      # keeps make -j$(nproc) from hitting /dev/shm pressure during
      # parallel compile. CANN-side devices mounted explicitly so
      # cmake's `find_package(Ascend)` can dlopen acl libraries on
      # the configure phase for header discovery.
      container_options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      # Doc body does: apt-get install build deps (aliyun mirror) +
      # git clone opencv + opencv_contrib + source patches (MatShape
      # + all_ops.h narrowing + op_cann.cpp host-buffer-clamped memcpy
      # as defensive hardening; the CI-runner heap corruption is a
      # driver-25.5.2-x-CANN-9.1.0 mismatch tripped in libacl_dvpp_mpi's
      # atexit teardown - the DNN block works around it via os._exit(0))
      # + cmake -DWITH_CANN=ON configure
      # (BUILD_LIST scoped to 8 modules) + make -j2 (Debug -O0;
      # ~50-70 min with the narrow-header patch) + make install
      # + opencv_version / opencv_test_cannops smokes + Python binding
      # smoke + MobileNetV2 ONNX NPU forward (classic DNN engine via
      # OPENCV_FORCE_DNN_ENGINE=1; first GE graph build can take ~1-2 min
      # cold). 240 min leaves room for the
      # build chain + first-time DNN samples / IPPICV / ACL graph
      # cache pulls.
      timeout_minutes: 240
      upstream_repo: opencv/opencv
      # `?ref=${{ github.sha }}` so test fetches THIS branch's doc, not main.
      # Without the ref pin, the Contents API returns main's doc and the
      # hdc-side doc fixes (Debug+j2 / a2-4 runner / fuzzy fix) are
      # invisible to the runner — the test re-runs main's failing recipe
      # and we get the same OOM every dispatch. Same fix as
      # speculators (8e04823) and torchtune (b11069f); once hdc merges
      # into main, the SHA auto-resolves to main HEAD on schedule runs.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/opencv/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/opencv/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/opencv; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep and installs live in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
