# tensordict quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Cache keys (quick-start-monitor-state-tensordict_*) and artifact names are
# derived from project=tensordict, not from the workflow name.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-1`)
# auto-passes `/dev/davinci*` into the container via the cluster
# device-plugin, so container_options stays empty. Same convention
# used by torchtune / xtuner / slime / pytorch.vision / accelerate /
# ray / torchtitan. The 8 projects that still ship a full
# `--device=/dev/davinci0` block (bitsandbytes / cache-dit /
# colossalai / deepspeed / llama.cpp / onnxruntime / trl /
# whisper.cpp) keep that block for the read-only Ascend driver
# bind-mounts the test wants; tensordict does not need those. The
# doc exercises install + import + 13 core-feature smoke commands
# (basic / metadata / dict / nesting / tensor-like / lock / dist /
# state-dict / functional / memmap / map / make_tensordict /
# tensorclass — all constructing TensorDict on 'npu:0' directly) without
# torchrun or HCCL/NCCL collectives. check-torch expects `count: 1`.
#
# No modelscope cache bind-mount: the test does not download any model
# (tensordict is a pure data-structure library and the doc body is
# install + API smoke only, per the user's `example先不管` directive),
# so the host cache is not touched.

name: tensordict-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'tensordict-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 6 hours: '15 */6 * * *' fires at minute 15 of every
    # 6th hour (00:15, 06:15, 12:15, 18:15). Cadence is loose enough
    # for an upstream that releases a few times a year (tensordict
    # current latest is v0.14.0), but tight enough that doc fixes
    # propagate within a day.
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tensordict-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-tensordict_*), artifacts
      # (tensordict-quick-start-<run_id>) and the test working dir
      # (workflows/projects/tensordict).
      project: tensordict
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
      # Doc body does: git clone + uv pip install -e . on a <ref>
      # checkout + thirteen #test smoke commands (td-basic / td-metadata /
      # td-dict / td-nesting / td-tensor-like / td-lock / td-dist /
      # td-state-dict / td-functional / td-memmap / td-map / td-make-td /
      # td-tensorclass). All thirteen construct TensorDict on 'npu:0'
      # directly; they run after tensordict source install. tensordict's
      # transitive deps (torch / numpy / cloudpickle / packaging / orjson
      # / pyvers) are small enough that 90 min covers cold cache +
      # first-time wheel pulls + thirteen ~1s smoke commands comfortably.
      timeout_minutes: 90
      upstream_repo: pytorch/tensordict
      # Raw URL the engine's monitor hashes and the test fetches;
      # doc-hash state lives under the quick-start-monitor-state-tensordict_ cache
      # prefix.
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/tensordict/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/tensordict/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/tensordict; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep and installs live in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
