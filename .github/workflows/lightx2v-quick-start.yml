# lightx2v quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Cache keys (quick-start-monitor-state-lightx2v_*) and artifact names are derived
# from project=lightx2v, not from the workflow name.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-2`,
# 2-card) auto-passes `/dev/davinci*` into the container via the cluster
# device-plugin, so container_options stays empty for device binds.
# The doc smokes t2v with Wan-AI/Wan2.1-T2V-1.3B through the official
# ascend_npu config, single-card; the second card sits idle. This
# matches the single-card convention used by torchtune / slime /
# tensordict / pytorch.vision / accelerate / ray / torchtitan /
# transformers / diffusers / mooncake.
#
# One bind mount beyond the defaults: the modelscope cache ->
# /root/.cache/modelscope, which is where the doc's embedded
# `snapshot_download('Wan-AI/Wan2.1-T2V-1.3B')` writes (no local dir is
# requested, so weights land in the default cache). Reused across runs;
# also the dir the test class's purge_modelscope_corrupt() walks.
#
# The <doc-cwd>/models bind from earlier iterations was dropped together
# with the doc's `modelscope download --local_dir models/...` block: the
# generation script now resolves the weights through snapshot_download
# into the default cache, so nothing writes to <doc-cwd>/models any more.
# The HF cache bind was dropped earlier for the same reason (all smoke
# weights come from ModelScope).

name: lightx2v-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'lightx2v-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run (same
  # convention as mooncake / tensorflow / most of the repo).
  # schedule:
  #   - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightx2v-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-lightx2v_*), artifacts
      # (lightx2v-quick-start-<run_id>) and the test working dir
      # (workflows/projects/lightx2v).
      project: lightx2v
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest. 2-card label (linux-aarch64-a2-2)
      # is fine even though the doc is single-card adapted - the
      # second card sits idle (device-plugin still passes both
      # /dev/davinci* into the container; ASCEND_RT_VISIBLE_DEVICES=0
      # in the smoke step picks card 0 only).
      test_runner: '["linux-aarch64-a2-2"]'
      # Plain CANN base image (the proven old stack): the image ships
      # only CANN 9.1.0 - the whole torch stack (torch 2.9.0 +
      # torchvision 0.24.* + torch_npu 2.9.0.post2 + triton 3.5.*) is
      # installed by the doc's own `lightx2v-install-torch` block, so
      # the install path is guarded by CI instead of being baked into
      # an opaque image. MindIE is NOT needed by the current route:
      # `npu_flash_attn` resolves to torch_npu's own
      # `npu_fusion_attention`, and the `mindie` compile backend is
      # only created on explicit request. Same SWR registry domain as
      # the previous images - the runner's host docker daemon already
      # pulls this exact tag daily.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/lightx2v:/root/.cache/modelscope
      # 4h ceiling: cold run pulls the full ~17.6 GB Wan-AI/
      # Wan2.1-T2V-1.3B repo into the default modelscope cache at
      # cluster network speed + a 50-step 1.3B t2v smoke on a single
      # 910B4 (480x832 / 81 frames typically runs in minutes). 4h
      # covers cache-cold downloads + several retries on dependency
      # flakes.
      timeout_minutes: 240
      upstream_repo: ModelTC/LightX2V
      # The doc installs the latest upstream release tag: its clone
      # block injects UPSTREAM_REF via store/load into `git clone
      # --branch <ref>`, so the engine release signal tracks
      # exactly what the doc installs. No fixed_ref needed.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/lightx2v/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/lightx2v/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/lightx2v; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep (CANN source, CUDA exclusion list, uv install, torch
      # stack probe, os.chdir to the doc cwd /root/lightx2v-test, aarch64
      # stubs, modelscope cache resolve + safetensors purge) lives in the
      # test subclass's prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
