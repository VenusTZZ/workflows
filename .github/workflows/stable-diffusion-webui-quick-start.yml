# stable-diffusion-webui quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Engine-fixed behaviours this trigger relies on (declared in the
# engine, NOT here):
#   * cache key prefix: quick-start-monitor-state-stable-diffusion-webui_  (from inputs.project)
#   * artifact name:    stable-diffusion-webui-quick-start-<run_id>
#   * result.json is written by the engine and validated against
#     schemas/result.schema.json before upload.
#
# NOTE: only workflow_dispatch is enabled for now (per spec: same
# onboarding rhythm as the other 新兴适配 projects such as trl / timm /
# fastchat). Once the pipeline runs green and stable, re-enable the
# schedule block below to start the periodic monitor loop. Until then,
# the engine's schedule-only steps (monitor / record-monitor-outcome /
# cache save) simply never run.
#
# Bind mount: the doc flow downloads real model weights (AI-ModelScope/
# sd-turbo, ~3.4 GB) via ModelScope snapshot_download, so the ModelScope
# cache is bind-mounted to the host
# (/data/ci-cache/modelscope/stable-diffusion-webui) to keep the
# downloaded weights persistent across runs. The pip cache is also
# bind-mounted to avoid re-downloading wheels across runs. The
# self-hosted NPU runner (linux-aarch64-a2-1) auto-passes /dev/davinci*
# into the container via the cluster device-plugin.

name: stable-diffusion-webui-quick-start

concurrency:
  # Fixed group: manual and schedule runs share one serial queue,
  # matching the single-NPU physical constraint of the runner.
  group: stable-diffusion-webui-quick-start
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # schedule: deliberately NOT enabled yet - see the header note.
  # Enable with e.g. `- cron: '45 */3 * * *'` once the pipeline is
  # proven stable on manual runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-diffusion-webui-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-stable-diffusion-webui_*),
      # artifacts (stable-diffusion-webui-quick-start-<run_id>) and the
      # test working dir (workflows/projects/stable-diffusion-webui).
      project: stable-diffusion-webui
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/stable-diffusion-webui:/root/.cache/modelscope
        --volume=/data/ci-cache/pip:/root/.cache/pip
      # Bind mounts persist two caches on the host across runs:
      # 1. ModelScope weights (AI-ModelScope/sd-turbo, ~3.4 GB);
      # 2. pip wheel cache (wheels downloaded once; pip still
      #    re-installs but never re-downloads).
      timeout_minutes: 180
      upstream_repo: AUTOMATIC1111/stable-diffusion-webui
      # Raw URL the engine's monitor hashes and the test fetches;
      # doc-hash state lives under the quick-start-monitor-state-stable-diffusion-webui-
      # cache prefix.
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/stable-diffusion-webui/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/stable-diffusion-webui/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/stable-diffusion-webui; env contract
      # (MONITORED_DOC_URL / NPU_READY) is injected by the engine. All
      # project env prep and installs live in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1