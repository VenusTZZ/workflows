# modelscope quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Cache keys (quick-start-monitor-state-modelscope_*) and artifact names are
# derived from project=modelscope, not from the workflow name.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-1`,
# 1-card) auto-passes `/dev/davinci*` into the container via the
# cluster device-plugin, so container_options stays empty for device
# binds (same convention as lightx2v / torchtune / slime / tensordict /
# pytorch.vision / accelerate / ray / torchtitan / transformers /
# diffusers / mooncake).
#
# One bind mount beyond the defaults:
#   1. modelscope hub cache -> /root/.cache/modelscope (the location
#      modelscope's snapshot_download writes to by default). The doc's
#      `modelscope download --model Qwen/Qwen2.5-0.5B-Instruct`
#      command lands here; bind-mount covers persistence + the cache
#      invalidation contract (purge_corrupt_models walks this dir).

name: modelscope-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'modelscope-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modelscope-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-modelscope_*), artifacts
      # (modelscope-quick-start-<run_id>) and the test working dir
      # (workflows/projects/modelscope).
      project: modelscope
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/modelscope:/root/.cache/modelscope
      # 2h ceiling: cold run installs torch 2.9.0 + torch_npu +
      # modelscope from the source clone (git clone at latest release
      # tag + `uv pip install -e '.[framework]'`, whose aarch64
      # resolver is steered off CUDA wheels by the CUDA exclusion
      # list) + pulls Qwen2.5-0.5B-Instruct (~1 GB, warm after the
      # first run via the bind-mount) + a single-card text-generation
      # smoke on a 910B4. Covers several retries on dependency flakes.
      timeout_minutes: 120
      upstream_repo: modelscope/modelscope
      # Contents API URL (NOT raw.githubusercontent.com): raw is
      # firewalled off the NPU runner, and the engine's monitor
      # already sends the Contents API auth headers. Same pattern as
      # aibrix / bitsandbytes / colossalai / mooncake / llama.cpp /
      # onnxruntime / opencv / flagscale / specforge / torchtune /
      # lightx2v. `?ref=${{ github.sha }}` is load-bearing: without it
      # the Contents API defaults to the repo default branch (`main`)
      # and a dispatch on this branch would silently test main's doc.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/modelscope/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/modelscope/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/modelscope; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep (CANN source, CUDA exclusion list, uv install,
      # modelscope cache resolve + safetensors purge) lives in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
