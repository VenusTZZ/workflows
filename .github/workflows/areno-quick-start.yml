# areno quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml.
# This file only declares what varies: concurrency, runner, image,
# container options, upstream repo, monitored doc, and the test command.
#
# AReno (inclusionAI): single-node RL post-training toolkit (SFT/DPO/
# GRPO/GSPO/PPO + OpenAI-compatible serving). NPU support follows the
# upstream docs/concepts/npu.rst target stack — CANN 9.0.0 + torch
# 2.10.0+cpu + torch_npu 2.10.0.post2 — hence the 9.0.0 image (not the
# 9.1.0 line most other projects use). The doc installs from source at
# upstream main (temporary: the latest release tag v0.0.8 predates the
# NPU backend — same situation as wenet; revert to the engine-resolved
# release tag once a release ships NPU): the installer detects torch_npu,
# switches to requirements/npu.txt and compiles the
# areno.accel._areno_accel_npu Ascend C extension in-place (no Python
# fallback), which is why timeout covers a full source build.
# Doc body: 1-step GSPO-on-GSM8K RLVR smoke (Qwen3-0.6B via ModelScope,
# single card) with checkpoint save, then `areno serve --backend npu` of
# the saved checkpoint behind a /health poll + /v1/models +
# /v1/chat/completions checks. Qwen3-0.6B bf16 is ~1.2 GB, so the
# 1-card linux-aarch64-a2-1 runner is sufficient. Train and serve both
# pin `--attn-backend native`: the flash-attn-npu 0.3.0 kvcache path
# does a sync aclrtMemcpy that is illegal under NPU graph capture
# (CANN error 107030), which kills the rollout worker. Serve also caps
# `--max-running-prompts 2` because the default 16 x 32k-context KV
# pool (~60 GB) fills the card and OOMs the first request.
name: areno-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'areno-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work; (2) dispatch runs already live in
  # unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  areno-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-areno_*), artifacts
      # (areno-quick-start-<run_id>) and the test working dir
      # (workflows/projects/areno).
      project: areno
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest. 1-card label is enough: the doc's
      # smoke runs --tp-size 1 --world-size 1 on Qwen3-0.6B.
      test_runner: '["linux-aarch64-a2-1"]'
      # CANN 9.0.0 pairs with the torch 2.10.0+cpu + torch_npu
      # 2.10.0.post2 stack pinned in the doc (upstream npu.rst line).
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope/areno:/root/.cache/modelscope
      # Full source build (AscendC kernels + torch_npu extension, no
      # build isolation) + first-run ModelScope downloads (Qwen3-0.6B
      # ~1.2 GB + gsm8k) + 1-step RLVR smoke + serve start/chat.
      timeout_minutes: 240
      upstream_repo: inclusionAI/AReno
      # GitHub Contents API URL (NOT raw.githubusercontent.com): the
      # engine's monitor hashes via `Authorization: Bearer $GH_TOKEN` +
      # `Accept: application/vnd.github.raw`, and the test-side fetch in
      # markdown_doc_test_base.py re-applies the same headers on
      # api.github.com URLs, so monitor + test see the same doc bytes.
      # `?ref=${{ github.sha }}` pins the fetch to whichever ref fired
      # the run so branch-side doc edits are testable via dispatch.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/areno/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/areno/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/areno; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep and installs live in the doc blocks themselves; the test
      # subclass only scaffolds CANN env + uv.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
