name: diffsynth-studio-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'diffsynth-studio-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: modelscope/DiffSynth-Studio
  PYPI_PACKAGE: diffsynth
  CI_IMAGE: &ci_image swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
  DOC_URL: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/diffsynth-studio/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
  DOC_PATH: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/diffsynth-studio/docs/Quick-start-Ascend.md

jobs:
  restore-cache:
    name: restore monitor state and resolve PyPI release
    runs-on: ubuntu-latest
    outputs:
      cache_last_release_version: ${{ steps.read-monitor.outputs.cache_last_release_version }}
      cache_doc_hash: ${{ steps.read-monitor.outputs.cache_doc_hash }}
      cache_test_result: ${{ steps.read-monitor.outputs.cache_test_result }}
      cache_test_error: ${{ steps.read-monitor.outputs.cache_test_error }}
      current_release_version: ${{ steps.resolve-release.outputs.current_release_version }}
    steps:
      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .monitor-state
          key: cache-not-used-restore-keys-only
          restore-keys: monitor-state-diffsynth-studio-pypi-

      - id: read-monitor
        run: |
          set -euo pipefail
          if [ -f .monitor-state/.monitor ]; then
            . .monitor-state/.monitor
            [ -n "${last_release_version:-}" ] && echo "cache_last_release_version=$last_release_version" >> "$GITHUB_OUTPUT"
            [ -n "${doc_hash:-}" ] && echo "cache_doc_hash=$doc_hash" >> "$GITHUB_OUTPUT"
            [ -n "${test_result:-}" ] && echo "cache_test_result=$test_result" >> "$GITHUB_OUTPUT"
            [ -n "${test_error:-}" ] && echo "cache_test_error=$test_error" >> "$GITHUB_OUTPUT"
            echo "monitor state restored: release(version=${last_release_version:-}) doc(hash=${doc_hash:-}) test(result=${test_result:-} error=${test_error:-})"
          else
            echo "no cache entry restored - cold start"
          fi

      - name: Resolve latest PyPI release
        id: resolve-release
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 \
            "https://pypi.org/pypi/${PYPI_PACKAGE}/json" \
            -o /tmp/pypi-release.json
          version=$(jq -r '.info.version // empty' /tmp/pypi-release.json)
          [ -n "$version" ] || { echo "ERROR: failed to resolve latest PyPI release"; exit 1; }
          echo "current_release_version=$version" >> "$GITHUB_OUTPUT"
          echo "latest PyPI release: ${PYPI_PACKAGE}==${version}"

  test:
    name: monitor + test on change
    needs: restore-cache
    runs-on: linux-aarch64-a2-1
    timeout-minutes: 120
    outputs:
      result_json: ${{ steps.write-result.outputs.result_json }}
      reason: ${{ steps.decide.outputs.reason }}
      need_to_test: ${{ steps.decide.outputs.need_to_test }}
      monitor_last_release_version: ${{ steps.record-monitor-outcome.outputs.monitor_last_release_version }}
      monitor_doc_hash: ${{ steps.record-monitor-outcome.outputs.monitor_doc_hash }}
      monitor_test_result: ${{ steps.record-monitor-outcome.outputs.monitor_test_result }}
      monitor_test_error: ${{ steps.record-monitor-outcome.outputs.monitor_test_error }}
    defaults:
      run:
        shell: bash
    container:
      image: *ci_image
      options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope/diffsynth-studio:/root/.cache/modelscope
    env:
      MONITORED_DOC_URL: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/diffsynth-studio/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: "unsafe-best-match"
      UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      UV_HTTP_TIMEOUT: "120"
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_TIMEOUT: "120"
    steps:
      - name: Print context and probe NPU
        run: |
          echo "=========================================="
          echo "Trigger:       ${{ github.event_name }}"
          echo "Runner:        ${{ runner.name }}"
          echo "Upstream:      $UPSTREAM_REPO"
          echo "PyPI package:  $PYPI_PACKAGE"
          echo "=========================================="
          export PATH="/usr/local/sbin:$PATH"
          npu-smi info || true

      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows
          fetch-depth: 1

      - name: Materialize monitor state file
        env:
          RESTORED_LAST_RELEASE_VERSION: ${{ needs.restore-cache.outputs.cache_last_release_version }}
          RESTORED_DOC_HASH: ${{ needs.restore-cache.outputs.cache_doc_hash }}
          RESTORED_TEST_RESULT: ${{ needs.restore-cache.outputs.cache_test_result }}
          RESTORED_TEST_ERROR: ${{ needs.restore-cache.outputs.cache_test_error }}
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          {
            echo "last_release_version='$RESTORED_LAST_RELEASE_VERSION'"
            echo "doc_hash='$RESTORED_DOC_HASH'"
            echo "test_result='$RESTORED_TEST_RESULT'"
            echo "test_error='$RESTORED_TEST_ERROR'"
          } > .monitor-state/.monitor
          cat .monitor-state/.monitor

      - name: Monitor PyPI release and doc
        id: monitor
        if: github.event_name == 'schedule'
        env:
          CURRENT_RELEASE_VERSION: ${{ needs.restore-cache.outputs.current_release_version }}
        run: |
          set -euo pipefail
          MONITOR_FILE=.monitor-state/.monitor
          DECISION_FILE=/tmp/.decision
          last_release_version=""
          doc_hash=""
          test_result=""
          test_error=""
          . .monitor-state/.monitor

          need_to_test=false
          ref=""
          reason=""
          skip_doc=false

          if [ "$last_release_version" != "$CURRENT_RELEASE_VERSION" ]; then
            last_release_version="$CURRENT_RELEASE_VERSION"
            need_to_test=true
            ref="$CURRENT_RELEASE_VERSION"
            reason=release
            skip_doc=true
            echo "monitor: PyPI release signal fired (${PYPI_PACKAGE}==${CURRENT_RELEASE_VERSION})"
          else
            echo "monitor: PyPI release signal not fired (${PYPI_PACKAGE}==${CURRENT_RELEASE_VERSION})"
          fi

          if [ "$skip_doc" = false ]; then
            if ! current_doc_hash=$(curl -fsSL --retry 3 --max-time 30 \
                                      -H "Authorization: Bearer $GH_TOKEN" \
                                      -H "Accept: application/vnd.github.raw" \
                                      "$DOC_URL" \
                                      | sha256sum | cut -d' ' -f1); then
              echo "monitor: doc signal unknown (fetch failed)"
            elif [ "$doc_hash" != "$current_doc_hash" ]; then
              doc_hash="$current_doc_hash"
              need_to_test=true
              ref="$CURRENT_RELEASE_VERSION"
              reason=doc
              echo "monitor: doc signal fired (hash=$current_doc_hash)"
            else
              echo "monitor: doc signal not fired (hash unchanged)"
            fi
          fi

          if [ "$need_to_test" = false ] && [ "$test_result" = failure ]; then
            need_to_test=true
            ref="$CURRENT_RELEASE_VERSION"
            reason=retry
            echo "monitor: retry signal fired"
          fi

          {
            echo "last_release_version='$last_release_version'"
            echo "doc_hash='$doc_hash'"
            echo "test_result='$test_result'"
            echo "test_error='$test_error'"
          } > "$MONITOR_FILE"
          {
            echo "need_to_test='$need_to_test'"
            echo "ref='$ref'"
            echo "reason='$reason'"
          } > "$DECISION_FILE"
          echo "monitor decision: release_version=$ref need_to_test=$need_to_test reason=$reason"

      - name: Decide which PyPI release to test
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RELEASE_VERSION: ${{ needs.restore-cache.outputs.current_release_version }}
        run: |
          set -euo pipefail
          need_to_test=false
          reason=""
          ref=""

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            need_to_test=true
            reason=manual
            ref="$CURRENT_RELEASE_VERSION"
          elif [ -f /tmp/.decision ]; then
            . /tmp/.decision
          fi

          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$need_to_test" = true ]; then
            echo "need_to_test=true" >> "$GITHUB_OUTPUT"
            echo "test_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "testing ${PYPI_PACKAGE}==${ref}; reason=${reason}"
          else
            echo "need_to_test=false" >> "$GITHUB_OUTPUT"
            echo "no PyPI release or doc changes"
          fi

      - name: Run quick start test
        id: quick-start-test
        if: steps.decide.outputs.need_to_test == 'true'
        env:
          NPU_READY: "true"
          UPSTREAM_REF: ${{ steps.decide.outputs.test_ref }}
        working-directory: workflows/projects/diffsynth-studio
        run: |
          set -euo pipefail
          python -m pip install 'mistune>=3,<4'
          constraint_file=/tmp/diffsynth-studio-version-constraints.txt
          printf 'diffsynth==%s\n' "$UPSTREAM_REF" > "$constraint_file"
          export PIP_CONSTRAINT="$constraint_file"
          echo "constraining diffsynth to ${UPSTREAM_REF}"
          python -m unittest tests.test_quick_start_ascend -v 2>&1

      - name: Record monitor outcome
        id: record-monitor-outcome
        if: |
          !cancelled() && github.event_name == 'schedule' &&
          steps.decide.outputs.need_to_test == 'true'
        env:
          CONCLUSION: ${{ steps.quick-start-test.conclusion }}
        run: |
          set -euo pipefail
          case "$CONCLUSION" in
            success) result=success; error=none ;;
            failure) result=failure; error="test failed" ;;
            skipped) result=failure; error="prior step failed before test could run" ;;
            *) result=failure; error="unknown conclusion (${CONCLUSION})" ;;
          esac

          last_release_version=""
          doc_hash=""
          test_result=""
          test_error=""
          . .monitor-state/.monitor
          test_result="$result"
          test_error="$error"
          {
            echo "last_release_version='$last_release_version'"
            echo "doc_hash='$doc_hash'"
            echo "test_result='$test_result'"
            echo "test_error='$test_error'"
          } > .monitor-state/.monitor
          {
            echo "monitor_last_release_version=$last_release_version"
            echo "monitor_doc_hash=$doc_hash"
            echo "monitor_test_result=$test_result"
            echo "monitor_test_error=$test_error"
          } >> "$GITHUB_OUTPUT"

      - name: Write result and summarize
        id: write-result
        if: |
          !cancelled() && steps.decide.outputs.need_to_test == 'true'
        env:
          TRIGGER: ${{ github.event_name }}
          REASON: ${{ steps.decide.outputs.reason }}
          TARGET_REF: ${{ steps.decide.outputs.test_ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p output
          jq -n \
            --arg trigger "$TRIGGER" \
            --arg reason "$REASON" \
            --arg target_repo "$UPSTREAM_REPO" \
            --arg target_ref "$TARGET_REF" \
            --arg path "$DOC_PATH" \
            --arg image "$CI_IMAGE" \
            --arg job_status "$JOB_STATUS" \
            '{
              trigger: $trigger,
              reason: $reason,
              target_repo: $target_repo,
              target_ref: $target_ref,
              path: $path,
              image: $image,
              job_status: $job_status
            }' > output/result.json
          printf 'result_json=%s\n' "$(jq -c . output/result.json)" >> "$GITHUB_OUTPUT"
          cat output/result.json
          echo "tested PyPI release: ${PYPI_PACKAGE}==${TARGET_REF}"

  publish-and-persist:
    name: publish result.json + persist monitor state
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows
          fetch-depth: 1

      - name: Materialize result.json
        env:
          RESULT_JSON: ${{ needs.test.outputs.result_json }}
        run: |
          set -euo pipefail
          mkdir -p output
          if [ -z "$RESULT_JSON" ]; then
            echo "no result.json to publish"
            exit 0
          fi
          printf '%s\n' "$RESULT_JSON" > output/result.json

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s output/result.json ]; then
            echo "result.json is empty; skipping schema validation"
            exit 0
          fi
          python3 -m pip install -q "check-jsonschema==0.38.0"
          check-jsonschema \
            --schemafile workflows/schemas/result.schema.json output/result.json

      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diffsynth-studio-quick-start-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn

      - name: Restore monitor state to disk
        if: github.event_name == 'schedule' && needs.test.outputs.need_to_test == 'true' && needs.test.outputs.reason != ''
        env:
          LAST_RELEASE_VERSION: ${{ needs.test.outputs.monitor_last_release_version }}
          DOC_HASH: ${{ needs.test.outputs.monitor_doc_hash }}
          TEST_RESULT: ${{ needs.test.outputs.monitor_test_result }}
          TEST_ERROR: ${{ needs.test.outputs.monitor_test_error }}
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          {
            echo "last_release_version='$LAST_RELEASE_VERSION'"
            echo "doc_hash='$DOC_HASH'"
            echo "test_result='$TEST_RESULT'"
            echo "test_error='$TEST_ERROR'"
          } > .monitor-state/.monitor
          cat .monitor-state/.monitor

      - name: Persist monitor state to cache
        if: github.event_name == 'schedule' && needs.test.outputs.need_to_test == 'true' && needs.test.outputs.reason != ''
        uses: actions/cache/save@v6
        with:
          path: .monitor-state
          key: monitor-state-diffsynth-studio-pypi-${{ github.run_id }}
