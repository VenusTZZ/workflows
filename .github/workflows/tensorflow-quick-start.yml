# TensorFlow 1.15 + TF Adapter 9.1.0 Ascend quick-start guard. The
# shared engine owns monitoring, retry state, result publication, and
# cache relay; this caller only declares the fixed compatibility stack.
name: tensorflow-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'tensorflow-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tensorflow-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: tensorflow
      # The official add example is single-device; the runner supplies
      # one configured NPU without caller-side --device/driver mounts.
      test_runner: '["linux-aarch64-a2-1"]'
      # Same CANN 9.1.0 / 910B / Ubuntu 22.04 baseline as ms-swift.
      # The devel variant supplies the compiler needed by official h5py 2.8.0.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12-devel
      container_options: ''
      timeout_minutes: 120
      upstream_repo: tensorflow/tensorflow
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/tensorflow/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/tensorflow/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
