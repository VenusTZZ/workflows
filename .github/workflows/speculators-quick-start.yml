# speculators quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.

name: speculators-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'speculators-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 3 hours: '30 */3 * * *' fires at minute 30 of every
    # 3rd hour (00:30, 03:30, 06:30, ..., 21:30). GitHub Actions caps
    # schedule at 5 min minimum, so tighter cadences need
    # workflow_dispatch instead.
    - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speculators-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-speculators_*), artifacts
      # (speculators-quick-start-<run_id>) and the test working dir
      # (workflows/projects/speculators).
      project: speculators
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      # Pre-built vllm-ascend v0.23.0 image (Huaweicloud mirror of the
      # upstream ``quay.io/ascend/vllm-ascend:v0.23.0`` image). Ships
      # vllm==0.23.0 + vllm-ascend==0.23.0 + triton-ascend==3.2.2 +
      # triton 3.5.0 + torch 2.10.0+cpu + torch_npu 2.10.0.post4 + CANN
      # 9.1.0 pre-installed, so the doc's ``## 前置安装`` section only
      # verifies versions + installs modelscope — no source build, no
      # pip install of the vllm / vllm-ascend / triton-ascend wheels.
      # Huaweicloud mirror chosen for cluster egress (cluster can't
      # reach quay.io directly). New convention for projects whose test
      # body uses vllm-ascend; bare CANN remains for projects that
      # don't (peft / diffusers / etc.).
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
      container_options: >-
        --volume=/data/ci-cache/modelscope/speculators:/root/.cache/modelscope
      # 4-step pipeline budget (convert → extract_hidden_states →
      # torchrun train → vllm-ascend serve + curl smoke):
      #   Step 2 vllm.LLM() offline: 5-7 min (Qwen3-8B weight load + 10 prompts)
      #   Step 3 torchrun 1 epoch × 10 samples: 8-12 min (single-card A2)
      #   Step 4 vllm-ascend serve + curl: 3-4 min cold + 30s smoke
      # Plus 17 GB ModelScope first-pulls on cold cache (DFlash ~1 GB +
      # Qwen3-8B ~16 GB). DEFAULT_COMMAND_TIMEOUT=1800 (30 min) caps each
      # #test block. 180 min covers worst-case cold caches + retries
      # without killing the run (no more vllm source build on cold path —
      # image ships it pre-installed).
      timeout_minutes: 180
      upstream_repo: vllm-project/speculators
      # speculators is a new project — no legacy workflow to migrate
      # from. The quick-start-monitor-state-speculators_ cache prefix is owned by
      # this workflow alone (first-write wins; subsequent runs read).
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/speculators/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/speculators/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/speculators; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep and installs live in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1