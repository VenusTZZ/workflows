# xllm quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# This file follows the pattern of ms-swift-quick-start.yml.
# Cache keys (quick-start-monitor-state-xllm_*) and artifact names
# are derived from project=xllm.

name: xllm-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'xllm-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  #schedule:
    # Run every 6 hours: '30 */6 * * *' fires at minute 30 of every
    # 6th hour (00:30, 06:30, 12:30, 18:30).
  #   - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xllm-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-xllm_*), artifacts
      # (xllm-quick-start-<run_id>) and the test working dir
      # (workflows/projects/xllm).
      project: xllm
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/xllm-ai/xllm-ai:xllm-0.10.0-release-hb-rc2-arm
      container_options: >-
        --volume=/data/ci-cache/modelscope/xllm:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: xLLM-AI/xllm
      # Doc URL points to the quick start doc in this repo (cosdt-ci-test/workflows).
      # The monitor hashes it and the test fetches the same URL.
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/xllm/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/xllm/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/xllm; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1