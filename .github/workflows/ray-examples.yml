# Ray NPU examples guard. Upstream tests and project-owned NPU conformance
# cases share one manifest and the reusable examples guard engine.
name: ray-examples

concurrency:
  group: ${{ github.event_name == 'schedule' && 'ray-examples-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the expanded matrix is green on the NPU runners.
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target Ray repository to checkout and test
        required: false
        default: ray-project/ray
        type: string
      target_ref:
        description: Tag, branch, or SHA; empty selects the latest release
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  ray-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      project: ray
      upstream_repo: ray-project/ray
      target_repo: ${{ inputs.target_repo }}
      target_ref: ${{ inputs.target_ref }}
      default_branch: master
      max_parallel: 2
