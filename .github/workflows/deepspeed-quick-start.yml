# DeepSpeed quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
name: deepspeed-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'deepspeed-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepspeed-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: deepspeed
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 180
      upstream_repo: deepspeedai/DeepSpeed
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/deepspeed/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/deepspeed/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1