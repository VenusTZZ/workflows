# InternLM Ascend Quick Start guard. InternLM's NPU guide was added after its
# latest GitHub release, so this caller deliberately monitors upstream main.
name: internlm-quick-start

concurrency:
  # The 8B model cache is host-mounted and shared. Serialize schedule and
  # manual runs so two snapshot downloads cannot write the same cache at once.
  group: internlm-quick-start
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '35 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internlm-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: internlm
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/internlm:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: InternLM/InternLM
      fixed_ref: main
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/internlm/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/internlm/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
