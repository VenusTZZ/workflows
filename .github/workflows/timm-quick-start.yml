# timm quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: concurrency,
# runner, container image + options, upstream repo, monitored doc,
# and the test entry command. The guard loop, cache I/O, state relay
# and publishing all live in the engine.
#
# Engine-fixed behaviours this trigger relies on (declared in the
# engine, NOT here):
#   * cache key prefix: quick-start-monitor-state-timm_  (from inputs.project)
#   * artifact name:    timm-quick-start-<run_id>
#   * result.json is written by the engine and validated against
#     schemas/result.schema.json before upload.
#
# Schedule is enabled (same cadence as peft). The engine's
# schedule-only steps (monitor / record-monitor-outcome / cache save)
# are active.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-1`)
# auto-passes `/dev/davinci*` into the container via the cluster
# device-plugin. The doc downloads pretrained weights to the default
# modelscope cache (`~/.cache/modelscope`), so a shared cache volume
# is mounted for CI persistence (same convention as trl / peft).
# check-torch expects `count: 1`.

name: timm-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  # The schedule branch is kept (even though schedule is not enabled
  # yet) so re-enabling the cron later needs no concurrency change.
  group: ${{ github.event_name == 'schedule' && 'timm-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # Run every 3 hours: '45 */3 * * *' fires at minute 45 of every
  # 3rd hour (00:45, 03:45, 06:45, ..., 21:45). Same cadence as peft.
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timm-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-timm_*), artifacts
      # (timm-quick-start-<run_id>) and the test working dir
      # (workflows/projects/timm).
      project: timm
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # Doc body does: uv pip install timm + two #test smoke commands
      # (inference / features). Weights auto-download from modelscope
      # to the shared cache volume. 120 min covers cold cache + first-time
      # wheel pulls + the ~45 MB model download + smoke commands.
      container_options: >-
        --volume=/data/ci-cache/modelscope/timm:/root/.cache/modelscope
      timeout_minutes: 120
      upstream_repo: huggingface/pytorch-image-models
      # Raw URL the engine's monitor hashes and the test fetches;
      # doc-hash state lives under the quick-start-monitor-state-timm_ cache prefix.
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/timm/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/timm/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/timm; env contract (MONITORED_DOC_URL /
      # NPU_READY) is injected by the engine. All project env prep and
      # installs live in the test subclass's prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
