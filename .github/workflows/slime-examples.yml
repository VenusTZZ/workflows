# slime examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml; this
# file only declares what varies per project: schedule, concurrency,
# upstream repo, dispatch input forwarding, and matrix parallelism.
# The guard loop (release-only monitor / manifest-check / run-example
# matrix / validate-results / save-monitor-state) lives in the engine.
# See docs/examples-guard-engine.md for the design.
#
# Ascend-specific note: THUDM/slime publishes releases but has no NPU
# support; the Ascend adaptation lives in the gitcode fork
# gitcode.com/Ascend/slime-ascend (no releases, main branch only). The
# engine's checkout and release monitor are GitHub-only, so this guard
# monitors THUDM/slime releases for the trigger signal and manifest
# validation tree, while projects/slime/scripts/setup_example.sh clones
# the fork main HEAD at CI time and installs slime from it. The tested
# code is therefore fork main HEAD; the trigger signal is the upstream
# release tag.

name: slime-examples

concurrency:
  # Schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'slime-examples-schedule' || format('manual-{0}', github.run_id) }}
  # A run cancelled mid-way loses its outcome writeback, and that outcome
  # drives the next scheduled cycle's retry.
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual rounds
  # are green. Re-enable:
  # schedule:
  #   - cron: '45 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA of THUDM/slime to test (empty resolves to upstream latest release)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called workflows
# run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  slime-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces monitor-state cache keys, artifact names, and the
      # scheduling paths under projects/slime.
      project: slime
      # Release signal + manifest-check tree come from the upstream repo;
      # the Ascend fork is cloned and installed by setup_example.sh.
      upstream_repo: THUDM/slime
      target_ref: ${{ inputs.target_ref }}
      # Bring-up phase: one matrix leg at a time while the heavy
      # install stack settles. Raise after the first green rounds.
      max_parallel: 1

