name: transformers-quick-start

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Ref to test (empty = latest upstream release tag)
        required: false
        default: ''
        type: string

concurrency:
  group: transformers-quick-start
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: huggingface/transformers
  MONITORED_DOC_URL: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/transformers/docs/Quick-start-Ascend.md
  GH_API: https://api.github.com
  CI_IMAGE: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12

jobs:
  monitor-and-test:
    runs-on: linux-aarch64-a2-1
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    outputs:
      result_json: ${{ steps.result.outputs.result_json }}
    container:
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/pip:/root/.cache/pip
        --volume=/data/ci-cache/modelscope:/root/.cache/modelscope
    env:
      ASCEND_RT_VISIBLE_DEVICES: '0'
      TARGET_ROOT: ${{ github.workspace }}/target
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: repo.huaweicloud.com
      HF_ENDPOINT: https://hf-mirror.com
      MODELSCOPE_CACHE: /root/.cache/modelscope
      PIP_TIMEOUT: '120'
    steps:
      # Manual dispatch always tests the latest release tag (or INPUT_REF).
      # Schedule runs compare the local guard doc hash and latest release id
      # before spending NPU time; the resolved ref is the latest release tag.
      - name: Restore state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: transformers-quick-start-monitor-state-${{ github.run_id }}
          restore-keys: transformers-quick-start-monitor-state-
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows
      - name: Monitor signals
        id: monitor
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "${INPUT_REF:-}" ]; then
              echo "test_ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            else
              tag=$(curl -fsSL --retry 3 "$GH_API/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name // empty')
              [ -n "$tag" ] || { echo "ERROR: failed to resolve latest upstream release tag"; exit 1; }
              echo "test_ref=$tag" >> "$GITHUB_OUTPUT"
            fi
            echo changed=true >> "$GITHUB_OUTPUT"
            echo reason=manual >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_json=$(curl -fsSL --retry 3 "$GH_API/repos/$UPSTREAM_REPO/releases/latest")
          doc=$(curl -fsSL --retry 3 "$MONITORED_DOC_URL" | sha256sum | cut -d' ' -f1)
          release=$(echo "$release_json" | jq -r '.id // empty')
          release_tag=$(echo "$release_json" | jq -r '.tag_name // empty')
          changed=false; reason=; ref="$release_tag"
          if [ "$(cat .monitor-state/.doc_hash 2>/dev/null || true)" != "$doc" ]; then changed=true; reason=doc; fi
          if [ "$(cat .monitor-state/.release_id 2>/dev/null || true)" != "$release" ]; then changed=true; reason=release; fi
          echo "$doc" > .monitor-state/.doc_hash
          echo "$release" > .monitor-state/.release_id
          echo changed=$changed >> "$GITHUB_OUTPUT"
          echo test_ref=$ref >> "$GITHUB_OUTPUT"
          echo reason=$reason >> "$GITHUB_OUTPUT"
      - name: Check NPU
        if: steps.monitor.outputs.changed == 'true'
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info
          python -c "import torch, torch_npu; print(torch.__version__, torch_npu.__version__, torch.npu.device_count())" || true
      - name: Checkout target
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.monitor.outputs.test_ref }}
          path: target
          fetch-depth: 1
      - name: Pre-download model from ModelScope
        if: steps.monitor.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m pip install modelscope
          python -c "import os; from modelscope import snapshot_download; print(snapshot_download('Qwen/Qwen2.5-1.5B-Instruct'))" > /tmp/qwen_path
          printf 'QUICK_START_MODEL=%s\n' "$(cat /tmp/qwen_path)" >> "$GITHUB_ENV"

      - name: Install target and run Quick Start
        if: steps.monitor.outputs.changed == 'true'
        run: |
          set -euo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python -m pip install -U pip
          # Reuse the image's NPU torch stack when available. The fallback
          # keeps the workflow usable if the selected CANN image was rebuilt
          # without torch_npu.
          if python -c "import torch, torch_npu; print(torch.__version__, torch_npu.__version__, torch.npu.device_count())"; then
            echo "reusing image torch stack"
          else
            python -m pip install --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
              torch==2.9.0 torch_npu==2.9.0.post2
          fi
          python -m pip install -e target
          python -m pip install accelerate
          mkdir -p output
          python -m unittest discover -s workflows/projects/transformers/tests -p 'test_quick_start_ascend.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/output/quick-start.log"
      - name: Write result
        id: result
        if: always()
        # Result generation stays on the NPU job; the JSON content is handed
        # off via the `result_json` job output to publish-and-persist (ubuntu-latest).
        env:
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.monitor.outputs.changed }}
          REF: ${{ steps.monitor.outputs.test_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          RESULT_JSON="$(python3 -c 'import json,os; print(json.dumps({"trigger":os.environ["GITHUB_EVENT_NAME"],"target_repo":os.environ["UPSTREAM_REPO"],"target_ref":os.environ.get("REF") or "main","path":"projects/transformers/docs/Quick-start-Ascend.md","image":os.environ["CI_IMAGE"],"job_status":os.environ["STATUS"],"tests_ran":os.environ.get("CHANGED") == "true"}))')"
          printf '%s\n' "$RESULT_JSON" > output/result.json
          printf 'result_json=%s\n' "$RESULT_JSON" >> "$GITHUB_OUTPUT"
      # result.json is handed off via the `result_json` job output (see the
      # publish-and-persist job on ubuntu-latest). The NPU runner cannot reach
      # GitHub's artifact blob storage, so we do not upload from here.
      - name: Persist state
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: transformers-quick-start-monitor-state-${{ github.run_id }}-post
    
  publish-and-persist:
    name: publish result.json + persist monitor state
    needs: monitor-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides schemas/result.schema.json)
        uses: actions/checkout@v4
        with:
          path: workflows
          fetch-depth: 1

      - name: Materialize result.json
        env:
          RESULT_JSON: ${{ needs.monitor-and-test.outputs.result_json }}
        run: |
          set -euo pipefail
          mkdir -p output
          if [ -z "$RESULT_JSON" ]; then
            echo "no result_json from monitor-and-test; nothing to publish"
            exit 0
          fi
          printf '%s\n' "$RESULT_JSON" > output/result.json
          echo "materialized $(wc -c < output/result.json) bytes:"
          cat output/result.json

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s output/result.json ]; then
            echo "result.json is empty; skipping schema validation"
            exit 0
          fi
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile workflows/schemas/result.schema.json output/result.json

      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformers-quick-start-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn
