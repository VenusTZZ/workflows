# wenet quick start guard - project thin trigger.
#
# The shared quick-start template owns monitoring, cache state, result
# validation, and artifact publishing. Project-specific environment setup
# and document execution live in projects/wenet/tests.

name: wenet-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'wenet-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wenet-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: wenet
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:8.0.0-910b-ubuntu22.04-py3.10
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope/wenet:/root/.cache/modelscope
      # Full aishell-1 flow (~15.6 GB download + cmvn + 5 conformer
      # epochs over 120k utts with the upstream-default DataLoader +
      # 4-mode decode of 7176 test utts + jit export) lands in the
      # 6-12 h range on a single 910B4; 120 min was mock-data-era only.
      # Schedule stays off while a single run eats half a day.
      timeout_minutes: 720
      upstream_repo: wenet-e2e/wenet
      fixed_ref: main
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/wenet/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/wenet/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
