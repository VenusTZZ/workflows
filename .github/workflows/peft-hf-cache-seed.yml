# peft HF cache seeder - manual maintenance workflow.
#
# Why: the peft examples load hub-id models (roberta-base /
# bert-base-uncased / bigscience/mt0-small / facebook/dinov2-base) and
# hub datasets (glue, financial_phrasebank, beans, imdb) at run time.
# Their weight/parquet files are xet-backed: hf-mirror 302s them to
# cas-bridge.xethub.hf.co, whose connectivity from the runner cluster
# is intermittent - every example run gambles on it (run 35062862773:
# one leg pulled roberta-base fine, a sibling leg timed out 5/5 on the
# same file).
#
# This workflow removes the gamble WITHOUT touching peft's example
# setup: it warms the persistent per-machine caches (~/.cache/huggingface,
# ~/.cache/modelscope) via projects/peft/scripts/seed_hf_cache.py, so
# later peft-examples legs on the same machine resolve everything
# locally (model sha match -> snapshot hit; datasets -> arrow cache
# hit). Idempotent - re-dispatch any time; an already-warm machine
# finishes in a couple of minutes (hash re-validation only).
#
# The matrix fans out so one dispatch probabilistically covers several
# runner machines; dispatch again if a leg landed on an already-warm
# one. Re-dispatch when:
#   - an upstream repo moved (sha drift -> runtime misses -> re-seed)
#   - new examples / models join the supported list
#   - the seed failed in a bad cas-bridge window (it retries
#     internally; the next dispatch rides a better window)

name: peft-hf-cache-seed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peft-hf-cache-seed
  # idempotent, but let a running seed finish instead of cancelling
  cancel-in-progress: false

jobs:
  seed:
    runs-on: linux-aarch64-a2-1
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Idempotent copies; the scheduler spreads them over the pool.
        slot: [1, 2, 3, 4]
    container:
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    env:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      # re-hash cached modelscope files; a corrupt cache self-heals here
      # instead of failing example runs later
      MODELSCOPE_ENABLE_DEFAULT_HASH_VALIDATION: "true"
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4

      - name: Install downloader stack
        run: |
          python -m pip install -U pip
          python -m pip install "modelscope==1.37.0" "huggingface_hub<1.0" \
            "datasets>=4.7.0,<6" evaluate requests

      - name: Seed HF + modelscope caches
        run: python projects/peft/scripts/seed_hf_cache.py
