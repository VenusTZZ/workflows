# opencv examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (monitor / manifest-check / run-example
# matrix / validate-results / save-monitor-state) lives in the engine.
#
# === Status (2026-09-22) ===
# supported = 3 self-hosted NPU smoke scripts (source: project,
# projects/opencv/example/), all verified on 910B4 + CANN 9.1.0:
#   - test_npu_dnn_classification.py   mobilenetv2-12 ONNX via
#     DNN_BACKEND_CANN + DNN_TARGET_NPU, top-1=372 vs CPU reference
#   - test_npu_dnn_superres.py         super-resolution-10 ONNX (static
#     224x224, single output; fcn-resnet50 segmentation fails on CANN:
#     dynamic H/W + dual output -> createOutputDataset ret=100000)
#   - test_npu_cann_ops.py             cv2.cann classic ops vs CPU
#     reference (cvtColor/flip/rotate/transpose/merge/split/add/subtract/
#     bitwise; resize/crop are DVPP-VPC-broken on 910B4, threshold is
#     AscendC-broken, uint8 arithmetic saturation diverges from CPU)
# Upstream samples/ has no CANN-selectable sample (samples/dnn/common.py
# backend/target maps lack cann/npu; classic DNN samples are GUI-bound),
# hence the self-hosted legs. setup_example.sh source-builds opencv-cann
# (~23 min cold) via scripts/patch_opencv_cann.py (8 CANN 9.1.0/aarch64
# source patches, extracted from build_opencv_cann.sh).
# schedule stays DISABLED until the first green manual run:
#   schedule:
#     - cron: '0 */6 * * *'

name: opencv-examples

concurrency:
    # schedule runs serialize; each manual run gets its own group so a
    # dispatch is never blocked behind a scheduled run.
    group: ${{ github.event_name == 'schedule' && 'opencv-examples-schedule' || format('manual-{0}', github.run_id) }}
    # false: a run cancelled mid-way loses its outcome writeback, and
    # the outcome is what drives the next cycle's retry.
    cancel-in-progress: false

on:
    # Bring-up phase: schedule disabled until the first manual dispatch
    # is green (see file header — model seeding + first CI run).
    workflow_dispatch:
        inputs:
            target_ref:
                description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
                required: false
                default: ''
                type: string

# Engine jobs query the GitHub Job API (validate-results) — actions:read
# must be granted here; called workflows inherit caller permissions.
permissions:
    actions: read
    contents: read

jobs:
    opencv-examples:
        uses: ./.github/workflows/examples-template.yml
        with:
            project: opencv
            # supported = 3 self-hosted NPU smoke legs (source: project,
            # see manifest). max_parallel 4 lets all 3 legs run in
            # parallel; each leg's setup_example.sh source-builds
            # opencv-cann (~23 min cold @-j2) when the image has no
            # pre-built install, so cold pods serialize on the shared
            # runner regardless.
            upstream_repo: opencv/opencv
            target_ref: ${{ inputs.target_ref }}
            max_parallel: 4
