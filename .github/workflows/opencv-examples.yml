# opencv examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (monitor / manifest-check / run-example
# matrix / validate-results / save-monitor-state) lives in the engine.
#
# === Status (2026-09-18) ===
# The self-hosted quickstarts (projects/opencv/examples/
# quickstart_py_version.py / quickstart_dnn_inference.py /
# quickstart_cann_unit_tests.sh) and the fork-mirror (A) / engine
# pre-check-sync (B) plan they required are RETIRED: the examples
# directory is deleted and the manifest's supported section now points
# at real upstream samples/ paths (the 5.0.0 LLM/VLM inference
# samples: gpt2 / gemma3 / qwen / vlm _inference.py), so
# manifest-check passes against plain opencv/opencv — no fork, no
# engine tweak.
# schedule stays DISABLED until the first manual dispatch is green:
# the 4 supported legs are source-analysis picks (headless + ONNX +
# zero non-cv2 deps) but have NOT been run in CI yet, and their ONNX
# models + tokenizer configs must be seeded into
# projects/opencv/fixtures/models/ first (see the manifest header's
# model-seeding contract). Re-enable the cron after a green run:
#   schedule:
#     - cron: '0 */6 * * *'

name: opencv-examples

concurrency:
    # schedule runs serialize; each manual run gets its own group so a
    # dispatch is never blocked behind a scheduled run.
    group: ${{ github.event_name == 'schedule' && 'opencv-examples-schedule' || format('manual-{0}', github.run_id) }}
    # false: a run cancelled mid-way loses its outcome writeback, and
    # the outcome is what drives the next cycle's retry.
    cancel-in-progress: false

on:
    # Bring-up phase: schedule disabled until the first manual dispatch
    # is green (see file header — model seeding + first CI run).
    workflow_dispatch:
        inputs:
            target_ref:
                description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
                required: false
                default: ''
                type: string

# Engine jobs query the GitHub Job API (validate-results) — actions:read
# must be granted here; called workflows inherit caller permissions.
permissions:
    actions: read
    contents: read

jobs:
    opencv-examples:
        uses: ./.github/workflows/examples-template.yml
        with:
            project: opencv
            # Upstream-native: the manifest's supported entries are real
            # samples/ paths in opencv/opencv (5.0.0 LLM/VLM inference
            # samples), so manifest-check validates against the upstream
            # tree directly.
            upstream_repo: opencv/opencv
            target_ref: ${{ inputs.target_ref }}
            # 2 (not 4): keep matrix pressure low on the shared NPU
            # runner. The matrix is 4 supported entries (gpt2 / gemma3 /
            # qwen / vlm inference); they currently run the OPENCV CPU
            # backend (see manifest header), but the setup leg still
            # builds opencv-cann on this runner, so serialization
            # matters. The 5 doc-snippet CPU algorithms run as a
            # setup_example.sh step-5 sanity check, not matrix legs.
            max_parallel: 2
