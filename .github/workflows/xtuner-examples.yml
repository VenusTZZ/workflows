# xtuner examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in
# the engine. See docs/examples-guard-engine.md for the design.

name: xtuner-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'xtuner-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual
  # rounds are green (same policy as peft-examples.yml /
  # accelerate-examples.yml). Re-enable:
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (defaults to v0.2.0; the latest xtuner release whose xtuner/__init__.py is not entirely commented out — main HEAD and v1.0.x shipped an empty __init__.py that breaks `from xtuner import DS_CEPH_DIR` on every demo_data/*/config recipe)
        required: false
        default: v0.2.0
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  xtuner-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-xtuner_*),
      # artifact names and the scheduling paths under
      # projects/xtuner.
      project: xtuner
      upstream_repo: InternLM/xtuner
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4
