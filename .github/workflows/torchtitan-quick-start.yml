# torchtitan quick start guard - project thin trigger.

name: torchtitan-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'torchtitan-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torchtitan-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: torchtitan
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/torchtitan:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: pytorch/torchtitan
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/torchtitan/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/torchtitan/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1