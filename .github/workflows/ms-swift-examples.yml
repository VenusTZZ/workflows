# ms-swift examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in
# the engine. See docs/examples-guard-engine.md for the design and
# docs/ms-swift-examples-guard.md for the project-level design
# (manifest-driven scheduling, script contract, multi-card legs).
#
# This repo's original examples-guard exemplar; migrated to the shared
# engine last of the eleven legacy pipelines.

name: ms-swift-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'ms-swift-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # Temporarily disabled to save NPU runner time. Re-enable when ready.
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  ms-swift-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-ms-swift_*),
      # artifact names and the scheduling paths under
      # projects/ms-swift.
      project: ms-swift
      upstream_repo: modelscope/ms-swift
      target_ref: ${{ inputs.target_ref }}
      # 12 supported legs incl. 8-card a2-8 runs; the legacy matrix
      # capped concurrency at 4 on purpose.
      max_parallel: 4
