name: ms-swift-examples

on:
  # Temporarily disabled to save NPU runner time. Re-enable when ready.
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target ms-swift repository to checkout and run
        required: true
        default: modelscope/ms-swift
        type: string
      target_ref:
        description: Branch, tag, or SHA in the target repository
        required: true
        default: main
        type: string

concurrency:
  group: ms-swift-examples
  cancel-in-progress: false

permissions:
  actions: read
  contents: read


env:
  UPSTREAM_REPO: modelscope/ms-swift
  GH_API: https://api.github.com

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      trigger: ${{ steps.decide.outputs.trigger }}
      reason: ${{ steps.decide.outputs.reason }}
      target_repo: ${{ steps.decide.outputs.target_repo }}
      target_ref: ${{ steps.decide.outputs.target_ref }}
    steps:
      - name: Restore monitor state
        id: cache-restore
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # The per-run key always misses; restore-keys picks the latest
          # save. Must not share a prefix with ms-swift-quick-start's
          # quick-start-monitor-state-ms-swift_ keys (restore-keys
          # matches prefixes).
          key: ms-swift-examples-monitor-state-${{ github.run_id }}
          restore-keys: |
            ms-swift-examples-monitor-state-

      # path=examples matches scan.root in the manifest.
      - name: Monitor upstream examples tree
        id: monitor-examples
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          SHA=$(curl -fsSL --retry 3 \
            "$GH_API/repos/$UPSTREAM_REPO/commits?sha=main&path=examples&per_page=1" \
            | jq -r '.[0].sha // empty')
          OLD=$(cat "$STATE_DIR/.examples_head" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.examples_outcome" 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > "$STATE_DIR/.examples_head"
            echo "success" > "$STATE_DIR/.examples_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "reason=examples" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "reason=examples-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "examples_head=$SHA outcome=$OUTCOME"

      - name: Monitor upstream latest release tag
        id: monitor-release
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          TAG=$(curl -fsSL --retry 3 \
            "$GH_API/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name // empty')
          OLD=$(cat "$STATE_DIR/.last_release_tag" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.release_outcome" 2>/dev/null || echo "")
          if [ -n "$TAG" ] && [ "$OLD" != "$TAG" ]; then
            echo "$TAG" > "$STATE_DIR/.last_release_tag"
            echo "success" > "$STATE_DIR/.release_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$TAG outcome=$OUTCOME"

      - name: Monitor upstream main HEAD
        id: monitor-commit
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          SHA=$(curl -fsSL --retry 3 \
            "$GH_API/repos/$UPSTREAM_REPO/commits/main" | jq -r '.sha // empty')
          OLD=$(cat "$STATE_DIR/.last_tested_sha" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.commit_outcome" 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > "$STATE_DIR/.last_tested_sha"
            echo "success" > "$STATE_DIR/.commit_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "reason=commit" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "reason=commit-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "main_sha=$SHA outcome=$OUTCOME"

      - name: Persist monitor state
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: ms-swift-examples-monitor-state-${{ github.run_id }}

      # Schedule picks the ref by priority examples > release > commit;
      # manual runs always proceed with the given inputs.
      - name: Decide target
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.target_repo }}
          INPUT_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "trigger=workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            echo "target_repo=${INPUT_REPO:-$UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
            echo "target_ref=${INPUT_REF:-main}" >> "$GITHUB_OUTPUT"
            echo "resolved repo=${INPUT_REPO:-$UPSTREAM_REPO} ref=${INPUT_REF:-main} (manual)"
            exit 0
          fi
          CHANGED="false"
          REASON=""
          REF=""
          if [ "${{ steps.monitor-examples.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="${{ steps.monitor-examples.outputs.reason }}"
            REF="${{ steps.monitor-examples.outputs.ref }}"
          elif [ "${{ steps.monitor-release.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="${{ steps.monitor-release.outputs.reason }}"
            REF="${{ steps.monitor-release.outputs.ref }}"
          elif [ "${{ steps.monitor-commit.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="${{ steps.monitor-commit.outputs.reason }}"
            REF="${{ steps.monitor-commit.outputs.ref }}"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "trigger=schedule" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "target_repo=$UPSTREAM_REPO" >> "$GITHUB_OUTPUT"
          echo "target_ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "true" ]; then
            echo "resolved repo=$UPSTREAM_REPO ref=$REF reason=$REASON"
          else
            echo "No upstream changes - skipping manifest check and examples"
          fi

  manifest-check:
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      supported_matrix: ${{ steps.check.outputs.supported_matrix }}
      has_supported: ${{ steps.check.outputs.has_supported }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target

      - name: Check examples manifest
        id: check
        env:
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
        run: |
          python3 -m pip install -q pyyaml
          python3 workflows/scripts/check_examples_manifest.py \
            --target-root target \
            --manifest workflows/projects/ms-swift/examples_manifest.yaml \
            --result-json manifest_check_result.json \
            --target-repo "$TARGET_REPO" \
            --target-ref "$TARGET_REF" \
            --trigger "$TRIGGER"

      - name: Validate manifest check result
        run: |
          python3 -m pip install -q check-jsonschema
          check-jsonschema --schemafile workflows/schemas/manifest_check_result.schema.json \
            manifest_check_result.json

      - name: Upload manifest check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-swift-manifest-check
          if-no-files-found: ignore
          path: manifest_check_result.json

  # Runner, devices, image, timeout, and profile come from each supported
  # manifest entry. Card mounts are derived from npu_devices.
  # Skipped entirely when the manifest has no supported example yet
  # (an empty matrix would fail the whole run).
  run-example:
    name: run-example (${{ matrix.example.path }})
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    env:
      ASCEND_RT_VISIBLE_DEVICES: ${{ matrix.example.npu_devices }}
      MODELSCOPE_CACHE: /root/.cache/modelscope
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/ms-swift
      TARGET_ROOT: ${{ github.workspace }}/target
      FIXTURE_DIR: ${{ github.workspace }}/workflows/projects/ms-swift/fixtures
      PIP_TIMEOUT: "120"
    container:
      image: ${{ matrix.example.image }}
      options: >-
        --shm-size=64g
        ${{ matrix.example.device_options }}
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/pip:/root/.cache/pip
        --volume=/data/ci-cache/modelscope:/root/.cache/modelscope
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info

      - name: Setup example environment
        env:
          PROFILE: ${{ matrix.example.profile }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Check torch_npu
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python -c "import torch, torch_npu; print(torch.__version__, torch_npu.__version__, torch.npu.device_count())"

      - name: Run example
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXEC: ${{ matrix.example.exec }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/train.log"

  validate-results:
    name: publish-result (${{ matrix.example.path }})
    needs: [monitor, manifest-check, run-example]
    if: always() && needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Write result JSON
        env:
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          IMAGE: ${{ matrix.example.image }}
          EXPECTED_JOB_NAME: run-example (${{ matrix.example.path }})
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
              jq -r --arg name "$EXPECTED_JOB_NAME" \
                '.jobs[] | select(.name == $name) | .conclusion'
          )"
          if [ -z "$conclusion" ]; then
            echo "could not find completed job: $EXPECTED_JOB_NAME"
            exit 1
          fi
          case "$conclusion" in
            success|cancelled)
              job_status="$conclusion"
              ;;
            *)
              job_status="failure"
              ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/output"
          export JOB_STATUS="$job_status"
          python3 - <<'EOF'
          import json
          import os

          result = {
              'trigger': os.environ['TRIGGER'],
              'target_repo': os.environ['TARGET_REPO'],
              'target_ref': os.environ['TARGET_REF'],
              'path': os.environ['EXAMPLE_PATH'],
              'image': os.environ['IMAGE'],
              'job_status': os.environ['JOB_STATUS'],
          }
          out = os.path.join(os.environ['GITHUB_WORKSPACE'], 'output', 'result.json')
          with open(out, 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          EOF

      - name: Validate result.json
        run: |
          set -euo pipefail
          python3 -m pip install -q check-jsonschema
          check-jsonschema --schemafile workflows/schemas/result.schema.json \
            output/result.json

      # Artifact upload runs on GitHub-hosted infrastructure. The self-hosted
      # NPU runner only executes the example and reports its normal job status.
      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-swift-examples-${{ github.run_id }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: output/result.json

  # Write this run's outcome back into the monitor state so a failed
  # run is retried on the next cycle.
  record-outcome:
    needs: [monitor, manifest-check, run-example]
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # restore-keys picks the state the monitor job saved this run.
          key: ms-swift-examples-monitor-state-${{ github.run_id }}-post
          restore-keys: |
            ms-swift-examples-monitor-state-

      - name: Record outcome
        env:
          REASON: ${{ needs.monitor.outputs.reason }}
          RUN_RESULT: ${{ needs.run-example.result }}
          MANIFEST_RESULT: ${{ needs.manifest-check.result }}
          HAS_SUPPORTED: ${{ needs.manifest-check.outputs.has_supported }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          # Strip the "-retry" suffix to map back to the base monitor.
          BASE="${REASON%-retry}"
          # A skipped run-example is fine when the manifest has no
          # supported entry; any other non-success must retry.
          if [ "$RUN_RESULT" = "success" ]; then
            OUT="success"
            REASON_TEXT=""
          elif [ "$RUN_RESULT" = "skipped" ] && [ "$MANIFEST_RESULT" = "success" ] \
            && [ "$HAS_SUPPORTED" = "false" ]; then
            OUT="success"
            REASON_TEXT=""
          else
            OUT="failure"
            REASON_TEXT="run-example: ${RUN_RESULT}, manifest-check: ${MANIFEST_RESULT}"
          fi
          echo "${OUT}" > "${STATE_DIR}/.${BASE}_outcome"
          if [ -n "$REASON_TEXT" ]; then
            echo "${REASON_TEXT}" > "${STATE_DIR}/.${BASE}_failure_reason"
          else
            : > "${STATE_DIR}/.${BASE}_failure_reason"
          fi
          echo "outcome for ${BASE}: ${OUT} (${REASON_TEXT:-ok})"

      - name: Persist monitor state
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: ms-swift-examples-monitor-state-${{ github.run_id }}-post
