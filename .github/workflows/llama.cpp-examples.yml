# llama.cpp examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in
# the engine. See docs/examples-guard-engine.md for the design.
#
# The Dream GGUF staging that the legacy pipeline ran as a separate
# prepare-dream-gguf job now lives in the diffusion leg's own setup
# (projects/llama.cpp/scripts/setup_example.sh: setup_cann-diffusion
# calls prepare_dream_gguf.sh - idempotent, flock-protected, shared
# persistent cache). Only that leg pays the cost; no cross-job
# ordering is needed under the engine.

name: llama.cpp-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'llama.cpp-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # First force run must go green before enabling. Do not use 0 */6
  # (that is the ms-swift Quick Start slot).
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to the default branch on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  llama-cpp-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-llama.cpp_*),
      # artifact names and the scheduling paths under
      # projects/llama.cpp.
      project: llama.cpp
      upstream_repo: ggml-org/llama.cpp
      target_ref: ${{ inputs.target_ref }}
      # Upstream default branch is master, not main.
      default_branch: master
      # 19 supported entries; the legacy workflow fired them all at
      # once. 8 keeps runs moving without stacking the whole matrix on
      # the a2-1 pool.
      max_parallel: 8
