# Ollama quick start guard - project thin trigger.
# The shared engine resolves the official upstream release and supplies
# UPSTREAM_REF; the fixture applies the checked-out CANN patch to that ref.
name: ollama-quick-start

concurrency:
  group: ${{ format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # First native CANN build and NPU inference verification is manual.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ollama-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: ollama
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # Persist toolchains, downloads, models, go-build, go-mod and ccache.
      # The source/build working directory is temporary and fixture-owned.
      container_options: '--volume /data/ci-cache/ollama:/ollama-cache'
      # Shared test-job budget for preparation, native build and inference.
      timeout_minutes: 240
      upstream_repo: ollama/ollama
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/ollama/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/ollama/docs/Quick-start-Ascend.md
      # cwd: projects/ollama; foreground service readiness and cleanup live
      # in the fixture, alongside source/patch SHA and NPU evidence checks.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
