# upstream-doc-monitor — 上游文档变化监控（独立 workflow）。

name: upstream-doc-monitor

concurrency:
  group: upstream-doc-monitor
  cancel-in-progress: false

on:
  # 定时调度：每 6 小时一次（UTC 0/6/12/18 点整 = 香港 8/14/20/2 点）。
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: detect doc changes & sync issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore monitor state (baseline)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/upstream-doc-monitor-state.json
          key: upstream-doc-monitor-state-not-exist
          restore-keys: |
            upstream-doc-monitor-state-

      - name: Run doc monitor (detect + sync issues)
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/upstream_doc_monitor.py \
            --config .github/upstream-doc-monitor.yaml \
            --state /tmp/upstream-doc-monitor-state.json \
            --output-dir /tmp/upstream-doc-monitor-report

      - name: Render Step Summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import json, os
          from pathlib import Path

          report_path = Path("/tmp/upstream-doc-monitor-report/report.json")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary or not report_path.is_file():
              raise SystemExit(0)
          r = json.loads(report_path.read_text(encoding="utf-8"))
          s = r["summary"]
          lines = [
              "## upstream-doc-monitor 运行摘要",
              "",
              f"- 触发：`{r['trigger']}` ｜ run：`{r['run_id']}` ｜ "
              f"生成时间：{r['generated_at']}",
              f"- 监控项：{s['monitor_entries']}"
              f"（repo_file {s['by_source']['repo_file']} / "
              f"web_page {s['by_source']['web_page']}）",
              f"- 变化 **{s['changed']}** ｜ 新增 **{s['first_seen']}** ｜ "
              f"无变化 {s['unchanged']} ｜ 异常 **{s['errors']}**",
              f"- Issue 动作：新建 {s['tickets'].get('created', 0)} ｜ "
              f"追加评论 {s['tickets'].get('commented', 0)}",
              "",
          ]
          # report 的 changes 数组包含全部监控项（靠 status 区分），
          # 明细表只列发生实质变化的行（changed / first_seen）。
          changed_rows = [c for c in r["changes"]
                          if c.get("status") in ("changed", "first_seen")]
          if changed_rows:
              lines += ["### 变化明细", "",
                        "| 项目 | 处理人 | 源 | 文档 | 状态 | Issue |",
                        "| --- | --- | --- | --- | --- | --- |"]
              for c in changed_rows:
                  ticket = (f"[{c.get('ticket_action','')}]({c['ticket_url']})"
                            if c.get("ticket_url") else c.get("ticket_action", "-"))
                  lines.append(
                      f"| {c['project']} | "
                      f"{('@' + c['owner']) if c.get('owner') else '-'} | "
                      f"{c['source']} | [{c.get('doc_path') or c['doc_url']}]"
                      f"({c['doc_url']}) | {c['status']} | {ticket} |")
              lines.append("")
          if r["errors"]:
              lines += ["### 异常明细", "",
                        "| 项目 | 处理人 | 源 | 类型 | 详情 | Issue |",
                        "| --- | --- | --- | --- | --- | --- |"]
              for e in r["errors"]:
                  ticket = (f"[{e.get('ticket_action','')}]({e['ticket_url']})"
                            if e.get("ticket_url") else e.get("ticket_action", "-"))
                  doc = e.get("doc_url") or e.get("message", "")
                  lines.append(
                      f"| {e['project']} | "
                      f"{('@' + e['owner']) if e.get('owner') else '-'} | "
                      f"{e['source']} | {e['error_type']} | {doc} | {ticket} |")
              lines.append("")
          if not changed_rows and not r["errors"]:
              lines += ["本轮无变化、无异常。", ""]
          lines += [f"<sub>通知交付面为仓库 Issues（前缀 `[upstream-doc-monitor]`）。</sub>"]
          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s /tmp/upstream-doc-monitor-report/result.json ]; then
            echo "result.json is missing or empty; schema validation failed"
            exit 1
          fi
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile schemas/upstream_doc_monitor_result.schema.json \
            /tmp/upstream-doc-monitor-report/result.json

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-doc-monitor-result-${{ github.run_id }}
          path: /tmp/upstream-doc-monitor-report/result.json
          if-no-files-found: error

      - name: Persist monitor state (baseline)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/upstream-doc-monitor-state.json
          # 每轮落新键：同一 key 二次 save 会被 GitHub 拒绝；run_id 保证唯一。
          key: upstream-doc-monitor-state-${{ github.run_id }}
