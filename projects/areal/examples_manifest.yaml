  # inclusionAI/AEnvironment（k8s+Helm 部署：api-service(Go)/controller/
  # envhub/redis），aenv 的 persistent-bash-env 实例在远端集群创建而非本地
  # 进程，必需 AENV_SYSTEM_URL 指向集群 api-service。CI 容器无该集群、也
  # 无法自建（平台自身要 k8s + 管理沙箱容器 = Docker-in-Docker，同
  # terminal_bench 进不支持的同类）。实测 aenv scheduler_client
  # ConnectError 重试 512s → 600s episode 超时。上游单测亦 mock aenv
  # （"pytest runs without a cluster"）。回归条件：AEnvironment 出单容器
  # 自托管模式，或看护环境可访问某套集群（AENV_SYSTEM_URL 注入）。
  - examples/swe/train_swe_rl.py
