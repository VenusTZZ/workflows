version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py']
  # Files-only 模型（同 peft exclude 语义）：目录递归剪枝，glob 跨目录。
  # xtuner examples/ 下只有 huggingface_trainer/{train_hf,train_lora_hf,train_qlora_hf}.py
  # 是直接 launchable 的 Python example；examples/demo_data/* 是为 `xtuner train`
  # 命令准备的数据/配置包（mmengine config.py + map_fn.py + data.json），不是
  # 可独立 `python xxx.py` 启动的脚本，统一排除避免污染 unsupported 列表。
  exclude:
    - examples/demo_data                       # 整目录：4 套 demo 的 cfg+map_fn+data+README（single_turn / multi_turn_1/2 / pretrain）

# ===== supported（coder npu-2 910B4×2, torch2.11/torch_npu2.11, CANN9.1 实跑 exit 0） =====
supported:
  # HF Trainer 路径：build_model 返回 PreTrainedModel，绕过 SupervisedFinetune 的
  # `build_llm_from_cfg` 入口；Trainer 直接用 plain CausalLM 走 HF 默认 loss。
  # 2026-09-15 coder npu-2 实跑：1 step / Qwen2.5-0.5B / 8 行 alpaca jsonl / NPU 1.79s/it
  # loss=1.78 grad_norm=35.3 exit 0；transfer_to_npu shim 自动让 torch.cuda→torch.npu
  # （xtuner 自身 utils.device.get_device_name() 也走 npu 分支，与 shim 一致）。
  - path: examples/huggingface_trainer/train_hf.py
    profile: xtuner-llm
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${LLM_MODEL_PATH}        # DefaultTrainingArguments 必填：注入 setup 预下载的 0.5B
      - --dataset_name_or_path ${TARGET_ROOT}/fixtures/ci_alpaca_8.jsonl   # xtuner.apis.datasets.alpaca_dataset 默认拉 HF `tatsu-lab/alpaca`：换仓内 8 行 fixture
      - --output_dir ${CI_OUTPUT_DIR}                  # argparse 必填：脚本会 mkdir
      - --per_device_train_batch_size 1                # 默认 1：0.5B 模型 32G NPU 上无压力
      - --max_steps 1                                  # 默认整 epoch：1 步压到 CI 规模
      - --save_strategy no                             # 默认 epoch：1 步训练无 epoch 边界、HF Trainer 报 checkpoint save 异常
      - --logging_steps 1                              # 默认 5：保证 1 步内也打日志（验证训练循环活着）
    timeout_minutes: 30

# ===== unsupported（每条附理由：coder npu-2 2026-09-15 实测 / 静态分析） =====
unsupported:
  # 上游 sft.py bug：`build_llm_from_cfg` 在 llm_cfg 不是 dict 时跳过
  # `llm = self._dispatch_lm_model_cfg(...)` 分支，但下一行无条件引用 `llm`
  # → UnboundLocalError。train_lora_hf.py 走 build_lora_model → SupervisedFinetune(llm)
  # 路径必然命中；CUDA 同样炸，非 NPU 专属
  # （coder npu-2 实跑：UnboundLocalError: cannot access local variable 'llm'，
  # torch_npu ERR99999 跟着 NPU 进程一并挂；不是 NPU 后端问题）
  - examples/huggingface_trainer/train_lora_hf.py

  # 同上 + bnb 4bit：xtuner.apis.model.build_qlora_model 硬编 BitsAndBytesConfig
  # （load_in_4bit / bnb_4bit_quant_type=nf4），PyPI aarch64 无 bnb wheel，
  # bitsandbytes 0.45.0 也未 ship npu 后端
  # （coder 静态分析：xtuner/apis/model.py:11-47 import BitsAndBytesConfig + build_qlora_model
  # 默认 cfg；即使 SupervisedFinetune bug 修了，bnb 也无 NPU 实现）
  - examples/huggingface_trainer/train_qlora_hf.py

  # demo_data 目录：每个子目录都是 mmengine config + map_fn + data.json 三件套，
  # 用法是 `xtuner train examples/demo_data/<name>/config.py`，config.py 头部就
  # `from .map_fn import ...` 相对导入 + `pretrained_model_name_or_path = "internlm/internlm-7b"`
  # + BitsAndBytesConfig 4-bit——三个独立 blocker 直接断 launcher：
  #   1. 相对导入要求 `xtuner train -C <dir>` 把目录当 package，不是裸 `python config.py`
  #   2. InternLM-7B fp16 14 GB + adapter ~16 GB 卡，单卡 32G 紧（脚本未 NPU 实测）
  #   3. BitsAndBytesConfig 同 train_qlora_hf，无 NPU 后端
  # 这条路径的端到端 NPU 验证由 projects/xtuner/docs/Quick-start-Ascend.md 覆盖：
  # `xtuner train` + 拷贝 qwen1_5_1_8b_chat_qlora_custom_sft_e1 cfg 后手工删 quantization_config，
  # 跑 plain LoRA + Qwen1.5-1.8B-Chat，与 docs test 同一回归路径
  # （coder 静态分析：4 个 config.py 头部 import + BitsAndBytesConfig + InternLM-7B
  # 三件套全命中；map_fn.py / data.json / README.md 不是 launchable，已在 scan.exclude 整目录排除）
  - examples/demo_data/single_turn/config.py
  - examples/demo_data/multi_turn_1/config.py
  - examples/demo_data/multi_turn_2/config.py
  - examples/demo_data/pretrain/config.py
