version: 1
scan:
  root: examples
  unit: directories
  marker: CMakeLists.txt
  max_depth: 1
supported:
  - path: examples/simple
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-simple
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 60
  - path: examples/batched
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-batched
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 32
      - -np 4
      - -ngl 99
      - --kv-unified
    timeout_minutes: 60
  - path: examples/embedding
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-embedding
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p "Hello World!"
      - --pooling mean
      - -ngl 99
      - -c 256
    timeout_minutes: 60
  - path: examples/lookahead
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-lookahead
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
      - -c 512
      - -p "Hello my name is"
    timeout_minutes: 60
  - path: examples/lookup
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-lookup
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -c 256
      - -ngl 99
      - -p "the cat sat on the mat the cat sat on the mat"
      - --spec-draft-n-max 4
      - -lcd ${CI_OUTPUT_DIR}/lookup-dyn.bin
    timeout_minutes: 60
  - path: examples/parallel
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-parallel
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -np 2
      - -ns 4
      - --junk 1
      - -pps
      - -c 4096
      - -ngl 99
    timeout_minutes: 60
  - path: examples/speculative
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-speculative
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -md ${LLAMA_CI_MODEL}
      - -p Hello
      - -n 16
      - -c 256
      - -ngl 99
      - -ngld 99
      - --temp 0
      - --spec-draft-n-max 2
    timeout_minutes: 60
  - path: examples/speculative-simple
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-speculative-simple
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -md ${LLAMA_CI_MODEL}
      - --spec-type draft-simple
      - -p Hello
      - -n 16
      - -c 256
      - -ngl 99
      - -ngld 99
      - --temp 0
      - --spec-draft-n-max 2
      - --top-k 1
    timeout_minutes: 60
  - path: examples/passkey
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-passkey
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - --junk 16
      - -ngl 99
      - -v
    timeout_minutes: 60
  - path: examples/debug
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-debug
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 256
      - --save-logits
      - --logits-output-dir ${CI_OUTPUT_DIR}
      - --no-warmup
      - -v
    timeout_minutes: 60
  - path: examples/eval-callback
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-eval-callback
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
    timeout_minutes: 60
  - path: examples/simple-chat
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-simple-chat
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -c 512
      - -ngl 99
    timeout_minutes: 60
  - path: examples/retrieval
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-retrieval
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -ngl 99
      - --pooling mean
      - --context-file ${TARGET_ROOT}/README.md
      - --chunk-size 100
      - --chunk-separator .
      - --top-k 1
      - -c 512
      - -b 512
    timeout_minutes: 60
  - path: examples/convert-llama2c-to-ggml
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-convert-llama2c-to-ggml
    overlay_args:
      - --llama2c-model ${FIXTURE_DIR}/stories260K.bin
      - --copy-vocab-from-model ${FIXTURE_DIR}/tok512.bin
      - --llama2c-output-model ${CI_OUTPUT_DIR}/stories260K.gguf
    timeout_minutes: 60
  - path: examples/gguf
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf
    timeout_minutes: 60
  - path: examples/gguf-hash
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf-hash
    overlay_args:
      - ${FIXTURE_DIR}/ci-demo.gguf
    timeout_minutes: 60
  - path: examples/gen-docs
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gen-docs
    timeout_minutes: 60
  - path: examples/diffusion
    profile: cann-diffusion
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-diffusion-cli
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 64
      - -b 64
      - -ub 32
      - --diffusion-steps 4
      - --diffusion-eps 0.001
      - --diffusion-algorithm 4
      - -v
    # 含冷缓存 prepare（~15GB ModelScope 下载 + Q8_0 转换，旧独立
    # prepare-dream-gguf job 预算 240min）+ CANN 构建 + 运行。暖缓存
    # 时 setup 秒级返回，富余无害。
    timeout_minutes: 300
  - path: examples/simple-cmake-pkg
    profile: cmake-pkg
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/simple-cmake-pkg/build/llama-simple-cmake-pkg
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 90
unsupported:
  - examples/idle
  - examples/sycl
  - examples/training
