  # [资源] ND parallelism：argparse 默认全 1（nd_parallel.py:44-47；旧注
  # "2/2/2 缺 rank 断言"来自 README 示例命令，非脚本默认值）。真实 blocker
  # 是 **容器 host memory cgroup 上限 32GB 撞 8B 模型 FSDP2 init**：
  # 默认模型硬编 Hermes-3-Llama-3.1-8B（nd_parallel.py:39 MODEL_ID），
  # 走 accelerate launch --num_processes 2 + FSDP2 --dp-shard-size 2 时，
  # FSDP2 init 阶段每个 rank 要先把全 16GB bf16 权重 load 到 host RAM 再
  # shard 到 NPU HBM，2 rank × 16GB = 32GB 已经吃满 cgroup，再加上
  # Python/datasets/comms 开销必超。2026-09-17 coder npu-1 实跑：
  # dmesg 显示 oom-kill:constraint=CONSTRAINT_MEMCG，task=python,
  # pid 31483/29156 多次 SIGKILL；--num-steps 1 --sequence-length 128
  # 最小化配置同样被杀。
  # 与 NPU HBM 容量无关：NPU 2×32GB=64GB 装得下 shard+activation。
  # 与 NPU 专属无关：CUDA a2-2 同 32GB cgroup 也 OOM。这是 **container 资源**
  # 问题，需更大 cgroup memory limit 的 pod（a2-7/A2-8 类，64GB+）。
  # nd_parallel_trainer.py:23 同款 Hermes-3-Llama-3.1-8B 默认，同 blocker。
  # 其它小项（log_with=["wandb"]、裸 python dist.all_reduce 无 pg）都属
  # 次要：wandb 已装可跑，dist.all_reduce 只在裸 python 触发，accelerate
  # launch 后无关。
  # （coder 实跑：accelerate launch --num_processes 2 --mixed_precision bf16
  #   nd_parallel.py --dp-shard-size 2 --num-steps {1,3} --sequence-length {128,512}
  #   --model-name <local Hermes> 全部 SIGKILL @ cgroup OOM）
  - examples/torch_native_parallelism/nd_parallel.py
  - examples/torch_native_parallelism/nd_parallel_trainer.py

