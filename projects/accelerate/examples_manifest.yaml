version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py']
  # Files-only 模型（同 peft exclude 语义）：目录递归剪枝，glob 跨目录。
  # 排除"不是 example 的配套物"：配置目录、helper 模块、README、上游 requirements。
  exclude:
    - examples/config_yaml_templates                 # accelerate launcher 配置 yaml
    - examples/deepspeed_config_templates           # deepspeed json 配置
    - examples/slurm                                # slurm 提交脚本 + fsdp 配置
    - examples/torch_native_parallelism/configs     # tp_hsdp / cp yaml
    - examples/torch_native_parallelism/utils.py    # 多文件 example 的 helper
    - examples/alst_ulysses_sequence_parallelism    # 配置 + .sh launcher，源在 unsupported
    - examples/inference/pippy/requirements.txt     # pippy 专属依赖
    - examples/requirements.txt                     # 顶层 install 列表（不直接执行）
    - '**/README.md'

supported:
  # overlay_args 约定：
  #   只写真值与默认不同的项。accelerate argparse 大量默认值已合理：
  #     --mixed_precision default=None   → fp32（accelerate 内部 None 规约成 "no"）
  #     --cpu default=False（store_true）→ Accelerator 自动检 NPU
  #     --use_stateful_dataloader=False  → 普通 dataloader
  #   写进去的只有：
  #     - argparse required=True 必填（cv/complete_cv 的 --data_dir）
  #     - 显式 override 默认的（checkpointing_steps / output_dir / with_tracking / project_dir）
  #   profile 约定（2026-09-17 起，资产源 = ModelScope plant / cache-seed）：
  #     accelerate-nlp        bert+glue（全体 NLP / by_feature 例）
  #     accelerate-nlp-ar     nlp + SmolLM+wikitext（仅 grad_accum_ar）
  #     accelerate-cv         nlp + timm/torchvision + Pets 数据
  #     accelerate-infer-*    nlp + fire/av/diffusers/scipy/torchvision，
  #                           每例只 plant 自己硬编码的模型（phi2/sd/tts/llava），
  #                           tts/llava 的数据集走 cache-seed 兜底

  - path: examples/nlp_example.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  - path: examples/complete_nlp_example.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 20

  - path: examples/cv_example.py
    profile: accelerate-cv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # argparse required=True，不传直接 argparse 报错。cv_example.py 用
      # os.listdir(data_dir) + ".jpg" 过滤，data_dir 必须直接含 .jpg；
      # setup_example.sh 把 timm/oxford-iiit-pet 解到
      # ${TARGET_ROOT}/fixtures/pets/images/，所以这里指向 images/ 子目录。
      - --data_dir ${TARGET_ROOT}/fixtures/pets/images
    timeout_minutes: 20

  - path: examples/complete_cv_example.py
    profile: accelerate-cv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # argparse required=True + 同 cv_example.py 布局：images/ 子目录
      - --data_dir ${TARGET_ROOT}/fixtures/pets/images
    timeout_minutes: 20

  # by_feature/* 8 条：基于 nlp_example.py 的最小修改，每个叠加一个 Accelerate
  # 特性。BERT + MRPC + 默认 3 epochs。默认 fp32 / NPU / 普通 dataloader 都
  # 是 argparse 默认值，nlp_example.py 这条路径不需要任何 overlay。

  - path: examples/by_feature/gradient_accumulation.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  - path: examples/by_feature/automatic_gradient_accumulation.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  - path: examples/by_feature/checkpointing.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # argparse default=None → 不做 checkpoint；显式开 epoch 级落盘
      - --checkpointing_steps epoch
      # argparse default="."（cwd）；改到 CI_OUTPUT_DIR 让 runner 收进
      # artifacts，CI 完成后统一清理
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 15

  - path: examples/by_feature/early_stopping.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  - path: examples/by_feature/tracking.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # argparse store_true：默认不打 tracker；显式开启走通 tracker 路径
      # （默认 TensorBoard addon，env 已配 WANDB_DISABLED 避免 wandb 拉远端）
      - --with_tracking
      # argparse default="logs"（相对路径）；改到 CI_OUTPUT_DIR 收 artifacts
      - --project_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 15

  - path: examples/by_feature/memory.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  - path: examples/by_feature/cross_validation.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 15

  # ===== 2026-09-17 复活：资产源已整体切到 ModelScope + cache-seed =====
  # 2026-09-16 PARKED 的根因（hf-mirror 对 Xet 仓库 302 到 cas-bridge 超时）
  # 已绕开：所有模型改由 setup 从 ModelScope snapshot_download 后 plant 到
  # HF hub cache（peft 同款机制，见 setup_example.sh ms_plant）；两个
  # ModelScope 没有的数据集（pokemon-en-zh / malterei swift 视频）走
  # cache-seed/accelerate/ 兜底投递。以下 6 条全部恢复，profile 按例拆分
  # （infer 组每 job 只 plant 本例硬编码的模型，避免单 job 拉 ~27G）。

  # 旧注曾按上游旧版描述（GPT-2 + ELI5 + 54G OOM）；现版 example 已改为
  # SmolLM-360M + wikitext-2 截断 500 条，360M + AdamW ≈ 4.3G，32G HBM
  # 无压力。显式 ga=4 让 accumulation 路径真实生效（argparse 默认 1）。
  # 2026-09-16 coder npu-1 实跑（torch2.9+torch_npu2.9.0.post2）：3 epochs
  # + eval 全部完成，exit 0，213s。资产：SmolLM/wikitext 走 ModelScope
  # plant（accelerate-nlp-ar profile）。
  - path: examples/by_feature/gradient_accumulation_for_autoregressive_models.py
    profile: accelerate-nlp-ar
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --gradient_accumulation_steps 4
    timeout_minutes: 45

  # schedulefree 是纯 Python 包（wheel 为 py3-none-any，无 native 扩展），
  # 装上后是普通张量运算。bert/mrpc 默认 3 epochs，同其他 by_feature 条目。
  # 2026-09-16 coder npu-1 实跑：schedulefree 1.4.1，3 epochs
  # accuracy 0.855 / f1 0.898，exit 0，116s。bert/mrpc 走 ModelScope
  # plant（accelerate-nlp profile，schedulefree 已回装 pip 列表）。
  - path: examples/by_feature/schedule_free.py
    profile: accelerate-nlp
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 20

  # phi-2 无 CLI 参数，prompts 硬编；fp16 ≈5.4G。模型从 ModelScope
  # （microsoft/phi-2 同名镜像）plant 到 HF cache，冷缓存下载计入 timeout。
  # 2026-09-16 coder npu-1 实跑：5 prompts 生成 + gather 打印完整，exit 0，
  # 70s（含 14G 模型从缓存加载）。
  - path: examples/inference/distributed/phi2.py
    profile: accelerate-infer-phi2
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 45

  # stable_diffusion：example 用 fp32 权重 + torch_dtype=fp16（无 variant），
  # ModelScope AI-ModelScope/stable-diffusion-v1-5 的 safetensors 即够
  # （plant 时跳过 .bin/.ckpt 重复格式，~5.5G）；3 prompts 默认 50 步。
  # 2026-09-16 coder npu-1 实跑：50 步 ~4.5it/s，exit 0，121s。
  - path: examples/inference/distributed/stable_diffusion.py
    profile: accelerate-infer-sd
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 45

  # VITS 语音生成：facebook/mms-tts-eng（~150M，ModelScope 同名镜像 plant）
  # + pokemon captions 数据集（833 条；ModelScope 无 en-zh 变体 →
  # cache-seed/accelerate/ 投递，跑前需 dispatch cache-seed workflow），
  # fp32 推理，逐条落 wav。需 scipy（wavfile）+ torchvision（VitsModel
  # import 链拉 torchvision op 注册）。2026-09-16 coder npu-1
  # 实跑：105 批全生成，exit 0，153s。
  - path: examples/inference/distributed/distributed_speech_generation.py
    profile: accelerate-infer-tts
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --output_path ${CI_OUTPUT_DIR}/tts
    timeout_minutes: 45

  # LLaVA-NeXT-Video-7B-hf fp16 ≈14G（ModelScope 同名镜像 plant，冷缓存
  # 下载计入 timeout）+ malterei swift 视频数据集（205 个视频；ModelScope
  # 无 → cache-seed/accelerate/ 投递，跑前需 dispatch cache-seed
  # workflow）；av 解码 8 帧/视频，bs4 逐批 generate。2026-09-16 coder
  # npu-1 实跑：51 批全生成落盘，exit 0，836s（warm cache）。
  - path: examples/inference/distributed/llava_next_video.py
    profile: accelerate-infer-llava
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --save_dir ${CI_OUTPUT_DIR}/llava
    timeout_minutes: 90


unsupported:
  # 下列理由均按该路径核对源码。每条标注分类：
  #   [平台] NPU/工具链硬缺口，装包也无法绕过
  #   [场景] 单进程下特性不激活、退化为普通训练（多会 exit 0 但无验证价值）
  #   [环境] setup 未装包 / 模型未预下载，修正后候选重测转 supported
  #   [资源] 默认参数超单卡 32G HBM

  # [平台] TPU-only：torch_xla.runtime 无条件 import（finetune_lm_tpu.py:25），
  # torch_npu 栈没有 torch_xla，冷启即 ModuleNotFoundError
  # （coder 实跑 rc=2，与源码路径一致）
  - examples/finetune_lm_tpu.py

  # [平台] 云端多卡编排 demo：硬编 rh.cluster(instance_type="V100:4",
  # provider="cheapest")（multigpu_remote_launcher.py:39），需要 runhouse + 云
  # 账号按需拉起 V100 集群，PrepareForLaunch 走 MULTI_GPU +
  # torch.cuda.device_count()。场景与 NPU CI 无关
  # （coder 实跑：ModuleNotFoundError: No module named 'runhouse'，rc=2）
  - examples/multigpu_remote_launcher.py

  # [场景] DeepSpeed 配置支持：脚本不 import deepspeed，所有 deepspeed 分支
  # 都有 `plugin is None` 守卫（deepspeed_with_config_support.py:508-531），
  # 裸 python 下 plugin 为 None → 退化为普通训练跑完；特性激活需
  # accelerate launch + ds config，而 deepspeed 不在 NPU 栈（ms-DeepSpeed 另立）。
  # 旧注"import hang + DeepSpeedPlugin init 失败"与源码不符
  - examples/by_feature/deepspeed_with_config_support.py

  # [场景] FSDP1 + 峰值内存：FSDP wrap 仅在显式分布式类型（需 launcher）时发生
  # （accelerator.py:1883 起 prepare 的 multi_device 条件）；裸 python 下
  # fsdp_plugin 惰性，传 overlay args 会以普通 bert/mrpc 训练跑完 exit 0，
  # 不验证 FSDP。旧注"单进程进 world_size>1 断言抛错"在裸 python 路径无法
  # 复现（accelerate/torch 源码均无该断言分支）
  - examples/by_feature/fsdp_with_peak_mem_tracking.py

  # [场景] DDP comm hook：DDP wrap 条件是 self.multi_device（accelerator.py:1883），
  # 单进程不 wrap，DistributedDataParallelKwargs(comm_hook=...) 完全不生效，
  # example 以普通训练 exit 0；不会触发 no_sync RuntimeError（旧注有误）。
  # 特性验证需要 ≥2 进程
  - examples/by_feature/ddp_comm_hook.py

  # [场景] LocalSGD：LocalSGD.enabled = enabled and distributed_type != NO
  # （accelerate/local_sgd.py:81），单进程下 step() 直接 no-op，静默退化为普通
  # 训练 exit 0，不会挂死（旧注"永远等不到 averaged grad"有误）；其支持列表
  # 显式含 MULTI_NPU，多卡才有意义
  - examples/by_feature/local_sgd.py

  # [平台/版本] Megatron-LM：立即死因是 transformers >=4.57 移除了
  # send_example_telemetry（megatron_lm_gpt_pretraining.py:50 的 import，任何
  # 平台同样炸，与 NPU 无关）；即使换旧版 transformers，脚本对 megatron plugin
  # 的访问也有 distributed_type 守卫（:546）退化普通 CLM，本意场景需要 NVIDIA
  # Megatron-LM mpu + 多卡，NPU 无对应后端
  # （coder 实跑：ImportError: cannot import name 'send_example_telemetry' from
  # 'transformers.utils'，rc=2）
  - examples/by_feature/megatron_lm_gpt_pretraining.py

  # [场景] 多进程 metric gather：单进程 gather_for_metrics 返回本地 tensor，
  # exit 0 但无 cross-rank 验证，example 本意场景缺失
  # （coder 实跑：DistributedType.NO 下 gather 返回本地 tensor）
  - examples/by_feature/multi_process_metrics.py

  # [环境] schedule-free 优化器：已转 supported（schedulefree 为纯 Python 包，
  # 装包即跑；旧注"_C 扩展无 NPU 实现"不实）

  # [环境] 自回归 grad accum：已转 supported（上游改为 SmolLM-360M +
  # wikitext-2 截断 500 条，单进程可完整验证；overlay ga=4）。
  # （历史 coder 实跑 dmesg heap_size=54760833024 OOM 属旧版 example 现象）

  # [平台] torch.profiler 报表：example 自己拼 sort key
  # f"self_{device.type}_time_total"（profiler.py:185-187）→ NPU 上请求
  # self_npu_time_total；torch 只为 cuda 保留 legacy 别名，torch_npu 2.9.0
  # 未提供 npu 别名 → AttributeError。训练本身跑完、落表失败；--cpu 可绕过
  # 但失去 NPU profiling 意义。属 example × 工具链兼容 bug，非 NPU 能力问题
  # （coder 实跑：AttributeError: 'FunctionEventAvg' object has no attribute
  # 'self_npu_time_total'. Did you mean: 'self_cpu_time_total'?，rc=1）
  - examples/by_feature/profiler.py

  # [平台] DeepSpeed + ALST/Ulysses：模块级 from deepspeed.runtime.utils import
  # move_to_device（sp-alst.py:16）+ DeepSpeedSequenceParallelConfig，
  # deepspeed 不在 NPU 栈（ms-DeepSpeed 另立），且 ALST/Ulysses 需要 ≥2 卡
  # 序列并行
  # （coder 实跑：ModuleNotFoundError: No module named 'deepspeed'，rc=2）
  - examples/alst_ulysses_sequence_parallelism/sp-alst.py
  - examples/alst_ulysses_sequence_parallelism/sp-alst.sh

  # [环境] 推理分布式（模型加载组）：已转 supported（2026-09-17 资产源切
  # ModelScope：phi2/sd/tts/llava 按例拆 profile，setup ms_plant 各自预下
  # 硬编码模型；pokemon/malterei 数据集走 cache-seed 兜底）。florence2 与
  # image_gen 仍 unsupported（理由见各自条目）。

  # [环境/引擎] PiPPy pipeline 推理：is_pippy_available 只查 torch>=2.4，
  # prepare_pippy 的 num_chunks 默认 = num_processes（inference.py:165）。
  # 但 2026-09-16 coder npu-1 实跑（torch2.9/torch_npu2.9.0.post2）证实
  # 裸 python 单进程跑不通，两重硬约束：
  #   ① torch.distributed.pipelining 的 PipelineStage/ScheduleGPipe 需要
  #     已初始化的 process group——裸 python 与 accelerate launch
  #     --num_processes 1（simple_launcher）都不初始化 pg，直接
  #     ValueError: Default process group has not been initialized
  #   ② example 的输入是 torch.Size([2, 512])（bert.py:59 "expected size
  #     (n_processes)"），即 2 进程 × (1,512) stage 微批；torchrun
  #     --nproc-per-node 1 能过 ① 但撞
  #     PipeliningShapeError: expected [1,512] actual [2,512]
  # 旧注"需要 num_processes>=stages（最少 2）"结论碰巧成立但机制描述不准。
  # 转正路径：a2-2 runner + torchrun/accelerate launch --num_processes 2
  # （需引擎支持 launcher 维度后重测）
  # （coder 实跑：pippy_bert 裸 python rc=1 / accelerate launch rc=1 /
  #   torchrun x1 rc=1 PipeliningShapeError，三连败证据齐全）
  - examples/inference/pippy/bert.py
  - examples/inference/pippy/gpt2.py

  # [环境] PiPPy：t5/llama 的独立理由（bert/gpt2 见上一条）：
  #   t5.py:30 example 自带硬检查（encoder/decoder 不支持），真 unsupported
  #   llama.py:29 meta-llama/Llama-2-7b-chat-hf 是门控仓库（需 token，镜像
  #     不代发），真 unsupported
  # （coder 实跑：pippy_t5 → RuntimeError（example 自抛）；pippy_llama →
  # OSError: We couldn't connect to 'https://hf-mirror.com'）
  - examples/inference/pippy/t5.py
  - examples/inference/pippy/llama.py

  # [平台] FP8：模块级 from torchao.float8 import Float8LinearConfig
  # （fsdp2_fp8.py:24）；FP8 三后端 TE / torchao / msamp 均无 Ascend 实现
  # （910B4 硬件 FP8 尚未在 torch_npu.ao ship），装 torchao 也无 NPU kernel
  # （coder 实跑：ModuleNotFoundError: No module named 'torchao'，rc=2）
  - examples/torch_native_parallelism/fsdp2_fp8.py

  # [资源] ND parallelism：argparse 默认全 1（nd_parallel.py:44-47；旧注
  # "2/2/2 缺 rank 断言"来自 README 示例命令，非脚本默认值）。真实 blocker：
  # 默认模型硬编 Hermes-3-Llama-3.1-8B（nd_parallel.py:39，bf16 ≈16G + 优化器
  # 态 > 32G 单卡）+ log_with=["wandb"]（:102）+ 裸 python 下 dist.all_reduce
  # 无进程组；nd_parallel_trainer.py:23 同款 8B 默认模型。runner a2-1 单卡不够
  - examples/torch_native_parallelism/nd_parallel.py
  - examples/torch_native_parallelism/nd_parallel_trainer.py

  # [场景] accelerate launcher 配置 runner：裸 python 下 Accelerator() 不带
  # fp8 handler，打印 state 后 exit 0，不触发 torchao（旧注"fp8 init 必触发
  # torchao.float8 缺"不实）；fp8 场景需 accelerate launch --config_file
  # fp8.yaml，且该 yaml 指定的是 TE 后端（NVIDIA-only）。本目录已在
  # scan.exclude，此条仅作记录
