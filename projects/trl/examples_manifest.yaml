  - examples/ssd_codegen/ssd_eval.py

  # ===== 原 scan.exclude 项迁移（2026-09-20）：accelerate_configs / datasets /
  # grpo_harbor/harnesses 三条是目录，下面的行是与扫描 include_extensions
  # 命中或扩展名命中的实际路径；具体 .py / .ipynb 子文件清单以
  # 上游 huggingface/trl HEAD 为准，本段只覆盖 exclude 原意。
  # accelerate_configs 是 accelerate launcher 配置目录，里面几乎全为 .yaml，
  # 不进 .py / .ipynb 扫描；少数被改名的 .ipynb 子文件在 unsupported 段以
  # 上游实际命名为准。
  - examples/accelerate_configs                   # accelerate 多卡 / DeepSpeed / FSDP / 上下文并行启动配置，被多个 example 共用
  - examples/datasets                             # 生成 trl-lib 数据集并 push_to_hub 的一次性数据制作脚本，不是可跑的训练 example
  - examples/grpo_harbor/harnesses                # grpo_harbor.py 背后的 bash / jupyter / terminal_notes harness 实现与包 __init__
  - examples/sft_qwen3_8b_1m_context/context_parallel_8gpu.yaml  # 该 example 专属的 8 卡上下文并行启动配置（扩展名不进扫描）
