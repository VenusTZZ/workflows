# CI 专用 RLVR smoke：Qwen2.5-0.5B + 4 NPU（FSDP2 训练 2 / vLLM 1 / 参考模型 1），2 prompt x 2 采样，8 行本地 math_rule。
hydra:
  run:
    dir: .
  output_subdir: null

pg_variant: ppo
exp_name: roll-ci-rlvr
seed: 42
logging_dir: ${oc.env:CI_OUTPUT_DIR}/logs
output_dir: ${oc.env:CI_OUTPUT_DIR}/output
system_envs:
  USE_MODELSCOPE: "1"
  MODEL_DOWNLOAD_TYPE: MODELSCOPE

checkpoint_config:
  type: file_system
  output_dir: ${oc.env:CI_OUTPUT_DIR}/ckpt

track_with: stdout

num_gpus_per_node: 4
max_steps: 1
save_steps: 10
logging_steps: 1
eval_steps: -1
resume_from_checkpoint: false

rollout_batch_size: 2
prompt_length: 128
sequence_length: 192

num_return_sequences_in_group: 2
ppo_epochs: 1
adv_estimator: reinforce

value_clip: 0.5
reward_clip: 10
advantage_clip: 2.0
dual_clip_loss: true

norm_mean_type: batch
norm_std_type: batch

max_len_mask: true
difficulty_mask: false
error_max_len_clip: false

difficulty_loss_weight: false
length_loss_weight: false
add_token_level_kl: false
whiten_advantages: true

pretrain: ${oc.env:ROLL_MODEL_PATH}
reward_pretrain: ${oc.env:ROLL_MODEL_PATH}

actor_train:
  worker_cls: roll.pipeline.rlvr.actor_pg_worker.ActorPGWorker
  pg_variant: ppo
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_steps: 0
    num_train_epochs: 1
  data_args:
    template: qwen2_5
    file_name:
      - ci_math_8.jsonl
    domain_interleave_probs:
      math_rule: 1
    dataset_dir: ${oc.env:FIXTURE_DIR}
    messages: messages
    interleave_probs: "1.0"
    preprocessing_num_workers: 1
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      fsdp_size: 2
      param_dtype: bf16
      reduce_dtype: bf16
      reshard_after_forward: true
      offload_policy: false
      use_batched_model_update: false
  device_mapping: [0, 1]
  infer_batch_size: 1

actor_infer:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 64
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      max_model_len: 256
      enforce_eager: true
      load_format: auto
  device_mapping: [2]
  infer_batch_size: 1

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_infer
    strategy_config:
      fsdp_size: 1
      param_dtype: bf16
      reduce_dtype: bf16
      reshard_after_forward: true
      offload_policy: false
  device_mapping: [3]
  infer_batch_size: 1

rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    data_args:
      template: qwen2_5
    tag_included: [ci_math]
    world_size: 8
    infer_batch_size: 1
