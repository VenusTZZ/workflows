      - '++difficulty_mask=false'
      - '++pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++reward_pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++actor_train.model_args.flash_attn="fa2"'
      - '++actor_train.training_args.gradient_accumulation_steps=1'
      - '++actor_train.training_args.warmup_steps=0'
      - '++actor_train.training_args.num_train_epochs=1'
      - '++actor_train.data_args.template="qwen2_5"'
      - '++actor_train.data_args.file_name=["${oc.env:FIXTURE_DIR}/ci_math_8.jsonl"]'
      - '++actor_train.data_args.preprocessing_num_workers=1'
      - '~actor_train.strategy_args.strategy_config'
      - '++actor_train.strategy_args.strategy_config={fsdp_size:2,param_dtype:"bf16",reduce_dtype:"bf16",reshard_after_forward:true,offload_policy:false,use_batched_model_update:false}'
      - '++actor_train.device_mapping="list(range(0,2))"'
      - '++actor_infer.model_args.flash_attn="fa2"'
      - '++actor_infer.generating_args.max_new_tokens=64'
      - '++actor_infer.data_args.template="qwen2_5"'
      - '~actor_infer.strategy_args.strategy_config'
      - '++actor_infer.strategy_args.strategy_config={gpu_memory_utilization:0.8,block_size:16,max_model_len:256,enforce_eager:true,load_format:"auto"}'
      - '++actor_infer.device_mapping="list(range(2,3))"'
      - '++actor_infer.infer_batch_size=1'
      - '++reference.model_args.flash_attn="fa2"'
      - '++reference.data_args.template="qwen2_5"'
      - '++reference.device_mapping="list(range(3,4))"'
      - '++rewards.math_rule.data_args.template="qwen2_5"'
