version: 1
# ROLL examples 对账快照：以 alibaba/ROLL v0.4.0（latest release，commit 581046a）examples/ 为准。
# 对账单位是「完整运行配置」（.yaml）：根目录 start_*_pipeline.py 与各目录 run_*.sh
# 是公共 launcher / 别名，不重复登记；examples/config/ 是被其他配置继承的共享片段。
#
# supported 二十条链路：单卡 rollout、七条四卡 RLVR、以及十二条两卡 Agentic train
# （Agentic 共十二条，含原有 Sokoban）：GRPO/TOPR/训推校正/GiGPO/LoRA/动态 batching/native/PPO/SAO/GEM。
# 国内 CANN 镜像 + setup 动态装栈；基于 release 上游 YAML，用 overlay_args 声明 CI 覆盖项。
# ++ 添加或覆盖字段，~ 删除字段；项目 runner 使用 Hydra 组合配置，不修改上游源码。
# unsupported 的语义是「本看护体系当前不跑它」：注释区分硬阻塞与待实测项。
scan:
  root: examples
  include_extensions: ['.yaml']
supported:
  # Agentic-Rollout：仅推理的 Sokoban 多轮环境交互与轨迹组装。与上游 agentic_rollout_sokoban.yaml 同 pipeline，
  # CI 覆盖：单卡 vLLM-Ascend、单环境、序列 256。国内 CANN 基础镜像启动后
  # 由 setup 据 v0.3.0 的官方升腾环境文档安装固定版本的 torch_npu / vLLM-Ascend。
  - path: examples/qwen2.5-0.5B-agentic/agentic_rollout_sokoban.yaml
    profile: agentic_rollout_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/start_agentic_rollout_pipeline.py
    overlay_args:
      - '--config_path'
      - 'qwen2.5-0.5B-agentic'
      - '--config_name'
      - 'agentic_rollout_sokoban'
      - '++exp_name="roll-ci-agentic-rollout"'
      - '++transfer_backend.backend_name=null'
      - '++logging_dir="${oc.env:CI_OUTPUT_DIR}/logs"'
      - '++output_dir="${oc.env:CI_OUTPUT_DIR}/output"'
      - '++system_envs.USE_MODELSCOPE="1"'
      - '++system_envs.MODEL_DOWNLOAD_TYPE="MODELSCOPE"'
      - '++checkpoint_config.type="file_system"'
      - '++checkpoint_config.output_dir="${oc.env:CI_OUTPUT_DIR}/ckpt"'
      - '++num_gpus_per_node=1'
      - '++max_steps=1'
      - '++save_steps=10'
      - '++logging_steps=1'
      - '++track_with="stdout"'
      - '++rollout_batch_size=1'
      - '++sequence_length=256'
      - '++pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++actor_infer.generating_args.max_new_tokens=32'
      - '~actor_infer.strategy_args.strategy_config'
      - '++actor_infer.strategy_args.strategy_config={gpu_memory_utilization:0.8,block_size:16,load_format:"auto",max_model_len:256,enforce_eager:true}'
      - '++actor_infer.device_mapping="list(range(0,1))"'
      - '++max_tokens_per_step=32'
      - '++max_actions_per_traj=2'
      - '~custom_envs'
      - '++custom_envs={SimpleSokoban:"${custom_env.SimpleSokoban}"}'
      - '++render_save_dir=""'
      - '~tracker_kwargs'
    timeout_minutes: 180
  # Agentic：Sokoban 多轮交互 + vLLM rollout + GRPO reward/advantage + FSDP2 backward + optimizer step。
  # CI 覆盖：0.5B 模型、2 卡（FSDP2 train 占卡 0，vLLM infer 卡 1，reference 与 train 同卡），单步。
  # strategy_config 先删除再重建，避免遗留上游 Megatron 专用键。
  - path: examples/qwen2.5-0.5B-agentic/agentic_val_sokoban.yaml
    profile: agentic_train_npu
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/start_agentic_pipeline.py
    overlay_args:
      - '--config_path'
      - 'qwen2.5-0.5B-agentic'
      - '--config_name'
      - 'agentic_val_sokoban'
      - '++exp_name="roll-ci-agentic-train"'
      - '++transfer_backend.backend_name=null'
      - '++logging_dir="${oc.env:CI_OUTPUT_DIR}/logs"'
      - '++output_dir="${oc.env:CI_OUTPUT_DIR}/output"'
      - '++system_envs.MODEL_DOWNLOAD_TYPE="MODELSCOPE"'
      - '++checkpoint_config.output_dir="${oc.env:CI_OUTPUT_DIR}/ckpt"'
      - '++num_gpus_per_node=2'
      - '++max_steps=1'
      - '++save_steps=10'
      - '++eval_steps=1000'
      - '++track_with="stdout"'
      - '++rollout_batch_size=2'
      - '++val_batch_size=2'
      - '++sequence_length=256'
      - '++pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++reward_pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++actor_train.training_args.per_device_train_batch_size=1'
      - '++actor_train.training_args.gradient_accumulation_steps=1'
      - '++actor_train.training_args.warmup_steps=0'
      - '++actor_train.training_args.lr_scheduler_type="constant"'
      - '++actor_train.strategy_args.strategy_name="fsdp2_train"'
      - '~actor_train.strategy_args.strategy_config'
      - '++actor_train.strategy_args.strategy_config={fsdp_size:1,param_dtype:"bf16",reduce_dtype:"bf16",reshard_after_forward:true,offload_policy:false}'
      - '++actor_train.device_mapping="list(range(0,1))"'
      - '++actor_train.infer_batch_size=1'
      - '++actor_infer.generating_args.max_new_tokens=32'
      - '~actor_infer.strategy_args.strategy_config'
      - '++actor_infer.strategy_args.strategy_config={gpu_memory_utilization:0.8,block_size:16,load_format:"auto",max_model_len:256,enforce_eager:true}'
      - '++actor_infer.device_mapping="list(range(1,2))"'
      - '++reference.device_mapping="list(range(0,1))"'
      - '++reference.infer_batch_size=1'
      - '++reward_normalization.norm_mean_type="group"'
      - '++reward_normalization.norm_std_type="group"'
      - '++train_env_manager.max_env_num_per_worker=2'
      - '++train_env_manager.num_env_groups=1'
      - '++train_env_manager.group_size=2'
      - '++train_env_manager.num_groups_partition=[1]'
      - '++val_env_manager.max_env_num_per_worker=1'
      - '++val_env_manager.num_env_groups=1'
      - '++val_env_manager.tags=["SimpleSokoban"]'
      - '++val_env_manager.num_groups_partition=[1]'
      - '++max_tokens_per_step=32'
      - '++max_actions_per_traj=2'
      - '~custom_envs'
      - '++custom_envs={SimpleSokoban:"${custom_env.SimpleSokoban}"}'
      - '++render_save_dir=""'
      - '~tracker_kwargs'
    timeout_minutes: 240
  # RLVR：官方 examples/ascend_examples RLVR 路径。CI 覆盖：0.5B 模型、
  # 4 卡（FSDP2 train 0-1，vLLM 2，hf reference 3）、8 行本地 math_rule fixture、reward 单副本、单步。
  - path: examples/ascend_examples/qwen3_8b_rlvr_fsdp2.yaml
    profile: rlvr_npu
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
