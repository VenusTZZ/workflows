version: 1
# ROLL examples 对账快照：以 alibaba/ROLL main（2026-09-16 检出）examples/ 为准。
# 对账单位是「完整运行配置」（.yaml）：根目录 start_*_pipeline.py 与各目录 run_*.sh
# 是公共 launcher / 别名，不重复登记；examples/config/ 是被其他配置继承的共享片段。
#
# 阶段一 supported 只保留上游 Agentic-Rollout 的最小 NPU 代表：
# 单卡 Sokoban + vLLM-Ascend，先验证国内 CANN 基础镜像动态装栈路径。
# unsupported 的语义是「本看护体系当前不跑它」：注释区分硬阻塞与待实测项。
scan:
  root: examples
  include_extensions: ['.yaml']
  exclude:
    # 9 个被各 example 配置继承的共享环境 / 模板片段，不是可独立执行的 example
    - examples/config
    # 仅有 Hydra defaults 的空壳配置，没有模型 / worker / 资源配置
    - examples/qwen2.5-0.5B-agentic/agentic_val_webshop.yaml
supported:
  # Agentic-Rollout：仅推理的 Sokoban 多轮环境交互与轨迹组装。与上游 agentic_rollout_sokoban.yaml 同 pipeline，
  # CI 重写为 ci_agentic_rollout：单卡 vLLM-Ascend、单环境、序列 256。国内 CANN 基础镜像启动后
  # 由 setup 据 v0.3.0 的官方升腾环境文档安装固定版本的 torch_npu / vLLM-Ascend。
  - path: examples/qwen2.5-0.5B-agentic/agentic_rollout_sokoban.yaml
    profile: agentic_rollout_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/start_agentic_rollout_pipeline.py
    overlay_args:
      - --config_path
      - ci_roll
      - --config_name
      - ci_agentic_rollout
    timeout_minutes: 180
unsupported:
  # DeepEyes 图文缺陷检测 Agentic 训练（Qwen2.5-VL-7B）；不支持：Megatron 训练后端在昇腾当前不支持，且 7B VLM 规模超单卡 CI。
  - examples/agentic_deepeyes/deepeyes.yaml
  # ROCK 平台 SWE 工程智能体 rollout（Qwen3-4B，vLLM 单卡）；不支持：依赖本地 sandbox 服务、外部 CLI/runtime 下载与 64K 长上下文，runner 无法自包含运行。
  - examples/agentic_demo/agent_rollout_rock_swe.yaml
  # FrozenLake Agentic 多节点演示（0.5B，2 机）；不支持：Megatron 后端 + 多机 Ray 拓扑，超出单节点 CI 契约。
  - examples/agentic_demo/agent_val_frozen_lake_multi_nodes_demo.yaml
  # FrozenLake Agentic 单节点演示（0.5B）；不支持：Megatron 后端，昇腾当前不支持；与已选 sokoban Agentic 代表重复。
  - examples/agentic_demo/agent_val_frozen_lake_single_node_demo.yaml
  # ROCK SWE 智能体训练（Qwen3-4B，8 卡 Megatron）；不支持：外部 sandbox 服务 + Megatron 后端。
  - examples/agentic_demo/agent_val_rock_swe.yaml
  # ROCK SWE 智能体训练 Qwen3.5-2B 变体；不支持：同上，且 200 步 x 64K 序列规模超出 CI。
  - examples/agentic_demo/agent_val_rock_swe_qwen35_2b.yaml
  # Sokoban sandbox Agentic 训练（0.5B，8 卡）；不支持：依赖 ROCKS/HF 沙箱服务，且 Megatron 后端。
