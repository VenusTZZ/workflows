version: 1
scan:
  root: samples
  include_extensions: ['.py', '.sh', '.cpp']
supported:
  # ===== self-hosted NPU smoke（projects/opencv/example/，source: project）=====
  # 上游 samples 无一能经 CLI 选 CANN 后端（见 unsupported 各段注释），故
  # NPU 核心特性用 3 个 self-hosted 脚本看护，覆盖 OpenCV 在 NPU 上的两条
  # 通路：① cv::dnn 的 CANN 后端（分类 + 超分辨率）；② cannops 经典算子。
  # 均已在 910B4 + CANN 9.1.0 实测跑通（细节见各 example docstring）。
  # timeout_minutes 统一 60：setup_example.sh 冷启动要源码构建 opencv-cann
  # （~23 min @-j2），3 腿并行时在共享 runner 上还有争抢；40 以下实测会被
  # 15m/20m 上限在构建中途 kill（run 35725672646 的 cannops 腿）。
  #
  # 1) DNN 分类：mobilenetv2-12.onnx（fixtures 入仓 13.9MB），conv/BN/ReLU/
  #    pooling/FC/softmax 全链路 + top-1=372 与 CPU 参考对齐。
  - source: project
    path: example/test_npu_dnn_classification.py
    profile: opencv
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model ${FIXTURE_DIR}/mobilenetv2-12.onnx
      - --input ${TARGET_ROOT}/samples/data/baboon.jpg
      - --imagenet-topk 5
      - --expected-top1 372
    timeout_minutes: 60

  # 2) cannops 经典算子（cv2.cann.*）：cvtColor/flip/rotate/transpose/
  #    merge/split/add/subtract/bitwise，全部与 CPU 参考逐元素对齐（910B4
  #    实测）。跳过已知 broken：resize/crop（DVPP VPC 通道建失败）、
  #    threshold（AscendC kernel 越界）、uint8 算术（饱和与 CPU 不一致）。
  - source: project
    path: example/test_npu_cann_ops.py
    profile: opencv
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --input ${TARGET_ROOT}/samples/data/baboon.jpg
    timeout_minutes: 60

  # 3) DNN 超分辨率（非分类 layer：Conv/ReLU/Reshape/Transpose=PixelShuffle）。
  #    super-resolution-10.onnx（SubPixel CNN，240KB 入仓），静态 224x224 单
  #    输出，无 Shape/Gather/Cast——是 fcn-resnet50（动态 H/W + 双输出，CANN
  #    后端 forward 报 ret=100000）的替代，覆盖分类之外的 layer。
  - source: project
    path: example/test_npu_dnn_superres.py
    profile: opencv
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model ${FIXTURE_DIR}/super-resolution-10.onnx
      - --input ${TARGET_ROOT}/samples/data/baboon.jpg
    timeout_minutes: 60


unsupported:
  # ---- 最接近 NPU 的 5 个「整型直传后端」样本 ----
  # 唯一「后端可调参」的形态：--backend/--target 用 type=int，
  # raw int 直接塞给 net.setPreferableBackend/setPreferableTarget（不经
  # common.py 的字符串映射），是离 CANN 后端物理距离最近的一批。
  # 但仍被两道墙挡住，任一道都要 patch 源码才能突破：
  #   1) argparse choices 白名单：backends 元组 = (DEFAULT=0, IE=2,
  #      OPENCV=3, VKCOM=4, CUDA=5)，targets 元组 = (CPU=0, OPENCL=1,
  #      OPENCL_FP16=2, MYRIAD=3, HDDL=8, VULKAN=4, CUDA=6, CUDA_FP16=7)。
  #      两个元组都缺 DNN_BACKEND_CANN=8 / DNN_TARGET_NPU=9，于是
  #      --backend 8 --target 9 在 argparse 处即被拒（invalid choice），
  #      根本没走到 setPreferableBackend。
  #   2) GUI 绑定：5 个全带 imshow/waitKey/namedWindow，headless CI 未编
  #      highgui，首帧即挂。
  # 若上游把 8/9 补进 choices 并 headless 化，这 5 个才有资格升 supported。
  - samples/dnn/colorization.py
  - samples/dnn/human_parsing.py
  - samples/dnn/siamrpnpp.py
  - samples/dnn/speech_recognition.py
  - samples/dnn/virtual_try_on.py

  # ---- 可经 CLI 切后端、但映射/choices 无 cann/npu 的 11 个 ----
  # 走 common.py::get_backend_id 的字符串映射，--backend 默认 "default"(CPU)，
  # choices=("default","openvino","opencv","vkcom","cuda")，可显式换到 cuda/openvino/vkcom。
  # 但 get_backend_id/get_target_id 映射表与 choices 里都没有 cann/npu，到不了 NPU；
  # 且 11 个全 GUI 绑定（imshow/waitKey/namedWindow），headless CI 未编 highgui。
  # 较「整型直传」那 5 个多改一处：补自己的 choices 之外，还要给共享 common.py 补
  # "cann"/"npu" 两行映射（改一次覆盖这 11 个）。
  - samples/dnn/alpha_matting.py
  - samples/dnn/auto_white_balance.py
  - samples/dnn/classification.py
  - samples/dnn/deblurring.py
  - samples/dnn/edge_detection.py
  - samples/dnn/inpainting.py
  - samples/dnn/ldm_inpainting.py
  - samples/dnn/object_detection.py
  - samples/dnn/person_reid.py
  - samples/dnn/segmentation.py
  - samples/dnn/super_resolution.py

