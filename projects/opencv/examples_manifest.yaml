version: 1

# OpenCV examples guard manifest — 2026-09-18 全量源码重析版。
#
# 数据源：opencv/opencv@5.0.0 sparse checkout 逐文件扫描（samples/ 共
# 1157 文件；矩阵相关 .py 174 + .sh 5）。扫描方法：对每个 .py grep
# namedWindow / imshow / waitKey / createTrackbar / setMouseCallback /
# VideoCapture(0) / tkinter / plt.show / SpanSelector（GUI 判定）+
# readNet* / setPreferableBackend / Caffe / FaceDetectorYN（设备与格
# 式判定），可疑条目逐个读源码复核。
#
# === 自建 example 方案已废弃 ===
# 原 supported 三件套（examples/quickstart_py_version.py /
# quickstart_dnn_inference.py / quickstart_cann_unit_tests.sh）连同名
# 为其准备的 fork-mirror (A) / 引擎 pre-check sync (B) 方案一并退役：
# projects/opencv/examples/ 已删除，supported 直接指向 samples/ 真实
# 路径，manifest-check 对上游 opencv/opencv 原生通过，不再依赖 fork
# 或引擎改造。cannops gtest 的 25 个 known-broken 排除项记录仍在
# docs/Quick-start-Ascend.md §"跑 CANN 单元测试"，随 gtest example
# 移出本 manifest。
#
# === 分类总账（.py 174）===
#   exclude（非 example）  117 = python/dnn helper 11 + dnn_model_runner
#                              管线 19 + gdb 调试器 1 + 教程树
#                              snippets(19)/tutorial_code(67) 86
#   unsupported             53 = python 27（GUI 24 + cpu_only 3）
#                              + dnn 26（GUI 24 + 设备 1 + 评估管线 1）
#   supported                4 = samples/dnn 5.0.0 新增 LLM/VLM 推理
# 另：.sh 5 个全为 samples/install 安装脚本（exclude）；samples/cpp
# (289 .cpp) + java/android/swift/winrt/winrt_universal/wp8/gpu/tapi/
# hal/semihosting/directx/opengl/opencl/sycl/va_intel 等平台树
# （~890 文件）矩阵不跑（cpp_matrix_skip，见 unsupported 末段）。
#
# === NPU 看护现状（重要）===
# 4 个 supported 样本源码不含 setPreferableBackend/Target，也没有
# --backend 参数：readNetFromONNX 走默认 DNN_BACKEND_OPENCV——当前
# 看护的是"源码构建 opencv 的 dnn LLM 推理链路（readNetFromONNX +
# cv.dnn.Tokenizer + 自回归 decode）可用性"（CPU 腿）。CANN/NPU 腿
# 待上游暴露 backend 参数后经 overlay 注入（5.0.0 onnx_importer2
# 新引擎不支持非 CPU 后端，需 OPENCV_DNN_ENGINE=1 classic——经验来
# 自已退役的 quickstart_dnn_inference.py）。源码构建本身含 CANN 后
# 端这件事由 setup_example.sh 第 5 步 DNN_BACKEND_CANN != 0 断言看护。
#
# === 模型来源 ===
# 全部走 seed workflow 预置到 ${FIXTURE_DIR}/models/ 下（网络问题不
# 归本 manifest 管），overlay 只注入路径。统一契约：每个模型目录含
# model.onnx（vlm 为 siglip/embedding/gemma 三段）+ config.json
# （cv.dnn.Tokenizer.load 兼容格式，opencv_extra/testdata/dnn/llm/*/
# config.json 风格）。gpt2 文档中的 tiktoken 仅用于自行导出模型，
# 推理本体零第三方依赖（numpy + argparse + cv2）。seed 落地前
# manifest-check 照常通过（只验脚本路径在 target 树存在），run-example
# 会因模型缺失失败——这是预期 bring-up 状态。

scan:
  root: samples
  include_extensions: ['.py', '.sh']
  exclude:
    # ===== helpers / 构建配置 / 文档 / 资源（samples/python + samples/dnn）=====
    - samples/python/_coverage.py             # 上游测试覆盖率 helper
    - samples/python/_doc.py                  # doc 生成 helper
    - samples/python/common.py                # samples/python 共享 helper（splitfn/Sketcher）
    - samples/python/CMakeLists.txt           # 构建配置
    - samples/python/_run_winpack_demo.cmd    # Windows 启动脚本
    - samples/dnn/common.py                   # dnn 样本共享 helper
    - samples/dnn/common.hpp                  # 同上（C++ 头）
    - samples/dnn/custom_layers.hpp           # custom_layer 的实现配套
    - samples/dnn/custom_layer_onnx.cpp       # 同上
    - samples/dnn/download_models.py          # 模型下载器：seed 接管后无需单独看护
    - samples/dnn/shrink_tf_graph_weights.py  # TF graph 工具
    - samples/dnn/tf_text_graph_common.py     # TF→OpenCV text graph 转换 helper
    - samples/dnn/tf_text_graph_efficientdet.py
    - samples/dnn/tf_text_graph_faster_rcnn.py
    - samples/dnn/tf_text_graph_mask_rcnn.py
    - samples/dnn/tf_text_graph_ssd.py
    - samples/dnn/models.yml                  # 模型清单元数据
    - samples/dnn/README.md                   # 文档
    - samples/dnn/CMakeLists.txt              # 构建配置
    - samples/dnn/js_face_recognition.html    # js demo
    - samples/dnn/face_detector/              # 资源
    - samples/dnn/results/                    # 资源
    # ===== 管线 / 调试配套 =====
    - samples/dnn/dnn_model_runner/           # 19 个 .py：转换 + 精度评估管线
    - samples/gdb/                            # gdb pretty-printer
    - samples/install/                        # 5 个 .sh 安装脚本
    # ===== 教程树（非 example 树，整体剪枝）=====
    # snippets(19) + tutorial_code(67) = 86 个 .py。源码实测其中 9 个
    # headless：7 个纯 CPU 教程可跑（snippets/stitching.py、
    # compareHist_Demo、file_input_output、hough_line x2、hdr_imaging、
    # documentation），2 个是 PyTorch→ONNX 转换工具（voc_segm_test /
    # py_to_py_fcn_resnet50，需 torch + VOC 数据）。即便可跑也是教程
    # 价值（纯 CPU 算子演示），不入 unsupported 复审段。
    - samples/python/snippets/
    - samples/python/tutorial_code/
    # ===== 资源 / 元数据 / 全局 =====
    - samples/data/                           # 图/视频/模型资源
    - '**/__pycache__'
    - '**/CMakeLists.txt'

supported:
  # ===== 5.0.0 新增 LLM/VLM 推理样本（samples/dnn）=====
  # 入选标准（samples 树里同时满足的只有这 4 个）：
  #   (1) headless——无 namedWindow/imshow/waitKey/摄像头；
  #   (2) readNetFromONNX 纯推理；
  #   (3) 零第三方依赖——numpy + argparse + cv2，tokenizer 走
  #       cv.dnn.Tokenizer.load；
  #   (4) 结果 print 到 stdout，无交互。
  # 共性限制见文件头"NPU 看护现状"：默认 OPENCV CPU backend。
  # 未实跑验证（模型 seed 未接）；首跑预期失败点 = 模型缺失。

  # GPT-2 文本生成：124M ONNX，自回归 decode。注意脚本要求 prompt
  # 长度与模型导出时的固定窗口一致（seed 契约：导出窗口 = 默认
  # prompt 长度）。
  - path: samples/dnn/gpt2_inference.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model ${FIXTURE_DIR}/models/gpt2/model.onnx
      - --tokenizer_path ${FIXTURE_DIR}/models/gpt2/config.json
      - --max_seq_len 8   # 默认 32：压生成步数（CPU 腿每步一次全 forward）
    timeout_minutes: 30

  # Gemma3 文本生成（--use_kv_cache 需 causal-lm-with-past 导出版，
  # 默认关；seed 契约提供无 past 版即按默认跑）。
  - path: samples/dnn/gemma3_inference.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model ${FIXTURE_DIR}/models/gemma3/model.onnx
      - --tokenizer_path ${FIXTURE_DIR}/models/gemma3/config.json
      - --max_new_tokens 4   # 默认 64：1B 模型 CPU 腿压时长
    timeout_minutes: 45

  # Qwen2.5 文本生成（kv-cache 语义同上）。
  - path: samples/dnn/qwen_inference.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model ${FIXTURE_DIR}/models/qwen2.5/model.onnx
      - --tokenizer_path ${FIXTURE_DIR}/models/qwen2.5/config.json
      - --max_new_tokens 4   # 默认 64：0.5B CPU 腿压时长
    timeout_minutes: 45

  # PaliGemma2-3B 视觉语言：siglip 视觉编码 + embedding + gemma2 三段
  # ONNX 串接（~12GB fp32，910B 侧无显存问题，CPU 腿吃 host RAM）。
  # 输入图用仓内 samples/data/baboon.jpg（setup 已另行拷贝一份到
  # fixtures/，此处直接用 target 树原生路径）。
  - path: samples/dnn/vlm_inference.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --siglip ${FIXTURE_DIR}/models/paligemma2/siglip.onnx
      - --embedding ${FIXTURE_DIR}/models/paligemma2/embedding.onnx
      - --gemma ${FIXTURE_DIR}/models/paligemma2/gemma.onnx
      - --tokenizer_path ${FIXTURE_DIR}/models/paligemma2/config.json
      - --input ${TARGET_ROOT}/samples/data/baboon.jpg
      - --max_new_tokens 4   # 默认 64：3B CPU 腿压时长
    timeout_minutes: 90

# ===== unsupported =====
# 源码重析后的完整清单（53 项 .py + 平台树）。分段：
#   1. environment_blocked  GUI/交互依赖，headless CI 跑不动（48）
#   2. device_blocked       CANN 不可达的路径/格式（1；openpose 等
#                          格式障碍以叠加注释附在对应 GUI 条目上）
#   3. cpu_only             headless 可跑但纯 CPU，NPU 看护价值低（3）
#   4. eval_pipeline        精度评估需数据集（1）
#   5. cpp_matrix_skip      非 .py/.sh 平台树（不占上面计数）
unsupported:
  # ===== 1. environment_blocked =====
  # setup_example.sh 的 BUILD_LIST 故意不编译 highgui（headless 镜像
  # 无 GTK/Qt）——任何 namedWindow/imshow/waitKey/setMouseCallback/
  # createTrackbar 在首个调用处 AttributeError；matplotlib 交互
  # （SpanSelector/plt.show）与 VideoCapture(0) 摄像头兜底同理。

  # ---- samples/python（24）----
  - samples/python/aruco_detect_board_charuco.py     # imshow+waitKey+摄像头兜底
  - samples/python/asift.py                          # waitKey 渲染循环
  - samples/python/audio_spectrogram.py              # imshow+waitKey+摄像头
  - samples/python/background_subtractor_mask.py     # 同上
  - samples/python/camera_calibration_show_extrinsics.py  # matplotlib 3D 交互
  - samples/python/color_correction_model.py         # imshow+waitKey
  - samples/python/demo.py                           # tkinter 样本启动器（非 highgui 但同为 GUI）
  - samples/python/drawing.py                        # imshow+waitKey
  - samples/python/essential_mat_reconstr.py         # 同上
  - samples/python/floodfill.py                      # imshow+waitKey+trackbar+鼠标（原归 cpu_only；源码实测 GUI 绑死，已纠正）
  - samples/python/grabcut.py                        # namedWindow+鼠标 ROI
  - samples/python/lappyr.py                         # namedWindow+trackbar（同上纠正）
  - samples/python/macbeth_chart_detection.py        # imshow+摄像头
  - samples/python/morphology.py                     # namedWindow+trackbar（同上纠正）
  - samples/python/mouse_and_match.py                # setMouseCallback
  - samples/python/plane_tracker.py                  # namedWindow+鼠标
  - samples/python/point_cloud.py                    # waitKey 渲染循环
  - samples/python/qrcode.py                         # imshow+摄像头兜底
  - samples/python/stereo_match.py                   # imshow+waitKey+trackbar
  - samples/python/stitching_detailed.py             # imshow+waitKey
  - samples/python/tst_scene_render.py               # 3D 场景渲染+waitKey（也被 calibrate 等当模块 import）
  - samples/python/video.py                          # imshow+摄像头（CamShift；5.0.0 在树，原 manifest 漏登）
  - samples/python/volume.py                         # imshow+waitKey 体渲染（同上漏登）
  - samples/python/visualize_mono_calibration.py     # matplotlib SpanSelector 交互

  # ---- samples/dnn（24）----
  # 通用画像：readNet*(ONNX) + setInput + forward 纯推理，但结果展示
  # 全部 imshow/waitKey（部分 VideoCapture(0)/视频输入兜底）。"strip
  # GUI 3-5 行 + 切 CANN 2 行"即可升 supported——留待上游 headless 化
  # 或暴露 backend 参数后批量迁移。
  - samples/dnn/action_recognition.py    # 3D-ResNet34 Kinetics；额外硬编码 DNN_BACKEND_INFERENCE_ENGINE（:49，OpenVINO）——CANN 镜像无 IE
  - samples/dnn/alpha_matting.py         # MODNet ONNX；namedWindow x3
  - samples/dnn/auto_white_balance.py    # FC4 ONNX；imshow+waitKey（最易 strip）
  - samples/dnn/classification.py        # squeezenet/googlenet/resnet50；imshow+摄像头兜底
  - samples/dnn/colorization.py          # Siggraph ONNX；imshow；backend 菜单含 IE 项
  - samples/dnn/deblurring.py            # NAFNet ONNX；imshow x2
  - samples/dnn/edge_detection.py        # 5.0.0 新增（原 manifest 只登记了 .cpp，.py 漏登）；imshow+视频输入
  - samples/dnn/face_detect.py           # FaceDetectorYN 高层 API（非 readNet 路径），CANN 后端不直接适用；imshow+摄像头
  - samples/dnn/fast_neural_style.py     # instance-norm ONNX；imshow+视频
  - samples/dnn/human_parsing.py         # 5.0.0 新增（.py 原漏登）；imshow；backend 菜单含 IE
  - samples/dnn/inpainting.py            # 5.0.0 新增（.py 原漏登）；imshow
  - samples/dnn/ldm_inpainting.py        # 5.0.0 新增；LDM 三段 ONNX（需按文档自行导出）；imshow+waitKey 循环
  - samples/dnn/mask_rcnn.py             # imshow+视频（4.x 归 object_detection 家族，5.0.0 独立成文件）
  - samples/dnn/object_detection.py      # yolo/ssd/faster-rcnn；imshow+摄像头兜底
  - samples/dnn/object_tracker.py        # 5.0.0 新增（.py 原漏登）；imshow+视频
  - samples/dnn/openpose.py              # cv.dnn.readNet(.proto,.caffemodel)——5.0.0 已移除 Caffe importer，上游断供；另有 imshow+摄像头
  - samples/dnn/optical_flow.py          # RAFT ONNX（旧 FlowNet Caffe 管线 5.0.0 已删；原 manifest 记 Caffe 障碍已过时）；imshow+waitKey
  - samples/dnn/person_reid.py           # 5.0.0 新增（.py 原漏登）；imshow+视频
  - samples/dnn/segmentation.py          # fcn-resnet50/u2netp；imshow+摄像头兜底
  - samples/dnn/siamrpnpp.py             # SiamRPN++ ONNX；imshow+视频；backend 菜单含 IE
  - samples/dnn/speech_recognition.py    # imshow+waitKey；backend 菜单含 IE
  - samples/dnn/super_resolution.py      # SeeMoreDetails ONNX；namedWindow x2 键盘循环
  - samples/dnn/text_detection.py        # DB/EAST ONNX；imshow
  - samples/dnn/virtual_try_on.py        # 5.0.0 新增（.py 原漏登）；imshow；backend 菜单含 IE

  # ===== 2. device_blocked =====
  - samples/dnn/custom_layer.py   # headless 纯推理，但走 CPU 自定义层注册路径——cannops 未实现 custom layer 注册

  # ===== 3. cpu_only =====
