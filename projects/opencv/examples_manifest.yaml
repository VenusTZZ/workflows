  # BUILD_EXAMPLES=ON + cmake add_executable 单独编译链，本期不接入
  # （保留"未来可加"语义，peft 同款归类）。
  - samples/cpp/**                  # 226 文件（含 124 tutorial .cpp），GUI/相机 demo 居多
  - samples/dnn/*.cpp               # 与 .py 对应的 C++ 版（alpha_matting / auto_white_balance / classification / colorization / deblurring / edge_detection / face_detect / human_parsing / inpainting / object_detection / object_tracker / openpose / person_reid / segmentation / speech_recognition / super_resolution / text_detection + 纯 C++ 的 custom_layer_onnx）
