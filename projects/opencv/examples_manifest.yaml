version: 1

# OpenCV examples guard manifest.
#
# Pattern reference: projects/peft/examples_manifest.yaml + the
# engine's docs/examples-guard-engine.md.
#
# === Why this manifest points to scripts in `examples/` (NOT in
# `samples/python/`) ===
#
# peft's manifest guards upstream `huggingface/peft/examples/` entries
# (real files in the upstream tree). OpenCV has no such curated
# example tree: its upstream `samples/python/` are full demo apps
# (namedWindow + waitKey, no headless mode) and the doc-curated
# Quick-start snippets we actually want to keep working live here in
# `projects/opencv/examples/`.
#
# For this manifest to be runnable through the engine, the scripts
# need to be present in the upstream `target` tree at the path
# stated under each `supported.path`. There are two ways to make
# that true:
#
#   (A) Push them to a fork of opencv (e.g. cosdt-ci-test/opencv)
#       and have the engine's `upstream_repo` input point at the
#       fork. This is the path this manifest is written for. The
#       scripts in projects/opencv/examples/ here are the canonical
#       source that gets mirrored to that fork.
#
#   (B) Skip the engine and run the scripts directly out of the
#       workflows checkout (e.g. via a workflow that copies
#       projects/opencv/examples/ into $TARGET_ROOT/examples/ before
#       calling the engine). This requires a small engine tweak
#       we have not made.
#
# Until (A) or (B) is in place, the manifest-check step (run on the
# engine's monitor job) will report `supported example missing from
# target tree` for every entry. The local-coder verification in
# this commit (recorded in `docs/`-side comments) copies the scripts
# into the opencv checkout and runs them directly, so each example
# is independently verified regardless of the engine plumbing.
#
# `scan.exclude` is declared as documentation; the engine does not
# scan the target tree (per engine design §2.7) — `scan.root` /
# `include_extensions` / `exclude` are forward-compatible with a
# future `discover` workflow that finds un-classified examples.

scan:
  root: examples
  include_extensions: ['.py', '.sh']
  exclude:
    - '**/__pycache__'
    - '**/__init__.py'
    - '**/test_*'
    - 'README.md'
    # ===== "非 example"配套物（不归 unsupported，归 scan.exclude）=====
    # helper / 构建配置 / 文档 / 资源——它们不是 example,放 unsupported
    # 会让"全量 review"信号混入噪声；放 scan.exclude 让 unsupported 段
    # 只剩"是 example 但跑不动"。窗口专属 .cmd 与 Windows 安装包单独
    # 留在 unsupported.windows 段，因为它们"是 example"但跑不到 Linux。
    - samples/python/_coverage.py        # 上游测试覆盖率 helper
    - samples/python/_doc.py             # doc 生成 helper
    - samples/python/common.py           # samples/python 共享 helper
    - samples/python/CMakeLists.txt      # 构建配置
    - samples/python/tutorial_code/**    # C++ 教程的 Python 翻译，多数需 GUI/相机
    - samples/python/snippets/*.py       # 同上
    - samples/dnn/common.py              # helper
    - samples/dnn/common.hpp             # C++ helper
    - samples/dnn/custom_layers.hpp      # C++ helper
    - samples/dnn/custom_layer_onnx.cpp  # C++ helper
    - samples/dnn/download_models.py     # 模型下载 helper（被 .py demo 引用拉 ONNX）
    - samples/dnn/shrink_tf_graph_weights.py  # TF graph 工具 helper
    - samples/dnn/tf_text_graph_*.py     # TF→OpenCV text graph 转换 helper（4 个文件：common/efficientdet/faster_rcnn/ssd）
    - samples/dnn/.gitignore             # 仓库元数据
    - samples/dnn/CMakeLists.txt         # 构建配置
    - samples/dnn/README.md              # 文档
    - samples/CMakeLists.txt             # 构建配置
    - samples/data/                      # 资源（图/视频/模型二进制）

supported:
  # ===== 已在 coder hdc-stable-npu-2（910B4×2, torch 2.9.0+cpu,
  # torch_npu 2.9.0.post2, CANN 9.1.0）逐例验证通过（exit 0）=====
  # 全部 8 个 example 走 examples/quickstart_*.py（.sh）。依赖安装 + 源码
  # 编译见 scripts/setup_example.sh；脚本运行参数展开见
  # scripts/run_example.sh（沿用 peft 通用契约，只多了 nnal/atb 顺序
  # 与 PYTHONPATH 校验两处 opencv-specific 处理）。
  #
  # `profile: opencv` 单一 profile，setup 干 4 件事：
  #   (1) source CANN env（含 nnal/atb——cannops gtest 要用）；
  #   (2) 源码编译 opencv + opencv_contrib（idempotent，跳过已装的）；
  #   (3) PYTHONPATH 头插 /usr/local/opencv-cann/lib/.../cv2（保留
  #       镜像的 CANN Python bits；setdefault 会偷偷留镜像值→pip
  #       wheel 抢回，CI 33286049447 实测翻车）；
  #   (4) 拷 baboon.jpg + mobilenetv2-12.onnx 到 $TARGET_ROOT/fixtures/。
  # 编译一次性（首次 50–70 min at -j2），同 runner 后续 example 复用
  # /usr/local/opencv-cann（image overlay 持久，不受 stop 影响；rebuild
  # 才会清空）。

  # 9a. imread / imwrite：基础 I/O，BGR->PNG。CPU only，源码编译
  # 唯一目的是让 cv2 与 CANN 编译后二进制一致（避免 wheel/源码两边
  # import 路径分裂）。
  - path: examples/quickstart_imread_imwrite.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []   # 无：脚本默认值（baboon.jpg 来自 opencv/samples/data/，输出到 /tmp）
    timeout_minutes: 10   # 编译后只跑这步 1-2 秒；timeout 给 10 分钟是为矩阵编排预留
    # 不加 overlay 的原因：脚本接受 --image / --output，但 CI 想要
    # 的就是默认行为（固定输入、固定输出、固定 shape (512,512,3)）。
    # 任何 overlay 都是"为了不同 CI 复用同一脚本"，目前没有该需求。

  # 9b. cvtColor：BGR -> 灰度。CPU only。脚本固定输出 mean；baboon 实测
  # 约 129.7（不同 libjpeg 版本抖动 < 0.5），脚本容忍这点。
  - path: examples/quickstart_cvtcolor.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 10
    # 不加 overlay 的原因：同 9a——保持 doc 行为可复现。

  # 9c. resize：BGR 50x200 INTER_AREA。CPU only。
  - path: examples/quickstart_resize.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 10
    # 不加 --width/--height overlay：50x200 是 doc 给的"窄而高"
    # 演示值，刻意让输出 shape 与 doc test-result 对齐 (200,50,3)。
    # 上游 opencv resize 的 (W, H) 参数顺序反直觉，固化在脚本里
    # 反而比 overlay 更稳。

  # 9d. rectangle + putText：CPU only，immutable 复盖原图。
  - path: examples/quickstart_draw.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 10
    # 不加 --text overlay：默认 'Hello OpenCV' 与 doc 图片
    # (images/quickstart-draw.png) 一致。改文字会破坏 doc 视觉对账。

  # 9e. VideoWriter：3 帧 MJPG AVI。CPU only。
  - path: examples/quickstart_video.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 10
    # 不加 overlay：默认 320x320 + 10 fps + 3 帧 = doc 演示规模；
    # 镜像不带 FFmpeg/GStreamer（only MJPG fourcc 走得通），改编码
    # 或分辨率会让 VideoWriter.isOpened() 返 false。over-spec 不划算。

  # 版本探针：cv2 + DNN_BACKEND_CANN + DNN_TARGET_NPU 三个枚举
  # 都要非零。CPU only，但唯一能验证"PYTHONPATH 真的指到源码编译
  # 的 cv2"——pip wheel 的 DNN_BACKEND_CANN == 0，import 时混进去
  # 的话后续 DNN 推理全在 CPU 上跑，cann 看上去没启动。
  - path: examples/quickstart_py_version.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 5
    # 不接受任何 overlay：是纯探针，行为 = 三个 print + assert。

  # DNN 推理：MobileNetV2 ONNX forward on NPU via CANN。CPU 不可
  # 比——脚本里 readNetFromONNX + setPreferableBackend(CANN) +
  # setPreferableTarget(NPU) 是整套 NPU 路径。首次 forward 含 GE 图
  # 编译（~0.5–1 min），二次 forward ~1ms。
  - path: examples/quickstart_dnn_inference.py
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # 为什么加 --engine classic：OpenCV 5.0.0 默认 onnx_importer2
      # 新引擎**尚未支持非 CPU 后端**——setPreferableBackend / Target
      # 被静默忽略（仅 WARN），推理实际跑在 CPU。classic 引擎
      # (4.x 行为) 真正走 switchToCannBackend → GE → NPU。OPENCV
      # _FORCE_DNN_ENGINE=1 在脚本顶部 set，不放到 overlay 是因为
      # 这条开关是 NPU 路径成立的必要条件，不是"可选调参"。
      - --engine classic
      # 为什么加 --model ${FIXTURE_DIR}/mobilenetv2-12.onnx：脚本默认
      # 从 fixtures 路径拷到 /tmp（已 setup 时搬好），overlay 显式
      # 指过来是为了让路径在 CI 日志里可见（"哪份模型在跑"）。
      # 不传则脚本自动 fallback 到 github.com/onnx/models（CI 国内
      # 网络 RemoteDisconnected 高发，重试 5 次仍不稳）。
      - --model ${FIXTURE_DIR}/mobilenetv2-12.onnx
    timeout_minutes: 30
    # timeout 给 30 min：首次 GE 编译 + JSON 解析合计 ~2 min，留
    # 25 min 给 driver/CANN mismatch 触发的 SIGABRT 134 重试
    # （实测 4 次 8 min；30 min 余量含部署/mirror 抖动）。
    #
    # 不加 --device overlay：脚本硬编码 DNN_BACKEND_CANN + DNN_TARGET
    # _NPU；切到 CPU 等价于"不做 NPU 看护"，与 example 目的相悖。

  # CANN 单元测试：78 个 gtest 跑 53 个（25 个 known-broken 过滤掉）。
  # 唯一走 .sh 而非 .py 的 example——gtest 进程不接受 python 包装，
  # 直跑 binary 最短。脚本"最后一行是 binary + $@" 满足通用
  # run_example.sh 的 "$@" 自动追加契约。
  - path: examples/quickstart_cann_unit_tests.sh
    profile: opencv
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []   # 25 个排除项硬编码在脚本里 EXCLUDE_FILTER
                      # 数组；改排除集要走代码 review，不该被 overlay
                      # 偷偷覆盖。
    timeout_minutes: 60
    # 60 min 而非默认：78 个 gtest 实际 ~5 min（含 graph 编译 + 内存
    # fixture 准备），余量给 driver 抖动；31 min 与 9a-9e 矩阵并行
    # 收敛到 60 min 大关（CI 240 min job budget 配 4 并行 leg）。

# ===== unsupported =====
# 四段（从前往后）：
#   1. environment_blocked  需 hosting/gui/相机/管线依赖，CI 跑不动
#   2. cpp_matrix_skip      C++ demo，矩阵只跑 .py / .sh
#   3. cpu_only             纯 CPU 算法（erode/dilate/floodFill/pyrDown/pyrUp），
#                           NPU 看护价值低；放 unsupported 段最后
#   4. windows              Windows 专属（.cmd / winpack），放 cpu 后面
#
# 设备无关但默认 backend=DNN_BACKEND_OPENCV 的 12 个 samples/dnn/*.py
# 不在本段，归末尾的 `device_independent_gpu_capable` 单独段——
# 源码分析后可能升 supported。

unsupported:
  # ===== 1. environment_blocked =====
  # 上游 samples/python/* 大多数 demo 在 import 阶段就 import cv2 并
  # cv2.namedWindow(...)：镜像不带 libgtk/libqt，cv2.highgui 编译时
  # BUILD_opencv_highgui 没勾选；setup_example.sh 的 BUILD_LIST 明确
  # 不勾 highgui——是故意取舍（headless CI 不需要 GUI 插件）。任何
  # GUI demo 都会在 highgui 符号未定义上 AttributeError。
  - samples/python/drawing.py                  # namedWindow + waitKey，headless 不可用
  - samples/python/grabcut.py                  # 同上 + setMouseCallback
  - samples/python/mouse_and_match.py          # 同上 + cv2.setMouseCallback
  - samples/python/plane_tracker.py            # 同上
  - samples/python/qrcode.py                   # detectAndDecode 后 waitKey
  - samples/python/asift.py                    # 同样需要 namedWindow
  - samples/python/calibrate.py                # 同上
  - samples/python/macbeth_chart_detection.py  # 同上
  - samples/python/aruco_detect_board_charuco.py  # 同上
  - samples/python/essential_mat_reconstr.py   # 同上
  - samples/python/color_correction_model.py   # 同上
  - samples/python/visualize_mono_calibration.py  # 同上
  - samples/python/point_cloud.py              # 同上
  - samples/python/stereo_match.py             # 同上
  - samples/python/stitching_detailed.py       # 同上
  - samples/python/audio_spectrogram.py        # 同上
  - samples/python/tst_scene_render.py         # 3D 场景渲染 + waitKey
  - samples/python/opencv_version.py           # 已被 examples/quickstart_py_version.py 覆盖（带 CANN enum 断言）
  - samples/python/odometry.py                 # 同上（GUI demo）
  - samples/python/demo.py                     # 综合 demo（GUI）
  - samples/python/background_subtractor_mask.py  # waitKey
  - samples/python/camera_calibration_show_extrinsics.py  # waitKey
  - samples/dnn/dnn_model_runner/**            # 转换 + 评估管线，CI 矩阵跑不动整链

  # ===== 2. cpp_matrix_skip =====
  # run_example.sh 的解释器分发（"path 以 .sh → bash，.py → python"）
  # 不覆盖 .cpp。C++ 走 BUILD_EXAMPLES=ON + cmake add_executable，需
  # 单独 compile 链，本期不接入。归 unsupported 而非 scan.exclude：
  # 保留"未来可加"的语义（peft 也是这么归 cpp）。
  - samples/cpp/**                             # 198 .cpp + 124 tutorial .cpp + 资源；C++ demo 走 GUI / 相机，CI runner 不装 GTK/Qt
  # samples/dnn/*.cpp 是对应 .py 的 C++ 版，命名以 5.0.0 实际为准：
  # 原 manifest 沿用的"理想化"文件名有 3 处错位，已修
  # (pose_estimation → openpose / face_detection → face_detect /
  #  style_transfer 不存在 .cpp 版本)。
  - samples/dnn/alpha_matting.cpp              # C++ DNN demo，与 .py 版对应；矩阵不跑 .cpp
  - samples/dnn/auto_white_balance.cpp         # 同上
  - samples/dnn/classification.cpp             # 同上
  - samples/dnn/colorization.cpp               # 同上
  - samples/dnn/deblurring.cpp                 # 同上
  - samples/dnn/object_detection.cpp           # 同上
  - samples/dnn/openpose.cpp                   # 5.0.0 实际文件名（原 manifest 写作 pose_estimation.cpp）
  - samples/dnn/segmentation.cpp               # 同上
  - samples/dnn/text_detection.cpp             # 同上
  - samples/dnn/face_detect.cpp                # 5.0.0 实际文件名（原 manifest 写作 face_detection.cpp）
  - samples/dnn/super_resolution.cpp           # 同上
  - samples/dnn/edge_detection.cpp             # 5.0.0 新增，矩阵不跑 .cpp
  - samples/dnn/human_parsing.cpp              # 5.0.0 新增
  - samples/dnn/object_tracker.cpp             # 5.0.0 新增
  - samples/dnn/person_reid.cpp                # 5.0.0 新增
  - samples/dnn/speech_recognition.cpp         # 5.0.0 新增
  - samples/dnn/custom_layer.py                # 自定义层 demo：CPU DNN，无 NPU 价值（cannops 还没实现 custom layer 注册路径）

  # ===== 3. cpu_only (放在 unsupported 段最后) =====
  # 明确"算法型" demo：只用 cv2 基础算子（erode/dilate/floodFill/
  # pyrDown/pyrUp）。CANN backend 在 opencv_test_cannops 里**只覆盖**
  # 这些算子的一部分（CVT_COLOR / ELEMENTWISE / CORE.RESIZE 的 53 个），
  # 且不在 quickstart demo 范畴；NPU 看护价值低，留给 gtest 套件
  # (examples/quickstart_cann_unit_tests.sh) 即可。
  - samples/python/morphology.py               # erode / dilate / morphologyEx，纯 CPU 算法
  - samples/python/floodfill.py                # cv2.floodFill，纯 CPU 算法
  - samples/python/lappyr.py                   # pyrDown / pyrUp Laplacian 金字塔，纯 CPU 算法

  # ===== 4. windows (放在 cpu_only 后面) =====
  # Windows 专属，CI runner 是 Linux（cann:9.1.0-910b-ubuntu22.04-py3.12）。
  # _run_winpack_demo.cmd 是 .cmd 启动脚本；winpack_packaging/** 是
  # OpenCV Windows 安装包（.exe / .iss），与 Linux runner 无关。
  - samples/python/_run_winpack_demo.cmd       # Windows 启动脚本（CI runner Linux）
  - samples/winpack_packaging/**               # Windows 安装包，Linux runner 不适用

  # ===== 5. CANN gtest：25 个 known-broken 排除项 =====
  # opencv_test_cannops 共 78 个 gtest；本节 25 个被 examples/
  # quickstart_cann_unit_tests.sh 的 EXCLUDE_FILTER 数组显式
  # 排除。每条附理由（来自 docs/Quick-start-Ascend.md §"跑 CANN
  # 单元测试"实测 2026-09-02）。
  - test_cannops/CORE.RESIZE                       # ResizeArea 算子 GE shape 推断失败（910B 稳定挂）
  - test_cannops/CORE.RESIZE_NEW                   # ResizeArea NEW kernel 数值抖动 flaky
  - test_cannops/CORE.CROP_RESIZE                  # 与 CPU 参考稳定差 2，超容差 1
  - test_cannops/CORE.CROP_RESIZE_MAKE_BORDER      # 容差 1e-10 近似逐位比较，910B4 稳定挂
  # CVT_COLOR XYZ / YCrCb / YUV 系 18 个：cvtColor 对非 32F 输入
  # 用两次 threshold 截断饱和中间结果（color.cpp 的 THRESH_TRUNC +
  # THRESH_TO_ZERO），与 threshold 系用例落在同一个 AscendC kernel
  # 上，该 kernel 在 910B 上 AI Core 越界（VEC 指令 UB 地址越界，
  # kernel 源码 bug）。纯 32F 融合算术路径实测全过。
  - test_cannops/CVT_COLOR.RGB2XYZ
  - test_cannops/CVT_COLOR.BGR2XYZ
  - test_cannops/CVT_COLOR.XYZ2BGR
  - test_cannops/CVT_COLOR.XYZ2RGB
  - test_cannops/CVT_COLOR.XYZ2BGR_DC4
  - test_cannops/CVT_COLOR.XYZ2RGB_DC4
  - test_cannops/CVT_COLOR.BGR2YCrCb
  - test_cannops/CVT_COLOR.RGB2YCrCb
  - test_cannops/CVT_COLOR.YCrCb2BGR
  - test_cannops/CVT_COLOR.YCrCb2RGB
  - test_cannops/CVT_COLOR.YCrCb2BGR_DC4
  - test_cannops/CVT_COLOR.YCrCb2RGB_DC4
  - test_cannops/CVT_COLOR.BGR2YUV
  - test_cannops/CVT_COLOR.RGB2YUV
  - test_cannops/CVT_COLOR.YUV2BGR
  - test_cannops/CVT_COLOR.YUV2RGB
  - test_cannops/CVT_COLOR.YUV2BGR_DC4
  - test_cannops/CVT_COLOR.YUV2RGB_DC4
  # threshold 系 3 个：与 CVT_COLOR 同根因，AscendC kernel UB OOB。
  - test_cannops/ELEMENTWISE_OP.MAT_THRESHOLD
  - test_cannops/ELEMENTWISE_OP.MAT_THRESHOLD_ASCENDC
  - test_cannops/ASCENDC_KERNEL.THRESHOLD

  # ===== 6. device_independent_gpu_capable =====
  # samples/dnn/*.py 都是 readNet* + setInput + forward() 模式：
  # 默认 backend=DNN_BACKEND_OPENCV（CPU），切到 CANN+ NPU 是 2 行
  # 改。但**前 12 个都用 namedWindow + imshow + waitKey**(部分还
  # cv2.VideoCapture(0) 摄像头兜底)，源码分析 2026-05-17 (coder
  # npu-2 Explore agent) 逐条确认未升。命名以下游 5.0.0 实际文件为准
  # (原 manifest 沿用的"理想化"文件名与上游实际文件名有 3 处错位，
  # 已修)。
  #
  # "strip GUI + 切 CANN"改写成本 3-5 行的候选（Explore agent 列出的
  # closest pure-inference；写新 examples/quickstart_<task>.py + 在
  # 这里把对应路径下移到 supported 即可）：
  #   - samples/dnn/auto_white_balance.py    FC4 ~几 MB,纯 readNet 推理
