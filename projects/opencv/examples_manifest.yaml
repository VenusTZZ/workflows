  - samples/python/opencv_version.py  # 纯版本打印；CANN enum 断言已并入 setup_example.sh 第 5 步 sanity

  # ===== 4. eval_pipeline =====
  - samples/dnn/mobilenet_ssd_accuracy.py   # TF 模型精度评估，需 VOC/COCO 数据集与参考标注，非单例推理

  # ===== 5. cpp_matrix_skip（非 .py/.sh，不占上面计数）=====
