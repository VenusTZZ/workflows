  # ===== I. 单节点 sh wrapper（不是 config 自己）=====
  # examples/disagg/run_online.sh 和 run_offline.sh 是单节点薄壳 wrapper，把 CONFIG=env
  # 翻译成 `specforge train --config $CONFIG "$@"`，逻辑上等价于直接 `specforge train -c <yaml>`。
  # 把它俩注册成独立 example 会和 yaml config 条目语义重复（同一份 recipe 跑两次覆盖不同 wrapper
  # 没有意义），所以统一通过 yaml config 条目覆盖；这两个 sh 列为 unsupported 仅作清单完整性。
  - examples/disagg/run_online.sh
  - examples/disagg/run_offline.sh
