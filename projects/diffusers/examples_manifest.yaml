  #     - --caption_column prompt.txt
  #     - --video_column videos.txt
  #     - --height 256 --width 256                                  # 默认 480x720 在 29.5GB 卡上 OOM
  #     - --max_num_frames 9                                        # 默认 49；(n-1)%4==0 约束，9 合法
  #     - --gradient_checkpointing
