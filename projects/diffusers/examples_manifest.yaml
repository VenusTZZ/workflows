  #     - --dataset_name ${THREE_D_ICON_PATH}                   # hf-mirror: linoyts/3d_icon（本地 imagefolder 目录）
  #     - --instance_prompt "3d icon in the style of TOK"
  #     - --output_dir ${CI_OUTPUT_DIR}
  #     - --caption_column prompt
  #     - --mixed_precision bf16
  #     - --resolution 128
  #     - --train_batch_size 1
  #     - --gradient_checkpointing
  #     - --optimizer prodigy
  #     - --max_train_steps 1
