      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 120

