  # 又被 transformers 的 zero.Init 冻结模块 bug 打坏（teacher/target/文本
  # 编码器全是冻结模块，同 CLIP max_position_embeddings=0 那个坑）。LoRA 版
  # （supported）已覆盖该蒸馏链路。回归条件：transformers 修复 zero.Init 下
  # 冻结模块的构造，或上游给 target_unet 提供 cast 选项。
