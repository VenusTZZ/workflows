version: 1
scan:
  root: examples
  # .yaml is not scanned: the files under examples/ are deepspeed/accelerate
  # run configs, not launchable examples. .md/.txt/.json are non-examples.
  include_extensions: ['.py', '.sh']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。2026-10-08 起
  # 对齐收口：原 scan.exclude 的 33 条规则全部迁入
  # unsupported 段（上游自测 / helper / pipeline 模块 / community 整目录等，
  # 带分组注释与理由），scan 只保留 root + include_extensions 两个键。
  # unsupported 覆盖全部 308 个扫描文件：supported(49) + unsupported(259)。

# 新版 diffusers 需求 huggingface-hub>=1.23，huggingface-hub>=1.23 需求
# transformers>=5.x，任何 transformers<5.x 的用例都无法跑通

supported:
  # # ===== 已在昇腾单卡容器（CANN 9.1.0 / torch 2.9.0 / torch_npu 2.9.0.post2，
  # # 与 quick-start 同镜像）跑通 =====
  # #
  # # overlay 里的 ${...} 由 setup_example.sh 预下后写入 GITHUB_ENV：
  # #   ${SDXL_BASE_PATH} / ${THREE_D_ICON_PATH}  <- profile diffusers-sdxl
  # #   ${SD15_MODEL_PATH} / ${THREE_D_ICON_PATH} <- profile diffusers-sd15

  # # SDXL 高级 Dreambooth LoRA。上游命令见
  # # examples/advanced_diffusion_training/README.md「3D icon example」。
  # - path: examples/advanced_diffusion_training/train_dreambooth_lora_sdxl_advanced.py
  #   profile: diffusers-sdxl
  #   runner: linux-aarch64-a2-1
  #   image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
  #   overlay_args:
  #     - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
  #     - --variant fp16
  #     - --dataset_name hf-internal-testing/dummy_image_text_data
  #     - --instance_prompt "a 3d icon in the style of TOK"
  #     - --output_dir ${CI_OUTPUT_DIR}
  #     - --caption_column text
  #     - --mixed_precision bf16
  #     - --resolution 128
  #     - --train_batch_size 1
  #     - --gradient_checkpointing
  #     - --optimizer prodigy
  #     - --max_train_steps 1
  #   timeout_minutes: 90

