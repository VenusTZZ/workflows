version: 1
scan:
  root: examples
  # .yaml is not scanned: the files under examples/ are deepspeed/accelerate
  # run configs, not launchable examples. .md/.txt/.json are non-examples.
  include_extensions: ['.py', '.sh']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。exclude 项为目录
  # 路径（递归剪枝）或 glob（`**` 跨目录，匹配相对 target root 的路径），
  # 排除"不是 example 的配套物"：上游自测、helper 模块、入口背后的实现文件。
  # 扫描工具的 exclude 支持随发现 workflow 的 PR 落地；examples 引擎不扫描，
  # 本段当前只是声明。
  exclude:
    - '**/test_*'                    # 上游自测（test_dreambooth*.py 等）
    - '**/conftest.py'
    - '**/__init__.py'
    - '**/utils.py'                  # 单文件 helper
    - '**/utils/**'                  # helper 模块目录
    - '**/profiling_utils.py'
    - '**/discriminator.py'          # train_vqgan.py 的判别器实现
    - examples/research_projects/anytext/ocr_recog/**        # anytext 的 OCR 实现
    - examples/research_projects/promptdiffusion/pipeline_prompt_diffusion.py
    - examples/research_projects/promptdiffusion/promptdiffusioncontrolnet.py
    - examples/research_projects/pixart/pipeline_pixart_alpha_controlnet.py
    - examples/research_projects/gligen/dataset.py
    - examples/research_projects/gligen/make_datasets.py
    - examples/research_projects/rdm/retriever.py
    - examples/research_projects/wuerstchen/text_to_image/modeling_efficient_net_encoder.py

supported:
  # ===== 已在昇腾单卡容器（CANN 9.1.0 / torch 2.9.0 / torch_npu 2.9.0.post2，
  # 与 quick-start 同镜像）跑通 =====
  #
  # overlay 里的 ${...} 由 setup_example.sh 预下后写入 GITHUB_ENV：
  #   ${SDXL_BASE_PATH} / ${THREE_D_ICON_PATH}  <- profile diffusers-sdxl
  #   ${SD15_MODEL_PATH} / ${THREE_D_ICON_PATH} <- profile diffusers-sd15

  # SDXL 高级 Dreambooth LoRA。上游命令见
  # examples/advanced_diffusion_training/README.md「3D icon example」。
  - path: examples/advanced_diffusion_training/train_dreambooth_lora_sdxl_advanced.py
    profile: diffusers-sdxl
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path hf-internal-testing/tiny-stable-diffusion-xl-pipe   # tiny（上游测试同款）
      - --dataset_name hf-internal-testing/dummy_image_text_data                             # tiny image+text
      - --instance_prompt "a 3d icon in the style of TOK"
      - --output_dir ${CI_OUTPUT_DIR}
      - --caption_column text
      - --mixed_precision bf16
      - --resolution 128
      - --train_batch_size 1
      - --gradient_checkpointing
      - --optimizer prodigy
      - --max_train_steps 1
    timeout_minutes: 90

  # SD1.5 高级 Dreambooth LoRA。上游命令见
  # examples/advanced_diffusion_training/README.md「3d icon example」的 SD1.5变体。
  #
  # 训练-only smoke：有意不传 --validation_prompt。SD1.5 的 validation 会走
  # StableDiffusionPipeline.from_pretrained(<本地模型>)，加载 safety_checker /
  # feature_extractor；setup 的 allow_file_pattern 为省 ~2.4 GB 没下这两个
  # 目录，而 diffusers 对缺失子目录没有兜底（pipeline_loading_utils.py
  # load_sub_model 会退回根目录加载并抛错）。训练本身不需要它们。
  # 2026-09-17 已在昇腾机验证 no-validation 路径跑完（rc=0）。
  - path: examples/advanced_diffusion_training/train_dreambooth_lora_sd15_advanced.py
    profile: diffusers-sd15
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}    # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --dataset_name ${THREE_D_ICON_PATH}                   # hf-mirror: linoyts/3d_icon（本地 imagefolder 目录）
      - --instance_prompt "3d icon in the style of TOK"
      - --output_dir ${CI_OUTPUT_DIR}
      - --caption_column prompt
      - --mixed_precision bf16
      - --resolution 128
      - --train_batch_size 1
      - --gradient_checkpointing
      - --optimizer prodigy
      - --max_train_steps 1
    timeout_minutes: 90

  # Amused-256 微调。上游命令见 examples/amused/README.md。
  # 原先用 m1guelpf/nouns（HF 数据集，328MB LFS parquet）运行时下载，CI 上
  # 三次都在取数据集阶段容器崩溃（模型 amused-256 本身已从 hf-mirror 下完）。
  # 改用仓库 fixture（fixtures/DOG.jpg）本地目录，走 InstanceDataRootDataset，
  # prompt 取文件名，零下载。
  # --report_to 默认是 wandb，不能改成 tensorboard：amused 会把 list 型参数
  # （lora_target_modules 等）传进 init_trackers，tensorboard 的 add_hparams
  # 只收标量，会 ValueError。故 profile 装 wandb，全局设 WANDB_MODE=disabled
  # 让它离线。不传 --validation_prompts，与训练-only smoke 策略一致。
  - path: examples/amused/train_amused.py
    profile: diffusers-amused
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path amused/amused-256     # hf-mirror（ModelScope 无）
      - --instance_data_dir ${FIXTURE_DIR}                    # 本地 fixture（fixtures/DOG.jpg），prompt 取文件名
      - --resolution 256
      - --mixed_precision fp16
      - --train_batch_size 1
      - --max_train_steps 1
      - --checkpointing_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # CogVideoX-2b LoRA 微调。上游命令见 examples/cogvideo/README.md。
  # 模型从 ModelScope 预下（AI-ModelScope/CogVideoX-2b）；数据集用
  # Wild-Heart/Disney-VideoGeneration-Dataset（69 个 6s 视频，~25 MB，本身就是
  # README 的 prompt.txt + videos.txt + videos/ 格式），无 ModelScope 镜像，
  # setup 走 hf-mirror 下载（视频是 Xet-backed，若 cas-bridge 不可达需改cache-seed）。
  # --report_to 默认 None，无 wandb 问题。脚本末尾会加载完整
  # pipeline 做 final inference（不传 --validation_prompt 时只加载、不生成）。
  # 2026-09-17 昇腾机手动验证跑完（rc=0）；2026-09-18 CI 用默认 480x720/49 帧
  # NPU OOM，故加 --height/--width 256 + --max_num_frames 9 + --gradient_checkpointing
  # + --enable_slicing/--enable_tiling 压内存。
  - path: examples/cogvideo/train_cogvideox_lora.py
    profile: diffusers-cogvideo
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${COGVIDEOX_MODEL_PATH}   # ModelScope: AI-ModelScope/CogVideoX-2b
      - --instance_data_root ${COGVIDEOX_DATASET_DIR}             # hf-mirror: Wild-Heart/Disney-VideoGeneration-Dataset
      - --caption_column prompt.txt
      - --video_column videos.txt
      - --height 256 --width 256                                  # 默认 480x720 在 29.5GB 卡上 OOM
      - --max_num_frames 9                                        # 默认 49；(n-1)%4==0 约束，9 合法
      - --gradient_checkpointing
      - --enable_slicing --enable_tiling
      - --train_batch_size 1
      - --max_train_steps 1
      - --checkpointing_steps 1
      - --mixed_precision fp16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 120

  # LCM 一致性蒸馏（webdataset 流式）。上游命令见
  # examples/consistency_distillation/。teacher 用 SD1.5（ModelScope 预下）；
  # 训练分片用 ModelScope 镜像的 laion/conceptual-captions-12m-webdataset：
  # hf-mirror 上该 tar 是 Xet-backed（302 到 cas-bridge，CI runner 可能不可达），
  # ModelScope 走 cdn-lfs-cn-1（国内可达）。--max_train_samples 1 只取 1 个样本，
  # 流式读一点即停。--report_to 默认 tensorboard，无 wandb 问题。
  - path: examples/consistency_distillation/train_lcm_distill_sd_wds.py
    profile: diffusers-lcm
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_teacher_model ${SD15_MODEL_PATH}      # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision fp16
      - --resolution 256
      - --max_train_steps 1
      - --max_train_samples 1
      - --dataloader_num_workers 1
      - --train_shards_path_or_url "pipe:curl -L -s https://www.modelscope.cn/datasets/laion/conceptual-captions-12m-webdataset/resolve/master/data/{00000..00000}.tar"
      - --train_batch_size 1
      - --gradient_accumulation_steps 1
      - --checkpointing_steps 1
    timeout_minutes: 120

  # LCM LoRA 一致性蒸馏（webdataset 流式，LoRA rank=4）。同 profile，teacher
  # SD1.5；分片同样用 ModelScope 镜像（理由同上一条）。上游命令见
  # examples/consistency_distillation/。
  - path: examples/consistency_distillation/train_lcm_distill_lora_sd_wds.py
    profile: diffusers-lcm
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_teacher_model hf-internal-testing/tiny-stable-diffusion-torch   # tiny teacher
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision fp16
      - --resolution 512
      - --lora_rank 4
      - --max_train_steps 1
      - --max_train_samples 1
      - --dataloader_num_workers 1
      - --train_shards_path_or_url "pipe:curl -L -s https://www.modelscope.cn/datasets/laion/conceptual-captions-12m-webdataset/resolve/master/data/{00000..00000}.tar"
      - --train_batch_size 1
      - --checkpointing_steps 1
    timeout_minutes: 120

  # LCM LoRA 一致性蒸馏（SDXL teacher + fp16-fix VAE，webdataset 流式）。
  # 与 SD 版同配方，LoRA rank=4；teacher/VAE 从 ModelScope 预下，分片用
  # ModelScope 镜像（理由同上）。全量 SDXL 版（train_lcm_distill_sdxl_wds.py）
  # 在 64GB 卡上仍 OOM，故用 LoRA 版。2026-09-17 昇腾机验证可跑。
  - path: examples/consistency_distillation/train_lcm_distill_lora_sdxl_wds.py
    profile: diffusers-lcm-sdxl
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_teacher_model stabilityai/stable-diffusion-xl-base-1.0      # 在线 hf-mirror（无 --variant，按 fp32 取 ~14GB）
      - --pretrained_vae_model_name_or_path madebyollin/sdxl-vae-fp16-fix
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision fp16
      - --resolution 512
      - --lora_rank 4
      - --max_train_steps 1
      - --max_train_samples 1
      - --dataloader_num_workers 1
      - --train_shards_path_or_url "pipe:curl -L -s https://www.modelscope.cn/datasets/laion/conceptual-captions-12m-webdataset/resolve/master/data/{00000..00000}.tar"
      - --train_batch_size 1
      - --checkpointing_steps 1
    timeout_minutes: 120

  # ControlNet 训练（SD1.5 base）。上游命令见 examples/controlnet/README.md。
  # 数据集 fusing/fill50k 由 example 运行时经 hf-mirror 现取（引擎已设
  # HF_ENDPOINT + HF_HUB_DISABLE_XET）。注意整个 diffusers 项目要求
  # datasets<4.0.0（已 pin 在基座）。2026-09-17 昇腾机验证可跑。
  - path: examples/controlnet/train_controlnet.py
    profile: diffusers-controlnet
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --output_dir ${CI_OUTPUT_DIR}
      - --dataset_name fusing/fill50k
      - --resolution 512
      - --train_batch_size 1
      - --max_train_steps 1
      - --checkpointing_steps 1
    timeout_minutes: 120

  # ControlNet 训练（SDXL base）。同样用 fill50k 脚本型数据集（datasets<4.0 +
  # trust_remote_code，profile 已设 HF_DATASETS_TRUST_REMOTE_CODE=1）。
  # 2026-09-17 昇腾机验证可跑。
  - path: examples/controlnet/train_controlnet_sdxl.py
    profile: diffusers-controlnet-sdxl
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0   # 在线 hf-mirror，fp16 variant ~6.6GB
      - --variant fp16
      - --output_dir ${CI_OUTPUT_DIR}
      - --dataset_name fusing/fill50k
      - --resolution 512
      - --train_batch_size 1
      - --max_train_steps 1
      - --checkpointing_steps 1
    timeout_minutes: 120

  # LLaDA2 block-refinement 训练 smoke。无硬编码 cuda、用 accelerator；
  # Qwen2.5-0.5B（0.92GB）+ --use_dummy_data（零数据集下载）。
  # 2026-09-18 昇腾机验证可跑。
  - path: examples/discrete_diffusion/train_llada2.py
    profile: diffusers-llada2
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path Qwen/Qwen2.5-0.5B
      - --use_dummy_data
      - --output_dir ${CI_OUTPUT_DIR}
      - --max_train_steps 1
      - --gradient_accumulation_steps 1
    timeout_minutes: 60

  # SD1.4 dreambooth（全量）。上游命令见 examples/dreambooth/README.md；
  # 数据集用 fixtures/DOG.jpg（${FIXTURE_DIR}，无下载）。2026-09-18 昇腾机验证可跑。
  - path: examples/dreambooth/train_dreambooth.py
    profile: diffusers-dreambooth
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD14_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-4
      - --instance_data_dir ${FIXTURE_DIR}
      - --output_dir ${CI_OUTPUT_DIR}
      - --instance_prompt "a photo of sks dog"
      - --resolution 512
      - --train_batch_size 1
      - --max_train_steps 1
      - --gradient_checkpointing
    timeout_minutes: 90

  # SD1.4 dreambooth LoRA。同上游 README；数据集同上（fixtures/DOG.jpg）。
  - path: examples/dreambooth/train_dreambooth_lora.py
    profile: diffusers-dreambooth
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD14_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-4
      - --instance_data_dir ${FIXTURE_DIR}
      - --output_dir ${CI_OUTPUT_DIR}
      - --instance_prompt "a photo of sks dog"
      - --resolution 512
      - --train_batch_size 1
      - --max_train_steps 1
      - --gradient_checkpointing
    timeout_minutes: 90

  # InstructPix2Pix（SD1.5）。上游命令见 examples/instruct_pix2pix/README.md；
  # 去掉 --enable_xformers（CUDA-only）和 --push_to_hub。数据集
  # fusing/instructpix2pix-1000-samples 运行时经 hf-mirror 取（Xet，CI 需 vendor/ModelScope）。
  # 2026-09-18 昇腾机验证可跑。
  - path: examples/instruct_pix2pix/train_instruct_pix2pix.py
    profile: diffusers-instruct-pix2pix
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --dataset_name fusing/instructpix2pix-1000-samples
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256 --random_flip
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
      - --checkpointing_steps 9999
      - --max_grad_norm 1
      - --conditioning_dropout_prob 0.05
      - --mixed_precision fp16
      - --seed 42
    timeout_minutes: 90

  # Kandinsky 2.2 decoder（全量）。上游命令见
  # examples/kandinsky2_2/text_to_image/README.md；默认模型
  # kandinsky-community/kandinsky-2-2-decoder（9.84GB，ModelScope 无镜像）。
  # 不传 --validation_prompts（否则会加载 26.57GB 的 prior）。数据集
  # lambdalabs/naruto-blip-captions 运行时经 hf-mirror 取。2026-09-18 验证可跑。
  - path: examples/kandinsky2_2/text_to_image/train_text_to_image_decoder.py
    profile: diffusers-kandinsky
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --mixed_precision fp16                                  # decoder 9.84GB fp32 + Adam 状态会 OOM，转 fp16
      - --train_batch_size 1
      - --gradient_accumulation_steps 1
      - --gradient_checkpointing
      - --max_train_steps 1
      - --max_grad_norm 1
    timeout_minutes: 90

  # research_projects / scheduled_huber_loss_training：SD1.5 + naruto（text_to_image）
  # 与 SD1.5 + fixtures/DOG.jpg（dreambooth）。2026-09-18 验证可跑。
  - path: examples/research_projects/scheduled_huber_loss_training/text_to_image/train_text_to_image.py
    profile: diffusers-research
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256 --center_crop --random_flip
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 90

  - path: examples/research_projects/scheduled_huber_loss_training/text_to_image/train_text_to_image_lora.py
    profile: diffusers-research
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256 --center_crop --random_flip
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 90

  - path: examples/research_projects/scheduled_huber_loss_training/dreambooth/train_dreambooth.py
    profile: diffusers-research
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --instance_data_dir ${FIXTURE_DIR}
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 90

  - path: examples/research_projects/scheduled_huber_loss_training/dreambooth/train_dreambooth_lora.py
    profile: diffusers-research
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_MODEL_PATH}   # ModelScope: AI-ModelScope/stable-diffusion-v1-5
      - --instance_data_dir ${FIXTURE_DIR}
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 90

  # ===== research_projects 第二批（2026-09-20 验证可跑）=====

  # 一致性训练（cifar10，从零）。小步数必须配 --constant_discretization_steps。
  - path: examples/research_projects/consistency_training/train_cm_ct_unconditional.py
    profile: diffusers-research-plain
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
