  # # Wild-Heart/Disney-VideoGeneration-Dataset（69 个 6s 视频，~25 MB，本身就是
  # # README 的 prompt.txt + videos.txt + videos/ 格式），无 ModelScope 镜像，
  # # setup 走 hf-mirror 下载（视频是 Xet-backed，若 cas-bridge 不可达需改cache-seed）。
  # # --report_to 默认 None，无 wandb 问题。脚本末尾会加载完整
  # # pipeline 做 final inference（不传 --validation_prompt 时只加载、不生成）。
  # # 2026-09-17 昇腾机手动验证跑完（rc=0）；2026-09-18 CI 用默认 480x720/49 帧
  # # NPU OOM，故加 --height/--width 256 + --max_num_frames 9 + --gradient_checkpointing
  # # + --enable_slicing/--enable_tiling 压内存。
  # - path: examples/cogvideo/train_cogvideox_lora.py
  #   profile: diffusers-cogvideo
