  # # 混精度权重会在 SDPA 处 dtype 冲突（query=half / key=value=float），
  # # 统一 fp32 根治；显存 = 冻结 unet fp32 复制 ~10.4GB + controlnet 分片
  # # + 优化器 offload，双卡每卡 ~18GB。
