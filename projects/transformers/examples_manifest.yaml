  #     - --model_name_or_path ${TINYWHISPER_PATH}
  #     - --dataset_name ${CI_OUTPUT_DIR}/asr_data
  #     - --audio_column_name audio
  #     - --text_column_name text
  #     - --max_duration_in_seconds 2
  #     - --max_train_samples 2
  #     - --max_eval_samples 1
  #     - --do_train
