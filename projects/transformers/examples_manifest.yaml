  - path: examples/pytorch/image-pretraining/run_mae.py
    profile: vision
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${TINYMAE_PATH}
      # The script reads the image column inside a set_transform callback, but
      # Trainer's default remove_unused_columns=True strips the "image" column
      # (not part of ViTMAEModel.forward) before the batch is fetched.
      - --remove_unused_columns False
      - --dataset_name imagefolder
      - --train_dir ${CI_OUTPUT_DIR}/imgcls/train/**
      - --validation_dir ${CI_OUTPUT_DIR}/imgcls/val/**
      - --train_val_split 0
      - --max_train_samples 3
      - --do_train
      - --max_steps 1
      - --per_device_train_batch_size 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/image-pretraining/run_mim.py
    profile: vision
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # transformers main removed ViTMAE from the AutoModelForMaskedImageModeling
      # mapping, so the MIM examples can no longer load ViTMAE checkpoints. Use
      # the tiny ViT model instead (ViTConfig is still in the mapping); the
      # scripts take mask_ratio from the CLI and encoder_stride below.
      - --model_name_or_path ${TINYVIT_PATH}
      # run_mim*.py still falls back to config.encoder_stride when the flag is
      # unset, and ViTConfig has no such field either — pass it explicitly.
      # ViTForMaskedImageModeling.forward additionally requires
      # encoder_stride == patch_size (2 for the tiny ViT) whenever
      # bool_masked_pos is provided.
      - --encoder_stride 2
      # Same Trainer/set_transform interplay as run_mae.py above.
      - --remove_unused_columns False
      # tiny ViT image_size is 30; the default mask_patch_size (32) fails the
      # MaskGenerator "input size % mask patch size" divisibility check.
      - --mask_patch_size 30
      - --dataset_name imagefolder
      - --train_dir ${CI_OUTPUT_DIR}/imgcls/train/**
      - --validation_dir ${CI_OUTPUT_DIR}/imgcls/val/**
      - --train_val_split 0
      - --max_train_samples 3
      - --do_train
      - --max_steps 1
      - --per_device_train_batch_size 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  # 批次 3：语音识别。asr_data 为 audiofolder + metadata.csv 布局（audio/text
  # 两列）；CTC 两条共用 tiny-random-Wav2Vec2，seq2seq 用 tiny-random-Whisper
  # （hf-mirror 通道下载）。
  - path: examples/pytorch/speech-recognition/run_speech_recognition_ctc.py
    profile: speech
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${TINYWAV2VEC2_PATH}
      - --dataset_name ${CI_OUTPUT_DIR}/asr_data
      - --audio_column_name audio
      - --text_column_name text
      # asr_data train/validation hold 2/1 wav files; larger values make
      # .select(range(n)) raise IndexError.
      - --max_train_samples 2
      - --max_eval_samples 1
      # Script default eval_split_name is "test"; our fixture splits are
      # train/validation.
      - --eval_split_name validation
      # Upstream create_vocabulary_from_data builds the vocab with
      # functools.reduce over the split Datasets; with a single split
      # reduce returns the Dataset itself and sorted(dataset) iterates row
      # dicts -> "unhashable type: 'dict'". do_eval loads the second split
      # and sidesteps the bug.
      - --do_eval
      - --do_train
      - --max_steps 1
      - --per_device_train_batch_size 1
      # The scripts resume from the model dir (see the trainer_state.json
      # note in setup_example.sh); transformers main's checkpoint save then
      # requires stateful_callbacks entries our planted state lacks
      # (KeyError: TrainerControl). Disable checkpoint saving; the scripts'
      # final trainer.save_model() does not go through that path.
      - --save_strategy no
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/speech-recognition/run_speech_recognition_ctc_adapter.py
    profile: speech
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${TINYWAV2VEC2_PATH}
      - --dataset_name ${CI_OUTPUT_DIR}/asr_data
      - --audio_column_name audio
      - --text_column_name text
      # Adds adapter attention layers and freezes everything else, so the
      # smoke run trains only the freshly initialized adapter weights.
      - --adapter_attn_dim 8
      # Required arg (argparse exits 2 without it); labels the language
      # adapter token + saved adapter file. "en" is not in the generated
      # CTC vocab (single chars a/b), so no --overwrite_lang_vocab needed.
      - --target_language en
      - --max_train_samples 2
      - --max_eval_samples 1
      # Script default eval_split_name is "test"; our fixture splits are
      # train/validation.
      - --eval_split_name validation
      # Same single-split reduce bug as run_speech_recognition_ctc.py.
      - --do_eval
      - --do_train
      - --max_steps 1
      - --per_device_train_batch_size 1
      # Same checkpoint-save KeyError as run_speech_recognition_ctc.py.
      - --save_strategy no
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  # run_speech_recognition_seq2seq.py：上游 breakage——脚本 L404 无条件调用
  #   model.freeze_feature_encoder()，而 transformers main 的 Whisper 建模类已不提供
  #   该方法（wav2vec2/hubert 家族仍有），AttributeError。等上游修复后按下方注释恢复
  # - path: examples/pytorch/speech-recognition/run_speech_recognition_seq2seq.py
