  - training/pipeline_parallelism/train.py  # NCCL+CUDA 硬绑定（需 patch，次轮候选）：--backend 默认 nccl（第58-61行，NPU 用 HCCL 不支持 nccl）、torch.cuda.set_device(args.local_rank)（第154行）；CIFAR10+AlexNet 本身单卡可跑，但分布式初始化与 device 设置绑死 CUDA；同 example 的 1 个 .sh 启动器 run.sh 已并入本条
