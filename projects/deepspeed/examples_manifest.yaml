version: 1
# DeepSpeed examples guard manifest (split mode).
# Monitored repo: deepspeedai/DeepSpeed (main repo, publishes releases, drives
# schedule and provides the installed source).
# Examples repo: deepspeedai/DeepSpeedExamples (no releases, always follows its
# default branch master); paths in this manifest are relative to that repo root.
# files-only scan model (docs/examples-guard-engine.md): the reconciliation unit
# is the entry file (.sh/.py).
# scan.exclude declares non-example companions (imported libs, model defs, tests),
# pruned recursively, and kept out of supported/unsupported.
# unsupported means this guard does not run it now, NOT that Ascend cannot run it.
# Each unsupported entry carries an inline one-line reason; .sh launchers that only
# wrap a sibling .py are merged into that .py entry.
scan:
  root: ''
  include_extensions: ['.sh', '.py']
  exclude:
    - applications/DeepSpeed-Chat/dschat
    - applications/DeepSpeed-VisualChat/utils
    - training/bing_bert/pytorch_pretrained_bert
    - training/bing_bert/nvidia
    - training/bing_bert/turing
    - training/BingBertGlue/nvidia
    - training/BingBertGlue/pytorch_pretrained_bert
    - training/BingBertGlue/turing
    - training/BingBertSquad/pytorch_pretrained_bert
    - training/BingBertSquad/turing
    - compression/bert/huggingface_transformer
    - compression/reasoning_aware_compression/rac
    - compression/reasoning_aware_compression/tests
    - training/data_efficiency/vit_finetuning/models
    - training/data_efficiency/vit_finetuning/utils
    - training/HelloDeepSpeed/tests

supported:
  # HelloDeepSpeed: Roberta MLM from scratch (ZeRO-1 + CPU offload + BF16). wikitext patched to Salesforce/wikitext (ModelScope) in setup; script passes through $@.
  - path: training/HelloDeepSpeed/run_ds.sh
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--num_layers 2'
      - '--num_heads 2'
      - '--h_dim 64'
      - '--ff_dim 128'
      - '--batch_size 2'
      - '--num_iterations 10'
      - '--log_every 5'
      - '--dtype bf16'
    timeout_minutes: 60
  # DS-Chat step1 SFT: NPU-aware (get_accelerator); opt-125m via ModelScope (${OPT_125M_PATH} from setup);
  # data is an 8-line local/jsonfile fixture written by setup. path is the step directory so the
  # job name (basename of path) stays unique - all four DS-Chat entrypoints are named main.py.
  - path: applications/DeepSpeed-Chat/training/step1_supervised_finetuning
    exec: applications/DeepSpeed-Chat/training/step1_supervised_finetuning/main.py
    profile: ds_chat_sft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--print_loss'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # DS-Chat step2 reward model: same data source as step1; trains a chosen>rejected preference scorer.
  - path: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning/main.py
    profile: ds_chat_rw
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # DS-Chat step2 DPO: ref model doubles memory; own profile.
  - path: applications/DeepSpeed-Chat/training/step2_dpo_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_dpo_finetuning/main.py
    profile: ds_chat_dpo
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 2'
      - '--per_device_eval_batch_size 2'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--beta 0.1'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 150
  # DS-Chat step3 RLHF: official --enable_test_mode + --test_stop_step 5 CI mode; actor/critic both opt-125m.
  - path: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning
    exec: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning/main.py
    profile: ds_chat_rlhf
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--actor_model_name_or_path ${OPT_125M_PATH}'
      - '--critic_model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--enable_test_mode'
      - '--test_stop_step 5'
      - '--actor_zero_stage 2'
      - '--critic_zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
    timeout_minutes: 180
  # HF text-generation inference: --hf_baseline skips the DS-inference kernel, pure HF pipeline for the basic inference path.
  - path: inference/huggingface/text-generation/inference-test.py
    profile: ds_infer
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model ${OPT_125M_PATH}'
      - '--hf_baseline'
      - '--dtype float32'
      - '--max_new_tokens 8'
    timeout_minutes: 60
  # CIFAR10 image classification (ZeRO stage 0 + BF16): setup pre-stages a
  # verified ModelScope mirror because torchvision's Toronto source is unreachable.
  # Launched via run_ds.sh because main()
  # reads LOCAL_RANK injected by the deepspeed launcher (bare python would crash);
  # the wrapper passes overlay args through with $@. path is the directory so the
  # job name is "cifar" instead of colliding with HelloDeepSpeed's run_ds.sh.
  - path: training/cifar
    exec: training/cifar/run_ds.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 90
  # ZeRO offload_states: random synthetic data, no external dependency.
  - path: training/offload_states/offload_states.py
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden_dim 1024'
      - '--nlayers 2'
    timeout_minutes: 60
  # Two-card expert-parallel CIFAR10. The upstream run_ds_moe.sh fixes the
  # launcher recipe but has no $@ passthrough, so run_example.sh reproduces it
  # and appends these CI-size overrides without editing the example checkout.
  # DeepSpeed 0.19.7 wraps MoE helpers with optional torch.compile, while the
  # current NPU image has no validated Triton-Ascend backend. The project runner
  # disables that optional compiler only for this command and retains eager
  # two-rank HCCL execution with EP=2.
  - path: training/cifar/run_ds_moe.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 120
  # Four-card AutoTP equivalence: reproduce upstream run_gpu.sh at TP=1/3/4,
  # but pass the ModelScope Qwen3 path explicitly and keep only five steps.
  - path: training/autotp_equivalence
    exec: training/autotp_equivalence/train.py
    profile: ds_autotp_equivalence
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${QWEN3_06B_PATH}'
      - '--steps 5'
      - '--seq_len 32'
      - '--micro_batch_size 1'
      - '--log_every 1'
    timeout_minutes: 180

