  # 8 个 distributed recipes 全部在 `_patched_new_process_group_helper`（torch_npu
  # 包里的 distributed_c10d.py:681）抛 `RuntimeError: Distributed package doesn't
  # have NCCL built in`。torch_npu wheel 不带 NCCL（华为 HCCL 替代），NCCL 后端
  # 字符串直接被拒。需要上游把 backend 改成可配置 + 自动探测 device (cuda/npu)
  # 并落到对应后端，本 CI 矩阵不解决这层。
  - recipes/lora_finetune_distributed.py          # runtime-verified: NCCL @ lora_finetune_distributed.py:918 `init_process_group("cuda:nccl,cpu:gloo")`
  - recipes/lora_dpo_distributed.py                # runtime-verified: NCCL @ lora_dpo_distributed.py:848 `init_process_group("cuda:nccl,cpu:gloo")`
  - recipes/full_finetune_distributed.py           # runtime-verified: NCCL @ full_finetune_distributed.py:144 `init_process_group(self.distributed_backend)`；试 distributed_backend=hccl overlay 仍落 NCCL：torch_npu 路径走 default UNDEFINED → nccl 分支
  - recipes/full_dpo_distributed.py                # runtime-verified: NCCL @ full_dpo_distributed.py:1068 `init_process_group("cuda:nccl,cpu:gloo")`
  - recipes/qat_distributed.py                     # runtime-verified: NCCL @ qat_distributed.py:950 `init_process_group("cuda:nccl,cpu:gloo")`
  - recipes/qat_lora_finetune_distributed.py       # runtime-verified: NCCL @ qat_lora_finetune_distributed.py:965 `init_process_group(backend="gloo" if cfg.device == "cpu" else "nccl")`
  - recipes/knowledge_distillation_distributed.py  # runtime-verified: NCCL @ knowledge_distillation_distributed.py:968 `init_process_group("cuda:nccl,cpu:gloo")`

  # ===== runtime-verified: 缺配套依赖，无法启动 =====
  # knowledge_distillation_single_device.py: `find recipes/configs -iname '*knowledge*'`
  # 返回空（upstream 没有任何 KD config 文件），即使补写 teacher=1.5B + student=0.5B
  # config 也需要先造出 teacher checkpoint 才跑得动；本次看护周期不加入 CI 矩阵
  - recipes/knowledge_distillation_single_device.py
  # ppo_full_finetune_single_device.py: recipes/configs 里唯一 PPO 配置是
  # mistral/7B_full_ppo_low_memory.yaml（不是 Qwen2.5）；recipe 自身要求
  # `_value_checkpointer.load_checkpoint()` + `reward_checkpointer.load_checkpoint()`
  # 两个独立外部权重，0.5B Instruct 没有现成 RM/VM checkpoint
  - recipes/ppo_full_finetune_single_device.py
  # eleuther_eval.py:16 `from lm_eval.evaluator import evaluate` → `ModuleNotFoundError:
  # No module named 'lm_eval'`（runner 不预装 lm-eval；即便装上，task dict 默认
  # 走 HF 下载 hellaswag/arc 等，CI 不可控）。2026-09-17 改：setup_example.sh
  # 装 `lm-eval==0.4.5`（recipe `version("lm-eval") < "0.4.5"` 是字符串比较
  # 而不是 packaging.version，0.4.10-0.4.49 全被误拒），manifest 加
  # fixtures/eleuther_tasks/ci_truthfulqa_mc2.yaml + fixtures/ci_truthfulqa_2.json
  # 自定义任务走 include_path，绕开 HF 拉取，recipe 转 supported（见
  # supported: 块对应 entry；2026-09-17 在 coder hdc-stable-npu-2 端到端
  # 跑通 exit 0，acc=1.0 / 0.92s / 1.56GB HBM）
  # - recipes/eleuther_eval.py
