version: 1
scan:
  root: recipes
  include_extensions: ['.py']
  # 三层互斥模型，**exclude 只放"不是 entry point"的东西**：
  #   scan.exclude — 扫描阶段不进入（包初始化、YAML 配置整目录、upstream
  #                  实验区整目录、SLURM 启动器、markdown 文档）
  #   supported    — 实跑过 exit 0 的 recipe
  #   unsupported  — 扫描到了但实跑 fail 的 recipe（必须附实测堆栈）
  # 任何出现在 scan.exclude 的路径都不应再出现在 unsupported 里。
  # files-only 模型（docs/examples-guard-engine.md §2.7）。exclude 项为目录
  # 路径（递归剪枝）或 glob（`**` 跨目录，匹配相对 target root 的路径）。
  # examples 引擎不扫描，本段当前只是声明。
  exclude:
    - recipes/__init__.py                # 包初始化（import 会 ModuleNotFoundError）
    - recipes/configs/                  # YAML 配置整目录，需要 recipe 文件驱动，不可独立 launch
    - recipes/dev/                      # upstream 实验性/早期/论文复现区（README 状态表 GRPO single-device 标 🚧=WIP；generate_v2 是 generate 实验版；early_exit_finetune/layer_dropout 是 LayerSkip/LITE/LayerDrop 论文复现；grpo 走 torchtune.dev.grpo 包而 pyproject 没暴露 torchtune.dev 子包，import 必炸）
    - recipes/quantization.md           # 文档（quantize 配套说明）
    - recipes/full_finetune_multinode.slurm  # SLURM 启动器（需要集群调度）

supported:
  # ===== 已在 coder hdc-stable-npu-3（910B4×2, torch 2.11.0+cpu, torch_npu 2.11.0,
  # CANN 9.1.0）端到端跑通（setup_example.sh 实跑 + recipe exit 0），依赖线 pin
  # 见 setup_example.sh 注释 =====
  # 验证日期：2026-09-18；torchtune checkout=v0.6.1（latest release，engine
  # monitor 自动取）；workflow_dispatch default=main（匹配 peft/torchtitan 模式，
  # main HEAD 现在能跑——见 setup_example.sh 注释里 torch 2.11.0 升级解释）。
  # 关键 pin：setup_torchtune() 动态探测 common_utils.py:19 的 NF4Tensor
  # import line：
  #   v0.6.x  → torchao.dtypes.nf4tensor（pin torchao==0.13.0）
  #   main    → torchao.quantization（pin torchao==0.18.0，需 torch>=2.11；
  #             ensure_torch_stack() 现在装 torch 2.11.0，这条路也通了）

  # LoRA SFT：Qwen2.5-0.5B + 50 行 alpaca，1 step，1 卡 ~12 秒
  - path: recipes/lora_finetune_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml  # 完整相对路径（cwd=target root）；OmegaConf 不补 .yaml 后缀
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json  # upstream 默认 /tmp/Qwen2.5-0.5B-Instruct/vocab.json；改 setup 预下载的 ModelScope snapshot
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt  # BPE 分词器配套 merges 文件
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}  # FullModelHFCheckpointer 从 snapshot 根目录读权重（避免 HF 下载）
      - checkpointer.output_dir=${CI_OUTPUT_DIR}  # 输出到 CI 工作目录（默认 /tmp/torchtune/qwen2_5_0_5B/lora_single_device 在容器内会被清）
      - dataset.source=json  # upstream alpaca_cleaned_dataset 默认 yahma/alpaca-cleaned（HF 不可达）；换成本地 json builder
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json  # 仓内 50 行 alpaca fixture
      - gradient_accumulation_steps=1  # upstream 默认 8：1 step 即可验证
      - max_steps=1  # 压到 CI 规模
      - log_every_n_steps=1  # upstream 默认 1：确保 1 步内也有日志
      - batch_size=1  # upstream 默认 2：压批
      - max_seq_len=512  # upstream 默认 2048：压序列长度
    timeout_minutes: 30

  # 全量 SFT：Qwen2.5-0.5B + 50 行 alpaca，1 step，1 卡
  - path: recipes/full_finetune_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_full_single_device.yaml
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json
      - gradient_accumulation_steps=1
      - max_steps=1
      - log_every_n_steps=1
      - batch_size=1
      - max_seq_len=512
    timeout_minutes: 30

  # LoRA DPO：Qwen2.5-0.5B + 8 行对话式偏好数据，1 step
  - path: recipes/lora_dpo_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml  # 复用 LoRA SFT 配置（DPO 在 cfg 层级覆盖 loss/dataset）
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - loss._component_=torchtune.rlhf.loss.DPOLoss  # upstream LoRA config 无 loss 项；DPO 必填
      - dataset._component_=torchtune.datasets.preference_dataset  # 走偏好数据 builder（默认 alpaca_cleaned_dataset 走 SFT 路径）
      - dataset.source=json  # 本地 json 文件
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_preference_conv_8.jsonl  # 8 行 chosen/rejected 消息列表（与 ChosenRejectedToMessages 对齐）
      - gradient_accumulation_steps=1
      - max_steps=1
      - log_every_n_steps=1
      - batch_size=1
      - max_seq_len=512
    timeout_minutes: 30

  # 推理生成：Qwen2.5-0.5B，单条 prompt（upstream 配置默认是 Llama2 7B）
  - path: recipes/generate.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/generation.yaml  # upstream generation 配置：默认 model=llama2_7b
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b  # 覆盖为 Qwen2.5-0.5B base
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer  # Qwen2.5 BPE tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]  # upstream 默认 2 个 .bin shard（Llama2 风格）；0.5B 单 shard
      - checkpointer.model_type=QWEN2  # upstream 默认 LLAMA2；走 qwen2_hf_to_tune（处理 q/k/v bias）而不是基类 hf_to_tune
      - 'prompt.user="The capital of France is"'  # Dict[Role,str] 格式（generate.py:104 强类型）；内嵌空格会被 shlex.split 拆开，run_example.sh 必须改用 shlex.quote 包值或收紧为单 token；CI 矩阵里此 overlay_arg 在 coder 复现必抛 ValueError "got capital"，由 examples-guard 守护
      - 'prompt.system=null'  # 同上：Dict 键
      - max_new_tokens=20  # upstream 默认 300：压 token 数
    timeout_minutes: 15

  # 量化：Qwen2.5-0.5B，Int8DynActInt4 权重量化（torchao）
  - path: recipes/quantize.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/quantization.yaml  # upstream quantize 配置：默认 Int8DynActInt4WeightQuantizer + Llama2 7B
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b  # 覆盖为 Qwen2.5-0.5B base
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]
      - checkpointer.model_type=QWEN2  # 同 generate：走 qwen2_hf_to_tune
      - checkpointer.output_dir=${CI_OUTPUT_DIR}  # 量化结果落 CI 工作目录
    timeout_minutes: 15

  # 评测：Qwen2.5-0.5B + lm_eval + 自定义 ci_truthfulqa_mc2 任务（本地 JSON 驱动）
  # eleuther_eval recipe 在 __init__ 强检 `version("lm-eval") < "0.4.5"`
  # （**字符串比较**，不是 packaging.version——0.4.10-0.4.49 都被误拒；
  # 详见 setup_example.sh 注释 + 端到端跑通日期 2026-09-17），setup 装
  # `lm-eval==0.4.5`（recipe import 链只用到 lm_eval.tasks /
  # lm_eval.evaluator / lm_eval.models.huggingface / lm_eval.utils 这四块，
  # 0.4.5 已稳定）。任务数据走 fixtures/ci_truthfulqa_2.json（2 行手工写的
  # TruthfulQA mc2 格式），通过 `include_path` 指向 fixtures/eleuther_tasks/，
  # lm_eval 的 TaskManager 把 `ci_truthfulqa_mc2` 注册为覆盖 built-in
  # truthfulqa_mc2 的本地任务，绕开 HF datasets 拉取 truthfulqa。`acc`
  # 指标而非原版 `mc2`：原版 mc2 是 truthfulqa/utils.py 里的自定义聚合函数，
  # 用 built-in `acc` 避免把 utils.py 也 vendor 进 fixtures。`device=npu`
  # overlay 把 upstream config 的 `device: cuda` 翻成 NPU。
  # 2026-09-18 在 coder hdc-stable-npu-3 跑通：exit 0，acc=1.0 / 0.94s /
  # 1.56GB HBM（5×5 loglikelihood 一次性跑完）。
  # ⚠️ eleuther_eval recipe 内部硬编 `pretrained="gpt2"`（recipes/eleuther_eval.py:311
  #   `super().__init__(pretrained="gpt2", device=str(device))`），会触发
  #   `transformers.AutoConfig.from_pretrained("gpt2")`。coder pod 无法访问
  #   huggingface.co（curl hang），需要在 runner 环境里设置
  #   `HF_ENDPOINT=https://hf-mirror.com` 让 transformers 走中国镜像；CI 集群
  #   直连 HF 时不设也无害。fixture YAML 需要 `data_files`
  # 写相对 cwd 的路径（datasets 4.x resolve_pattern 用 base_path="")，并且
  # multiple_choice 类型要求 `doc_to_choice` 显式提供，不能只给 doc_to_text /
  # doc_to_target。
  - path: recipes/eleuther_eval.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/evaluation.yaml
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]
      - checkpointer.model_type=QWEN2
      - device=npu
      - tasks=[ci_truthfulqa_mc2]
      - include_path=${TARGET_ROOT}/fixtures/eleuther_tasks
      - limit=2  # fixture 只有 2 行
      - batch_size=1  # 0.5B + 多项选择 5 个候选，loglikelihood 一次跑就行
      - max_seq_length=512  # upstream 默认 4096：2 行短问答压短
    timeout_minutes: 15

# ===== unsupported（每条附 runtime-verified 标签 + 实测失败堆栈） =====
# 2026-09-15 在 coder hdc-stable-npu-4（910B4×2, torch 2.12.0+cpu, torch_npu 2.12.0,
# CANN 9.x）逐例跑：recipes/dev/* 4 个文件（multi_dataset/early_exit/generate_v2_dist/grpo）
# 已经在 scan.exclude 里随 recipes/dev/ 整目录排除，本段不再列入。
# 剩下 10 个文件全是 recipes/ 顶层的分布式或多卡路径，torch_npu 没 NCCL 必崩；
# 3 个 single-device 缺配套依赖，无法启动。
unsupported:
