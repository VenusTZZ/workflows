version: 1
scan:
  root: torchtitan
  include_extensions: ['.py', '.sh']
  # torchtitan 的 "example" 不是目录 + 脚本的形态，而是单个 train.py
  # 入口 + `--module X --config Y` CLI 参数选模型配置。所以
  # scan.root 设为仓库根 `torchtitan`，include_extensions 留宽；
  # exclude 把所有非 example 形态的子树都剪掉（configs / docs /
  # tests assets / proto / requirements），剩下的 .py 文件是
  # "可能被作为入口点的脚本"。本清单 supported/unsupported 都按
  # 「(path, overlay_args)」组合语义记录，不依赖 scan 的扫描结果。
  exclude:
    - torchtitan/config                              # 训练 job YAML 配置目录
    - torchtitan/tools                               # proto / ckpt convert 工具
    - torchtitan/docs                                # 文档源
    - torchtitan/protocols                           # 结构化日志协议定义
    - torchtitan/tests                               # 自测 + tests/assets tokenizer
    - torchtitan/experiments/rl/rollout              # vLLM rollout (CUDA-only)
    - torchtitan/experiments/rl/renderer.py          # vLLM renderer (CUDA-only)
    - torchtitan/experiments/rl/rollout_recorder.py  # vLLM recorder (CUDA-only)
    - torchtitan/experiments/rl/components           # vLLM comm hooks (CUDA-only)
    - torchtitan/experiments/rl/actors              # vLLM actors (CUDA-only)
    - torchtitan/experiments/rl/environment         # env wrappers (gym / cuda)
    - torchtitan/experiments/rl/losses               # grpo / dapo losses
    - torchtitan/experiments/rl/models               # rl-specific model heads
    - torchtitan/experiments/rl/observability        # rl-specific logging
    - torchtitan/experiments/rl/routing              # rl router (cuda)
    - torchtitan/experiments/rl/rubrics              # rl rubric scoring
    - torchtitan/experiments/rl/scripts              # rl shell launchers
    - torchtitan/experiments/rl/tests               # rl tests
    - torchtitan/experiments/rl/types.py            # rl types
    - torchtitan/experiments/rl/controller.py       # rl controller
    - torchtitan/experiments/rl/controller_metrics.py  # rl controller metrics
    - torchtitan/experiments/rl/batch_invariance.py  # rl batch invariance test
    # GraphTrainer 内部的非 example 入口（被 precompile_main.py / run_train_precompile.sh import，
    # 但自身不能独立 dispatch）：
    - torchtitan/experiments/graph_trainer/precompile.py
    # GraphTrainer 内部的非 example 入口（被 precompile_main.py / run_train_precompile.sh import，
    # 但自身不能独立 dispatch）：
    - torchtitan/experiments/graph_trainer/precompile.py
    - '**/__init__.py'
    - '**/README.md'
    - '**/test_*'        # 文件名以 test_ 开头（fnmatch 语义，只匹配 basename）
    - '**/tests/**'      # 兜底：tests/ 子目录里的非 test_*.py 文件（run_tests.sh、
                        # integration_tests.py、_trainer_test_utils.py 等）
    - '**/*config*.yaml'
    - '**/*config*.json'
    - '**/requirements*.txt'

supported:
  # 3 条支持 example（#2 #3 #4），全部走 setup 写入的 .sh launcher（exec 字段）。
  # path 字段统一填 `torchtitan/train.py`（上游真实文件，manifest-check
  # 用它做 (target_root/path).exists() 校验）；exec 是真正的可执行
  # launcher（setup 写入 target/scripts/），它内部 exec torchrun
  # -m torchtitan.train "$@" —— overlay_args 透传给 torchtitan.train。
  #
  # 2026-09-17 no-patch policy 之后：这 3 条 entry 留在 supported
  # 但 CI 预期失败——torchtitan v0.3.0 release 自称 device-agnostic /
  # 支持 torch_npu，「能支持」成立；失败根因是上游 torch_npu / triton-
  # ascend / CANN 栈各自的 bug，按 policy 不在 setup 层绕开，留作
  # upstream signal。预期失败点见 docs/case-torchtitan-v0.3.0-torch2.12-
  # npu.md §六「2026-09-17 no-patch 复盘」末尾表。当上游对应 issue 修
  # 掉后 CI 自动转绿，不需要再 review / 撤 patch。
  #
  # v0.3.0 上游 (release tag) 在本栈的兼容性状态：
  # - 单卡 1-card debugmodel_ce_loss / sft_debugmodel：Quick-start 验证过；
  #   CI 第 34087315070 号 run green 跑过 1-card + 2-card。
  # - 多卡 2-card debugmodel：Quick-start 验证过。
  # debugmodel: dim=256 / 6 层 / 16 head / vocab 2048 (~6 M 参数)，
  # 30 GB HBM 完全够装，FSDP shard=2 切分后单卡仅 ~24 GB 占用。
  # 模型/数据全在仓库内（debugmodel 用 torchtitan/tests/assets/
  # tokenizer + random data），不依赖外网。
  #
  # 2026-09-15 端到端实跑证据（hdc-stable-npu-4 实测，CANN 9.1.0 +
  # torch 2.12.0+cpu + torch_npu 2.12.0 + triton-ascend 3.5.0+dev20260701
  # + torchtitan v0.3.0 checkout + 7 个 sed 补丁，已于 2026-09-17 撤掉）：
  # - llama3_debugmodel_ce_loss 1-card: 2 步完成，loss 8.23→7.97
  # - sft_debugmodel 1-card: 2 步完成，loss 8.08→7.67，ChatDataLoader 正常
  # - llama3_debugmodel 2-card (full_dtensor + dp_shard=2 + bf16): 2 步完成，
  #   global batch size=2 生效，loss 16.06→15.48（reduce-by-dp_shard）。
  # 实测命令记录在 /tmp/torchtitan-verify/ 与 setup_example.sh 内嵌注释里。

  # 2) 单卡 + CE loss 配置变体：llama3_debugmodel_ce_loss 是上游
  # registry 内置的 CE 损失等价配置（CrossEntropyLoss 直接接线，不走
  # ChunkedLossWrapper）。保留它作为独立 supported 是为了在每次
  # upgrade 时验证上游 CE 配置的 wiring 与 ChunkedLossWrapper 入口
  # 同步未漂移。
  # no-patch policy：ChunkedLossWrapper 在 NPU 触发 meta 张量泄漏
  # （case doc §2.5），但配置默认走 ChunkedLossWrapper 是上游决策，
  # 不在 setup 层 patch。ce_loss 变体绕开这条路径；预期仍会卡在
  # c10d broadcast 同 #1。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_ce_loss_1card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel_ce_loss
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_ce_loss_1card
    timeout_minutes: 20

  # 3) 双卡：FSDP shard=2 + full_dtensor 后端 + bf16。
  # --parallelism.spmd-backend full_dtensor 是 CLI 切换（不是 sed
  # patch）：默认 spmd_types 后端需 torch >=2.13 的 FSDP dp_mesh_dims
  # 翻译，2.12 上 multi-card 必触发 ValueError（Quick-start §限制四）。
  # --training.dtype bfloat16 是混合精度 smoke；不强校验数值，仅
  # 验证 DTensor forward + HCCL all-reduce + bf16 cast 整条链路不
  # 触发 NPU 算子缺口。
  # no-patch policy：预期在 init_weights 同 #1 撞 c10d broadcast；
  # 修好后可能进一步撞 torch 2.13-only FSDP dp_mesh_dims 路径——
  # 这是上游 torch 的 issue，不在 setup 层 patch。
  # ASCEND_RT_VISIBLE_DEVICES 由 runner 注入（双卡 runner 暴露 0,1）。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_2card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel
      - --comm.mode default
      - --parallelism.spmd-backend full_dtensor
      - --training.dtype bfloat16
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_2card
    timeout_minutes: 25

  # 4) SFT example 1-card：--module llama3 --config sft_debugmodel。
  # sft_debugmodel 是 torchtitan/models/llama3/config_registry.py:349
  # 注册的 SFT 配置（不是独立 module），训练走 torchtitan/train.py
  # 同一入口。smoke 验证 SFT 数据通路（ChatDataLoader /
  # CrossEntropyLoss / Trainer）。
  # no-patch policy：sft_debugmodel 写死 attn_backend="flex"，走到
  # torch_npu._inductor 时 import `triton_key` 失败（community triton
  # 3.5.0 不暴露）；同时 _create_flex_attention_mask 用 torch 2.13-only
  # 的 separate_full_blocks kwarg。两条都是上游决策，不在 setup 层
  # 绕开。预期失败点：c10d broadcast（同 #1）→ 修了之后撞 triton_key
  # import / separate_full_blocks TypeError。退役条件：上游让 sft
  # 默认走 sdpa 或暴露 triton_key，或 torch 2.13 ABI 适配。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_sft_debugmodel_1card.sh
    overlay_args:
      - --module llama3
      - --config sft_debugmodel
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/sft_debugmodel_1card
    timeout_minutes: 20

unsupported:
  # ===== 配置精简（no-patch policy 下与另一 supported entry 冗余） =====
  # 2026-09-17 决定：
  #   - llama3_debugmodel (default)
  #     rc=1（no-patch policy 下预期）；跟 #2 llama3_debugmodel_ce_loss
  #     共用同一 launcher（run_llama3_debugmodel_1card.sh vs
  #     run_llama3_debugmodel_ce_loss_1card.sh，body 完全相同，
  #     2026-09-17 撤 patch 后仅 --config flag 区别：
  #     "llama3_debugmodel" → "llama3_debugmodel_ce_loss"）。
  #     no-patch policy 下 default config 走 ChunkedLossWrapper，在
  #     NPU 上是 case doc §2.5 已知的 meta tensor leak，不在 setup 层
  #     patch；同时 ce_loss 变体走 CrossEntropyLoss 直连路径，验证
  #     面更全。两条同时留 supported = 同 launcher 双跑，CI 成本翻倍
  #     信号零增量，所以只留 ce_loss 变体。
  #     退役条件：不退役。如果未来 ChunkedLossWrapper 在 NPU 上被上游
  #     修好，可以单独加回这条作为对照（default vs ce_loss wiring
  #     漂移检测），但目前没必要保留两条同 launcher 的 supported。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel

  # ===== 规模：8B / 70B / 405B 在本栈 OOM / 拒绝启动 =====
  # 2026-09-15 实测证据（单卡 ASCEND_RT_VISIBLE_DEVICES=0，
  # 32 GB × 1 卡，当时 7 个 sed patch 已应用；2026-09-17 撤 patch，
  # 重新走会先在 init_weights 撞 c10d broadcast，再撞下面列的根因）：
  #   - llama3_8b            rc=1
  #       torch.OutOfMemoryError: NPU out of memory. Tried to allocate
  #       1.96 GiB (NPU 0; 29.49 GiB total capacity; 27.96 GiB already
  #       allocated)  — FSDP init 把 8B 参数 + AdamW state 全部加载到
  #       单卡 HBM，超出 29.49 GiB 物理上限。
  #   - llama3_70b           rc=1
  #       AssertionError at torchtitan/distributed/parallel_dims.py:184
  #       `assert dp_shard >= 1` — 70B 的 parallelism 配置要求
  #       TP/PP 多维切分，world_size=1 直接拒绝启动。
  #   - llama3_405b          rc=1
  #       Float8Linear swap 失败（405B 配置内嵌 float8 layer），叠加
  #       float8 only-on-NVIDIA 限制 — rc 与 float8 一致；即使切回
  #       bf16 也直接 OOM（405B bf16 单卡 ~810 GB）。
  #   - llama3_8b_first_85_pct_layers_nvfp4 / llama3_8b_mxfp8
  #       rc=1 — ImportError: torchao NVFP4/MXFP8 prototype 缺失
  #       （NPU 端 torchao 未 ship 这两个 prototype 模块）。
  # 退役条件：双卡 64 GB / 4 卡 128 GB / CPU offload DTensor dispatch
  # 修复任一达成；或 torchao 发布 NPU NVFP4/MXFP8 prototype wheel。
  - torchtitan/models/llama3/config_registry.py:llama3_8b
  - torchtitan/models/llama3/config_registry.py:llama3_8b_first_85_pct_layers_nvfp4
  - torchtitan/models/llama3/config_registry.py:llama3_8b_mxfp8
  - torchtitan/models/llama3/config_registry.py:llama3_70b
  - torchtitan/models/llama3/config_registry.py:llama3_405b

  # ===== 量化：float8 / NVFP4 在 NPU / torchao 不可用 =====
  # 实测证据（2026-09-15）：
  #   - llama3_debugmodel_float8 / _float8_emulate_lora / _nvfp4 /
  #     _first_85_pct_layers_nvfp4
  #       rc=1；具体错误：
  #       * float8: ValueError: Failed to swap to Float8Linear because
  #         float8 is only supported on NVIDIA SM89 or later, or AMD
  #         gfx942 (MI300) or later. To enable testing on older
  #         hardware, set `float8.emulate` to True in eager mode.
  #         （torchao.float8 走 CUDA-only 算子，NPU 无 backend）
  #       * nvfp4: ImportError: torchao is not installed or does not
  #         provide the NVFP4 training prototype. Install a torchao
  #         build with torchao.prototype.moe_training.nvfp4_training.
  #         （torchao.prototype.moe_training.nvfp4_training 在本栈
  #         torchao 0.15.0 里没 ship，NPU 端也没有替代路径）
  #   - 同样逻辑适用 llama3_debugmodel_first_85_pct_layers_nvfp4
  # 退役条件：torch_npu 发布 torchao.prototype.{mxfp8,nvfp4,float8}
  # 任一 NPU 适配。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_float8
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_float8_emulate_lora
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_nvfp4
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_first_85_pct_layers_nvfp4

  # ===== Variants 受限于上游 torch 2.13+ 依赖 =====
  # 实测证据（2026-09-15）：
  #   - llama3_debugmodel_dist_gemm
  #       rc=0（**单卡通过**：TP=1 时 tp_gemm_backend=dist_gemm 是
  #       no-op，trainer.log 打 "tp_gemm_backend='dist_gemm' selected
  #       but tensor parallelism is not active; running the stock
  #       projections. Nothing is fused."）。
  #       仍留 unsupported：TP≥2 的 dist_gemm 真路径走
  #       torch.distributed._symmetric_memory（torch 2.13+ API）做
  #       cross-process param shard；torch 2.12 无此模块。验证 TP≥2
  #       需要 2-card runner 切到 TP=2 + dist_gemm，与 2-card debugmodel
  #       smoke 不重叠。
  #   - llama3_debugmodel_varlen_attn
  #       rc=1（exitcode 1 但 root cause 在 trainer init 阶段被裁切，
  #       rc=2 间接信号）—— 需要 varlen 包路径 + 模型端
  #       inner_attention=VarlenAttention 走通；与上面一样涉及
  #       torch 2.13+ 路径，未做端到端验证。
  #   - llama3_debugmodel_flex
  #       rc=1；ValueError: Config function 'llama3_debugmodel_flex'
  #       not found in torchtitan.models.llama3.config_registry.
  #       （v0.3.0 上游根本没注册这个函数；manifest 该条 stale，
  #       不应再被引擎命中；保留以免上游再加回同名 entry。）
  # 退役条件：torch 2.13 ABI 适配 / 上游不复活 flex debug entry。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_dist_gemm
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_varlen_attn
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_flex

  # ===== qwen3 族：分三类失败（triton_key / OOM / 文件缺失） =====
  # 实测证据（2026-09-15）：
  #
  # (A) triton_key compile 失败 —— 默认 attn_backend="flex"
  #     （torchtitan/models/qwen3/__init__.py:615）走 torch.compile
  #     → torch_npu._inductor.codegen.common:24
  #     `from triton.compiler.compiler import triton_key`，但
  #     community triton 3.5.0 wheel 没暴露这个 API。
  #     影响条目：qwen3_debugmodel, qwen3_debugmodel_moe_param_groups,
  #     qwen3_debugmodel_non_fused_qkv, qwen3_moe_debug
  #
  # (B) Float backend of FlexAttention 仅 Hopper/Blackwell
  #     （config_utils.py 里写死的硬编码 ValueError）——
  #     qwen3_debugmodel_flex_flash
  #
  # (C) 模型本身超 32 GB HBM：
  #     - qwen3_14b  rc=1 OOM 142 MiB / 28.74 GiB 已分配
  #     - qwen3_30b_a3b rc=1 OOM 770 MiB / 28.28 GiB 已分配
  #     - qwen3_32b    rc=1 OOM 502 MiB / 28.68 GiB 已分配
  #     - sft_qwen3_8b_math rc=1 OOM 2.32 GiB / 28.20 GiB 已分配
  #       （与 llama3_8b 同款 CPU offload 活锁 + 单卡 OOM 困境）
  #
  # (D) 依赖外部资源：
  #     - qwen3_moe_deepep rc=1
  #         ImportError: DeepEP v2 (>= 2.0.0, ElasticBuffer) is required
  #         （DeepEP 不在 NPU 兼容列表，未安装）
  #     - qwen3_0_6b / qwen3_1_7b rc=1
  #         FileNotFoundError: Tokenizer path
  #         './assets/hf/Qwen3-0.6B' does not exist
  #         （非 debug 尺寸要求本地 Qwen3 tokenizer 资产，本栈未下载）
  #
  # (E) 量化条目 NVFP4 ImportError（同 llama3 量化的 B 类）：
  #     - qwen3_debugmodel_nvfp4
  #     - qwen3_debugmodel_first_85_pct_layers_nvfp4
  #     - qwen3_8b_first_85_pct_layers_nvfp4
  #
  # 退役条件：(A) triton-ascend 暴露 triton_key 或 qwen3 patch 1+2
  # 默认 sdpa；(B) NPU 适配 Flash-3；(C) 双卡/四卡 runner 上线；
  # (D) 资产预下载；(E) torchao NVFP4 prototype。
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel_flex_flash
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel_nvfp4
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel_first_85_pct_layers_nvfp4
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel_moe_param_groups
  - torchtitan/models/qwen3/config_registry.py:qwen3_debugmodel_non_fused_qkv
  - torchtitan/models/qwen3/config_registry.py:qwen3_moe_debug
  - torchtitan/models/qwen3/config_registry.py:qwen3_moe_deepep
  - torchtitan/models/qwen3/config_registry.py:qwen3_0_6b
  - torchtitan/models/qwen3/config_registry.py:qwen3_1_7b
  - torchtitan/models/qwen3/config_registry.py:qwen3_8b_first_85_pct_layers_nvfp4
  - torchtitan/models/qwen3/config_registry.py:qwen3_14b
  - torchtitan/models/qwen3/config_registry.py:qwen3_30b_a3b
  - torchtitan/models/qwen3/config_registry.py:qwen3_32b
  - torchtitan/models/qwen3/config_registry.py:sft_qwen3_8b_math

  # ===== qwen3_5 族：模块根本未挂到 train.py 的 config_registry 调度链 =====
  # 实测证据（2026-09-15）：9 个 entry 全部 rc=1，错误一致：
  #   ImportError: Cannot import config_registry for module 'qwen3_5'
  #   from torchtitan.models, torchtitan.experiments, or
  #   torchtitan.experiments.rl.examples
  # 即 torchtitan/models/qwen3_5/ 目录存在（config_registry.py 在）
  # 但没被 torchtitan/train.py 的 MODULES 列表注册；调用
  # `--module qwen3_5` 直接走 dispatcher 拒绝路径。这与 RoPE /
  # RMSNorm / FFN kernel 的 NPU 兼容性无关——manifest 上一版说的
  # "kernel 未验证" 假设不成立：是 dispatcher wiring 缺失。
  # 影响条目（9 个）：
  #   qwen35_debugmodel, _varlen_attn, _moe, _0_8b, _2b, _4b,
  #   _9b, _27b, _35b_a3b
  # 退役条件：上游把 qwen3_5 加入 train.py MODULES，或在
  # torchtitan/models/qwen3_5/__init__.py 暴露 model_registry 入口。
