  - torchtitan/protocols/model_spec.py

  # torchtitan 的模型不是 HF 标准模型（自研 Decoder + SPMD/DTensor 分片布局，vLLM 默认 HF 加载器加载不了），
  # 所以必须经 `register_to_vllm` 注册自定义模型类 `TorchTitanCausalLM` 和自定义 worker `TorchTitanGPUWorker` 来加载权重；
  # 而这条路径的 worker 继承的是 vLLM 的 CUDA 实现（`GPUModelRunner`/`GPUWorker`），依赖 CUDA graph 捕获、
  # `cudaIpcGetMemHandle`、`cudaMalloc` 等驱动级 API—— 昇腾上这些 API 不存在，且 vllm-ascend 插件只替换 vLLM 的默认组件、
  # 不会加载这个继承自 GPUWorker 的子类。因此 controller 配置一旦实例化，vLLM 引擎创建 worker（加载模型第一步）就在昇腾上直接失败
  - torchtitan/experiments/rl/controller.py   

  # 它不调用 vLLM 的通用默认路径，而是注册了自定义模型 `TorchTitanCausalLM` 和
  # 自定义 worker `TorchTitanGPUWorker`（vllm_registry.py:29/36），
  # 后者直接继承 vLLM 的 `GPUModelRunner`/`GPUWorker` 并子类化 `CudagraphDispatcher`（vllm_worker.py:16-19），‘
  # 同时依赖 CUDA graph 捕获、`cudaIpcGetMemHandle`/raw `cudaMalloc` 的自定义 
  # all-reduce 语义和硬编码的 `torch.cuda.empty_cache()`；
  # 这些依赖的不是 PyTorch 算子而是 **CUDA 运行时 API**—— 昇腾上 CUDA stream、CUDA graph、CUDA IPC 
  # 句柄这些驱动级原语根本不存在（对应的是 ACL/HCCL/NPU graph 另一套机制），而 vllm-ascend 插件只替换 vLLM 的默认 worker、
  # 不会加载这个继承自 GPUWorker 的自定义子类。
  - torchtitan/experiments/rl/models

  # 它把生成能力 100% 委托给 vLLM 引擎（`VLLMGeneratorActor` 多重继承 `VLLMGenerator`，
  # 构造直接吃 `VLLMGenerator.Config`，generator.py:22/77），自身没有任何采样实现；
  # 而 vLLM 引擎的生成主路径是 CUDA graph 捕获 + GPU worker + 按 GPU 调度的 batch 管理，
  # 这些在昇腾上要靠 vllm-ascend 插件替换才能跑，但 torchtitan 没有走插件能接管的默认路径 —— 
  # 所以只要 vLLM 引擎在 NPU 上起不来，这个 actor 就失败，rollout 的采样数据来源即断，RL 闭环在这里塌掉。
  - torchtitan/experiments/rl/actors 

  # 不支持原因（因果链）：v0.3.0 语言模型强制 flex attention（sdpa 被
