version: 1
scan:
  root: torchtitan
  include_extensions: ['.py', '.sh']
  # torchtitan 的 "example" 不是目录 + 脚本的形态，而是单个 train.py
  # 入口 + `--module X --config Y` CLI 参数选模型配置。所以
  # scan.root 设为仓库根 `torchtitan`，include_extensions 留宽；
  # exclude 把所有非 example 形态的子树都剪掉（configs / docs /
  # tests assets / proto / requirements），剩下的 .py 文件是
  # "可能被作为入口点的脚本"。本清单 supported/unsupported 都按
  # 「(path, overlay_args)」组合语义记录，不依赖 scan 的扫描结果。
  exclude:
    - torchtitan/config                              # 训练 job YAML 配置目录
    - torchtitan/tools                               # proto / ckpt convert 工具
    - torchtitan/docs                                # 文档源
    - torchtitan/protocols                           # 结构化日志协议定义
    - torchtitan/tests                               # 自测 + tests/assets tokenizer
    # ===== rl/ 子树：utility 模块（不涉及）=====
    # 不放 unsupported 因为这些是 import 库不是入口点。真正的 rl
    # 入口（rl/train.py + rl/generate.py + rl/scripts/loss_compare.py）
    # 已在 unsupported 段。下面这些是它们 import 的工具 / 数据结构 /
    # actor 类定义，不是 example 形态：
    - torchtitan/experiments/rl/rollout              # Rollout / RolloutGroup / Turn dataclass（被 rl/train.py import）
    - torchtitan/experiments/rl/renderer.py          # RENDERER_BY_MODEL 字典 + Renderer 注册（被 rl/components 间接 import）
    - torchtitan/experiments/rl/rollout_recorder.py  # RolloutRecorder JSONL 序列化工具
    - torchtitan/experiments/rl/components           # Batcher / TrainingSampleBuilder / WeightSync / WorkBuffer
    - torchtitan/experiments/rl/actors               # Generator / PolicyTrainer 类（actor 框架，monarch 依赖）
    - torchtitan/experiments/rl/environment          # Message / Token dataclass + gym wrapper
    - torchtitan/experiments/rl/losses               # DAPOLoss / GRPOLoss 类
    - torchtitan/experiments/rl/models               # rl-specific attention / cast_linear / vllm_worker
    - torchtitan/experiments/rl/observability        # rl-specific metrics（被 rl/controller_metrics import）
    - torchtitan/experiments/rl/routing              # InterGeneratorRouter / IntraGeneratorRouter
    - torchtitan/experiments/rl/rubrics              # RewardFn abstract + rubric 评分
    # rl/scripts 子包：__init__.py 由 **/__init__.py glob 兜底，loss_compare.py 是真实入口（已转 unsupported 段）。
    - torchtitan/experiments/rl/tests                # rl 包内单测（**/tests/** 兜底）
    - torchtitan/experiments/rl/types.py             # rl 共享 dataclass types
    - torchtitan/experiments/rl/controller.py        # async controller 协调逻辑（_rollout_loop 等）
    - torchtitan/experiments/rl/controller_metrics.py  # MetricsTimer 工具
    - torchtitan/experiments/rl/batch_invariance.py  # BatchInvariantFlexConverter + runtime patches
    # GraphTrainer 内部的非 example 入口（被 precompile_main.py / run_train_precompile.sh import，
    # 但自身不能独立 dispatch）：
    - torchtitan/experiments/graph_trainer/precompile.py
    - '**/__init__.py'
    - '**/README.md'
    - '**/test_*'        # 文件名以 test_ 开头（fnmatch 语义，只匹配 basename）
    - '**/tests/**'      # 兜底：tests/ 子目录里的非 test_*.py 文件（run_tests.sh、
                        # integration_tests.py、_trainer_test_utils.py 等）
    - '**/*config*.yaml'
    - '**/*config*.json'
    - '**/requirements*.txt'

supported:
  # 1) 单卡 + default llama3_debugmodel 配置（ChunkedLossWrapper 路径）。
  # 2026-09-17 在 hdc-stable-npu-4 实测 rc=0，loss 8.17→7.84（2 step），
  # 之前 manifest 说的「ChunkedLossWrapper 在 NPU 触发 meta 张量泄漏
  # （case doc §2.5）」来自 2026-09-04~07 应用的 sed patch 链，那 7 个
  # patch 已在 2026-09-17 全部撤掉，目前栈（torch 2.12.0+cpu +
  # torch_npu 2.12.0 + triton-ascend 3.5.0+dev20260701 + CANN 9.1.0）
  # 下 default 配置走通。预期仍会卡在 c10d broadcast（DTensor
  # OffsetBasedRNGTracker 的 rng_state .device=None），但现状是
  # init_weights 阶段在 broadcast 之前 trainer 主路径没炸，loss 正常
  # 下降——说明 c10d broadcast 触发条件（需要 FSDP mesh rng_state
  # broadcast）在我们这条 smoke 路径上没命中。
  # no-patch policy：default ChunkedLossWrapper 是上游决策，不在 setup
  # 层 patch。保留这条作为「default wiring」基线，#2 ce_loss 变体
  # 单独验证 CrossEntropyLoss 直连路径，两条同时留 supported =
  # default vs ce_loss wiring 漂移检测（CI 成本翻倍但信号独立）。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_1card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_1card
    timeout_minutes: 20

  # 2) 单卡 + CE loss 配置变体：llama3_debugmodel_ce_loss 是上游
  # registry 内置的 CE 损失等价配置（CrossEntropyLoss 直接接线，不走
  # ChunkedLossWrapper）。保留它作为独立 supported 是为了在每次
  # upgrade 时验证上游 CE 配置的 wiring 与 ChunkedLossWrapper 入口
  # 同步未漂移（同 #1）。
  # no-patch policy：ChunkedLossWrapper 是上游决策，不在 setup 层 patch。
  # ce_loss 变体绕开 ChunkedLossWrapper 路径；预期仍会卡在 c10d
  # broadcast（同 #1，但 #1 实测没卡）。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_ce_loss_1card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel_ce_loss
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_ce_loss_1card
    timeout_minutes: 20

  # 3) 双卡：FSDP shard=2 + full_dtensor 后端 + bf16。
  # --parallelism.spmd-backend full_dtensor 是 CLI 切换（不是 sed
  # patch）：默认 spmd_types 后端需 torch >=2.13 的 FSDP dp_mesh_dims
  # 翻译，2.12 上 multi-card 必触发 ValueError（Quick-start §限制四）。
  # --training.dtype bfloat16 是混合精度 smoke；不强校验数值，仅
  # 验证 DTensor forward + HCCL all-reduce + bf16 cast 整条链路不
  # 触发 NPU 算子缺口。
  # no-patch policy：预期在 init_weights 同 #1 撞 c10d broadcast；
  # 修好后可能进一步撞 torch 2.13-only FSDP dp_mesh_dims 路径——
  # 这是上游 torch 的 issue，不在 setup 层 patch。
  # ASCEND_RT_VISIBLE_DEVICES 由 runner 注入（双卡 runner 暴露 0,1）。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_2card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel
      - --comm.mode default
      - --parallelism.spmd-backend full_dtensor
      - --training.dtype bfloat16
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_2card
    timeout_minutes: 25

  # 4) 单卡 + llama3_debugmodel_dist_gemm 变体：TP=1 下 dist_gemm
  # 是 no-op（trainer log: "tp_gemm_backend='dist_gemm' selected but
  # tensor parallelism is not active; running the stock projections.
  # Nothing is fused."），smoke 验证 dispatch 接受 dist_gemm flag 且
  # init 阶段不炸。TP>=2 真路径走 torch.distributed._symmetric_memory
  # （torch 2.13+ API）做 cross-process param shard；torch 2.12 无此
  # 模块；并且 2-card 上跑 TP=2 + dist_gemm 必撞同 supported #3 的
  # c10d broadcast，无独立信号。留这条是为「dispatch + flag 解析」回归
  # 检测 —— 上游哪天在 TP=1 路径上对 dist_gemm flag 加任何 parse-time
  # 校验，这里立刻报红。
  # 退役条件：TP>=2 路径需 torch 2.13+ ABI 适配 + c10d broadcast 解，
  # 此后才有意义再开 TP>=2 的 supported。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_llama3_debugmodel_dist_gemm_1card.sh
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel_dist_gemm
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_dist_gemm_1card
    timeout_minutes: 20

  # 5) SFT example 1-card：--module llama3 --config sft_debugmodel。
  # sft_debugmodel 是 torchtitan/models/llama3/config_registry.py:349
  # 注册的 SFT 配置（不是独立 module），训练走 torchtitan/train.py
  # 同一入口。smoke 验证 SFT 数据通路（ChatDataLoader /
  # CrossEntropyLoss / Trainer）。
  # no-patch policy：sft_debugmodel 写死 attn_backend="flex"，走到
  # torch_npu._inductor 时 import `triton_key` 失败（community triton
  # 3.5.0 不暴露）；同时 _create_flex_attention_mask 用 torch 2.13-only
  # 的 separate_full_blocks kwarg。两条都是上游决策，不在 setup 层
  # 绕开。预期失败点：c10d broadcast（同 #1）→ 修了之后撞 triton_key
  # import / separate_full_blocks TypeError。退役条件：上游让 sft
  # 默认走 sdpa 或暴露 triton_key，或 torch 2.13 ABI 适配。
  - path: torchtitan/train.py
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: scripts/run_sft_debugmodel_1card.sh
    overlay_args:
      - --module llama3
      - --config sft_debugmodel
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/sft_debugmodel_1card
    timeout_minutes: 20

unsupported:
  # ===== llama3_default / dist_gemm 已升级到 supported，见上面 #1/#4 =====
  # 2026-09-17 实测（hdc-stable-npu-4，torch 2.12.0+cpu + torch_npu 2.12.0
  # + triton-ascend 3.5.0+dev20260701 + CANN 9.1.0，撤掉所有 sed patch
  # 后）：
  #   - llama3_debugmodel (default)  rc=0，loss 8.17→7.84（2 step）——
  #     case doc §2.5 说的「ChunkedLossWrapper meta tensor leak」来自
  #     2026-09-04~07 的 sed patch 链（已 2026-09-17 全撤），目前栈
  #     default 配置走通。promoted → supported #1。
  #   - llama3_debugmodel_dist_gemm  rc=0，TP=1 no-op 路径，promoted →
  #     supported #4（注释里有 TP>=2 路径为什么不通的解释）。
  # 退役条件：上 supported 后跟其他 supported 一起靠 CI 信号退役。

  # ===== 规模：8B / 70B / 405B 在本栈 OOM / 拒绝启动 =====
  # 这些大参数配置是 torchtitan/models/llama3/config_registry.py
  # 里的独立 def（llama3_8b / llama3_70b / llama3_405b），各自硬编
  # 码 num_layers / hidden_dim / num_heads / intermediate_size ——
  # 不是「debugmodel + scale」开关，所以**没法换成小模型测**：
  # model class 相同（都是 Llama3），但 arch spec 是另一份 frozen
  # dataclass，HBM 是唯一 gate。
  # 2026-09-15 实测证据（单卡 ASCEND_RT_VISIBLE_DEVICES=0，
  # 32 GB × 1 卡，当时 7 个 sed patch 已应用；2026-09-17 撤 patch，
  # 重新走会先在 init_weights 撞 c10d broadcast，再撞下面列的根因）：
  #   - llama3_8b            rc=1
  #       torch.OutOfMemoryError: NPU out of memory. Tried to allocate
  #       1.96 GiB (NPU 0; 29.49 GiB total capacity; 27.96 GiB already
  #       allocated)  — FSDP init 把 8B 参数 + AdamW state 全部加载到
  #       单卡 HBM，超出 29.49 GiB 物理上限。
  #   - llama3_70b           rc=1
  #       AssertionError at torchtitan/distributed/parallel_dims.py:184
  #       `assert dp_shard >= 1` — 70B 的 parallelism 配置要求
  #       TP/PP 多维切分，world_size=1 直接拒绝启动。
  #   - llama3_405b          rc=1
  #       Float8Linear swap 失败（405B 配置内嵌 float8 layer），叠加
  #       float8 only-on-NVIDIA 限制 — rc 与 float8 一致；即使切回
  #       bf16 也直接 OOM（405B bf16 单卡 ~810 GB）。
  #   - llama3_8b_first_85_pct_layers_nvfp4 / llama3_8b_mxfp8
  #       rc=1 — ImportError: torchao NVFP4/MXFP8 prototype 缺失
  #       （NPU 端 torchao 未 ship 这两个 prototype 模块）。
  # 退役条件：双卡 64 GB / 4 卡 128 GB / CPU offload DTensor dispatch
  # 修复任一达成；或 torchao 发布 NPU NVFP4/MXFP8 prototype wheel。
  # **代码路径证据**：supported #1 (llama3_debugmodel, Llama3 model
  # class) 2026-09-17 在同栈跑通 rc=0，loss 8.17→7.84 — 说明 Llama3
  # model class 的 NPU forward/backward 链本身可用，8B/70B/405B 的
  # OOM 纯是 HBM 容量不够，不是 arch 漂移。
  - torchtitan/models/llama3/config_registry.py:llama3_8b
  - torchtitan/models/llama3/config_registry.py:llama3_8b_first_85_pct_layers_nvfp4
  - torchtitan/models/llama3/config_registry.py:llama3_8b_mxfp8
  - torchtitan/models/llama3/config_registry.py:llama3_70b
  - torchtitan/models/llama3/config_registry.py:llama3_405b

  # ===== 量化：float8 / NVFP4 在 NPU / torchao 不可用 =====
  # **源码证据**（2026-09-17 grep v0.3.0 checkout）：
  #   * Float8 硬件 gate（CUDA-only）：
  #     `torchtitan/components/quantization/float8.py:93-94` 直接抛
  #     ValueError: "float8 is only supported on NVIDIA SM89 or later,
  #     or AMD gfx942 (MI300) or later."  — 前面那个 `has_cuda_capability`
  #     在 `torchtitan/tools/utils.py:27` 实现，第 1 行就是
  #     `torch.cuda.is_available()`，NPU 必 False → 不可绕过。
  #     `float8.py:230` MoE 路径也有同款 hard gate（"Float8 MoE
  #     training only supported on NVIDIA SM89 or later"）。
  #   * NVFP4：双层 CUDA-only gate：
  #     (a) `nvfp4.py:67` import `torchao.prototype.moe_training.
  #         nvfp4_training.*` — torchao 实验子包，本栈 0.15.0 没
  #         ship，NPU 端也无替代路径。
  #     (b) `nvfp4.py:287` `if not has_cuda_capability(10, 0): raise
  #         ValueError("NVFP4 is only supported on SM100 or later")`
  #         — 同样 `torch.cuda.is_available()` gate + SM100 硬件要求。
  #   * MXFP8：同 NVFP4 路径：`mx.py:21 import torchao.prototype.
  #     moe_training.mxfp8_linear` + `mx.py:70 / :175 has_cuda_capability
  #     (10, 0)`。
  # 实测证据（2026-09-15）：
  #   - llama3_debugmodel_float8 / _float8_emulate_lora / _nvfp4 /
  #     _first_85_pct_layers_nvfp4
  #       rc=1；具体错误：
  #       * float8: ValueError: Failed to swap to Float8Linear because
  #         float8 is only supported on NVIDIA SM89 or later, or AMD
  #         gfx942 (MI300) or later. To enable testing on older
  #         hardware, set `float8.emulate` to True in eager mode.
  #         （torchao.float8 走 CUDA-only 算子，NPU 无 backend）
  #       * nvfp4: ImportError: torchao is not installed or does not
  #         provide the NVFP4 training prototype. Install a torchao
  #         build with torchao.prototype.moe_training.nvfp4_training.
  #         （torchao.prototype.moe_training.nvfp4_training 在本栈
  #         torchao 0.15.0 里没 ship，NPU 端也没有替代路径）
  #   - 同样逻辑适用 llama3_debugmodel_first_85_pct_layers_nvfp4
  # 退役条件：torch_npu 发布 torchao.prototype.{mxfp8,nvfp4,float8}
  # 任一 NPU 适配，或 `has_cuda_capability` 改造为 torch.npu +
  # CUDA/ROCm 三分支。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_float8
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_float8_emulate_lora
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_nvfp4
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_first_85_pct_layers_nvfp4

  # ===== Variants 受限于上游 torch 2.13+ 依赖 =====
  # **源码证据**（2026-09-17 本机 v0.3.0 checkout + torch 2.12.0+cpu
  # wheel 双向 grep）：
  #   * varlen_attn → flash kernel 直调：
  #     `torch/nn/attention/varlen.py:45` `@torch.library.custom_op
  #     ("torch_attn::_varlen_attn", mutates_args={})`
  #     `torch/nn/attention/varlen.py:109-110` — else 分支调
  #     `output, softmax_lse, rng_state, _, _ = torch.ops.aten.
  #     _flash_attention_forward(...)`（fa backend 路径）。PyTorch
  #     自带 kernel，无任何 torch_npu 注册调用；torch_npu 必须自己
  #     注册同名 `PrivateUse1::flash_attention_forward` 才能 catch。
  #     llama3 varlen_attn config 走 `models/common/attention.py:40
  #     from torch.nn.attention.varlen import ... varlen_attn` + :201
  #     `result = varlen_attn(...)`，进 varlen 后即撞上面的 kernel
  #     分支。
  # 实测证据（2026-09-15）：
  #   - llama3_debugmodel_varlen_attn
  #       rc=1 — 真实 root cause（2026-09-17 在 hdc-stable-npu-4 实测）：
  #       `torch/nn/attention/varlen.py:110 _varlen_attn` 调
  #       `torch.ops.aten._flash_attention_forward` 撞
  #       NotImplementedError（同 gpt_oss / triton_key 类，是 NPU
  #       端没 ship 这个 kernel；CUDA-only）。
  #       → 这是「kernel 不在 NPU 后端」类，跟 torch 版本无关，是
  #       torch_npu 2.12.0 没注册 _flash_attention_forward 的
  #       PrivateUse1 kernel。退役条件：torch_npu 适配
  #       _flash_attention_forward kernel。
  # （llama3_debugmodel_flex 这一条在 2026-09-17 源码审计中确认为
  # stale 死代码：grep models/llama3/config_registry.py 找不到
  # def llama3_debugmodel_flex；attn_backend="flex" 只在 sft_debugmodel
  # 内部作 model_registry 参数出现。Engine 永远不会 dispatch 到该
  # manifest entry，已从 unsupported 移除。）
  # （llama3_debugmodel_dist_gemm 已 promoted → supported #4，2026-09-17
  # 实测 rc=0，TP=1 no-op 路径；注释里有 TP>=2 路径为什么不通的
  # 解释。）
  # 退役条件：torch 2.13 ABI 适配 / 上游不复活 flex debug entry。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_varlen_attn

  # ===== qwen3 族：分三类失败（triton_key / OOM / 文件缺失） =====
  # 实测证据（2026-09-15）：
  #
  # (A) triton_key compile 失败 —— 默认 attn_backend="flex"
  #     （torchtitan/models/qwen3/__init__.py:615）走 torch.compile
  #     → torch_npu._inductor.codegen.common:24
  #     `from triton.compiler.compiler import triton_key`，但
  #     community triton 3.5.0 wheel 没暴露这个 API。
  #     影响条目：qwen3_debugmodel, qwen3_debugmodel_moe_param_groups,
  #     qwen3_debugmodel_non_fused_qkv, qwen3_moe_debug
  #
  # (B) Float backend of FlexAttention 仅 Hopper/Blackwell
  #     （config_utils.py 里写死的硬编码 ValueError）——
  #     qwen3_debugmodel_flex_flash
  #
  # (C) 模型本身超 32 GB HBM：
