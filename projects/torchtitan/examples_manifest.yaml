  # NPU 侧由 triton-ascend 转译给 CANN bishengir 编译器，而该编译器编不出
  # 这个 kernel（hivm.hir.store / vector loop tiling 报错在编译器二进制内部）。
  # 两条路都堵死 → NPU 上编译不过、跑不起来。
  - torchtitan/experiments/graph_trainer/deepseek_v3/config_registry.py:graph_trainer_deepseek_v3_debugmodel
  - torchtitan/experiments/graph_trainer/qwen3/config_registry.py:graph_trainer_qwen3_debugmodel
