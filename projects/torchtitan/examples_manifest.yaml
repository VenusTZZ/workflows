version: 1
scan:
  root: torchtitan
  include_extensions: ['.py', '.sh']
  # torchtitan 的 "example" 不是目录 + 脚本的形态，而是单个 train.py
  # 入口 + `--module X --config Y` CLI 参数选模型配置。所以
  # scan.root 设为仓库根 `torchtitan`，include_extensions 留宽；
  # 非 example 形态的子树（configs / docs / tests / proto / requirements）
  # 在本仓 examples 流水线里要么扩展名天然不命中（.yaml / .md），
  # 要么已落入 unsupported 段（test_*.py / tests/** / rl 子树 import 库
  # / graph_trainer precompile 等），本段不再有"声明性 exclude"字段。
  # 本清单 supported/unsupported 都按 「(path, overlay_args)」组合语义
  # 记录，不依赖 scan 的扫描结果。

# No supported examples (2026-09-24): all five llama3 debugmodel variants
# (debugmodel 1-card / 2-card, ce_loss, dist_gemm, sft) moved to unsupported
# because they only run on the NPU stack via runtime monkey-patches
# (sitecustomize shim in run_example.sh) or source sed patches, which
# contradict the no-source-patch policy. Version alignment cannot remove
# them either (need CANN/triton-ascend/torch_npu upstream fixes; see the
# llama3 block under unsupported).
supported: []

unsupported:
  # flux_debugmodel：源 scan 看起来可上，但实证 1 卡 full_dtensor 路径连撞
  # 五道墙，全部不是"NPU 缺算子"，是 v0.3.0 source-level + 离线 pod 缺网络
  # 共同叠加：(1) flux/parallelize.py:70 `assert dp_mesh is not None` —— 1 卡
  # full_dtensor 下 get_activated_mesh(["dp_replicate", "fsdp"]) 返回 None
  # （full_dtensor single_axis_meshes 只有 "dp_shard" 没有 "fsdp"；1 卡
  # dp_replicate=1/fsdp=1 都走 None 分支），CUDA 同卡同死，非 NPU 专属。
  # 需 monkey-patch parallelize_flux 改走 llama3 的 resolve_fsdp_mesh 路径
  # + model.parallelize(parallel_dims) 分发参数 + annotate_dp_cp_params_as_r
  # 仅在 spmd_types 下调（full_dtensor 没 spmd_dense_mesh）；(2) FluxTrainer
  # 仍要从 huggingface.co 拉 google/t5-v1_1-xxl + openai/clip-vit-large-patch14
  # tokenizer（FluxTokenizerContainer.__init__），离线 coder pod 直连 HF 超时，
  # 需 monkey-patch from_pretrained 或 setup 阶段 curl 预下（已有
  # [[xet-bridge-416-hf-mirror-curl-bypass]] 流程但本例未串入）；
  # (3) load_ae 即便 random_init=True 跳 ae.safetensors 加载，T5Tokenizer
  # 仍要 sentencepiece + protobuf，setup_example.sh 已 pip install 这俩；
  # (4) sitecustomize 还要 strip create_block_mask separate_full_blocks kwarg
  # （同 llama3 shim）；(5) 即便过完上面四条，FluxTrainer 的 validation
  # cfg freq=5 steps=48 走 FluxValidator 拉 coco-validation 等本地缺的
  # 资产（config_registry.py:69 设 dataset="cc12m-test" + img_size=256，
  # 但 freq=5 触发 validator 在 step 5 即尝试，没 cc12m 本地素材就 FileNotFound）。
  # 任一 `overlay=CLI` 都绕不开 flux 自身 source bug：flux 的 parallelize_flux
  # 1-card 写死 key "fsdp"、FluxTrainer 写死走 HF network，double-source-patch
  # 性质；按 [[no-source-patch-policy]] 应继续留 unsupported，注释归档实证结论。
  - torchtitan/models/flux/config_registry.py:flux_debugmodel

  # --- llama3 系：flex 墙 + ComplexRoPE 复数墙 + ChunkedLoss 墙（三墙全中）---
  # ComplexRoPE(scaling="llama") 用 torch.polar/view_as_complex 生成 complex64（models/common/rope.py:233,261），
  # NPU aclnnIndex 无 DT_COMPLEX64 实现；默认 loss=ChunkedLossWrapper（components/loss.py:567，
  # backward-inside-forward 在 NPU 触发 meta 张量泄漏）。
  # 以下 5 条（debugmodel 单卡 / debugmodel 双卡 / debugmodel_dist_gemm /
  # sft_debugmodel + ce_loss 变体）在 2026-09-22 靠 run_example.sh 的
  # sitecustomize monkey-patch（SDPA 强制 / CosSinRoPE 替换 / ChunkedLossWrapper
  # bypass / set_timeout 补缺 / create_block_mask 剥离）实证 exit 0，一度移入
  # supported。2026-09-24 决策移回 unsupported：这些 monkey-patch 虽不落盘
  # （run_example.sh:5 禁止 git add/commit/push），但运行时覆盖了上游函数/类，
  # 等价于 patch；且调整依赖版本无法消除——退役分别需要 CANN/triton-ascend
  # 支持编译 inductor flex 模板（限制一）、aclnnIndex 支持 complex64（限制二）、
  # torch_npu 发布配套 torch≥2.13 的版本（限制三/五，同时解除 set_timeout /
  # separate_full_blocks / spmd_types 三处版本错配）。上游修复后再移回 supported。
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_ce_loss
  - torchtitan/models/llama3/config_registry.py:llama3_debugmodel_dist_gemm
  - torchtitan/models/llama3/config_registry.py:sft_debugmodel

