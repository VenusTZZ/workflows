#   2. 不返回 `Trainer.Config`（不是 trainer pipeline 入口）
# 退役条件（理论）：从 tree-walk 扫描器白名单里排除这些路径的目录前缀（`protocols/`、`tools/`、
# `config/`、`experiments/rl/root`），下次就不会再被误抓。本段是留作历史轨迹 + 防再现。

