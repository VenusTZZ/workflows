  # init + 模型 build + parallelize + checkpoint + metrics 全套），但**没有 `__main__` 块**——
  # 形式不满足：要让本仓跑得通，必须另外写一个 `__main__` 包装脚本调
  # `Trainer(build_config())`——等于自己写 example，违反「不写 example」约束。
