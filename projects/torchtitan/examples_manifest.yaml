  # 写死的 CUDA kernel——理论上 device-agnostic。但走 ConfigManager +
  # FluxTrainer.build 这条链路时仍然要加载 FluxModel + FluxTokenizer +
  # AutoEncoder，tokenizer 走 HF 资产（huggingface.co/google/t5-v1_1-xxl
  # / tokenizer_config.json 等），跟 flux_debugmodel 训练同根被墙。
  # 走 ConfigManager FluxTrainer.build 这条路径必撞 HF download；除非
  # HF 资产预下载或镜像，否则 rc=124 (timeout)。
  # 影响条目（inference 路径）：
  #   - flux/inference/infer.py（@torch.no_grad 主函数入口）
  #   - flux/run_infer.sh（NGPU=8 torchrun launcher，依赖 flux_inference_debugmodel 配置）
  # 退役条件：HF 镜像 / 预下载 t5-v1_1-xxl + flux 模型权重，或 flux inference
  # 切换到本地 tokenizer 资产路径。
  - torchtitan/models/flux/inference/infer.py
  - torchtitan/models/flux/run_infer.sh