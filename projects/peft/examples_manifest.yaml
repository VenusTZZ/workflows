version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。exclude 项为目录
  # 路径（递归剪枝）或 glob（`**` 跨目录，匹配相对 target root 的路径），
  # 排除"不是 example 的配套物"：共享 helper 模块、上游自测、运行配置、
  # 入口脚本背后的实现文件。扫描工具的 exclude 支持随发现 workflow 的
  # PR 落地；examples 引擎不扫描，本段当前只是声明。
  exclude:
    - examples/sft/configs           # deepspeed/fsdp 配置，被 run_peft_*.sh 引用
    - examples/sft/train.py          # run_peft.sh 背后的实现，入口是 .sh
    - '**/utils'                    # 各 example 的共享 helper 模块目录
    - '**/__init__.py'
    - '**/utils.py'                 # 单文件版 helper
    - '**/datautils.py'
    - '**/preprocess.py'            # 数据预处理脚本
    - '**/test_*'                   # 上游自测（.py / .sh）
    - '**/*config*.yaml'            # accelerate 等运行配置

supported:
  # ===== 已在 coder npu-3（910B4×2, torch2.9/torch_npu2.9.0.post2, CANN9.1）
  # 逐例验证通过（exit 0），依赖线 pin 见 setup_example.sh 注释 =====

  # CI 首跑已绿（run 34818091939）：TRL SFTTrainer LoRA，1 卡 1 step
  - path: examples/sft/run_peft.sh
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}   # 脚本默认 Mistral-7B：换 setup 预下载的 0.5B（CI 规模 + 避 HF 下载）
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl   # 默认拉 HF hub：换仓内 8 行 fixture
      - --use_4bit_quantization False   # bnb 4bit 无 NPU 后端
      - --use_flash_attn False          # flash-attn 仅 CUDA
      - --gradient_checkpointing False  # 0.5B 无需省显存；关掉避免 NPU reentrant 兼容问题
      - --use_reentrant False           # 同上（checkpointing 已关，双保险）
      - --push_to_hub False             # 默认 True：CI 不推模型仓
      - --packing False                 # 8 行样本无需打包，行为更可预期
      - --max_length 512                # 默认 2048：压序列长度
      - --per_device_train_batch_size 1 # 默认 8：压批
      - --per_device_eval_batch_size 1  # 同上
      - --gradient_accumulation_steps 1 # 默认 8：1 step 即可验证
      - --max_steps 1                   # 默认整 epoch：1 步压到 CI 规模
      - --logging_steps 1               # 默认 5：确保 1 步内也有日志
      - --dataset_num_proc 1            # 避免 datasets 多进程在 CI 容器的不稳定
      - --report_to none                # 关闭 wandb 等外部上报（未装会报错）
      - --output_dir ${CI_OUTPUT_DIR}   # 默认仓内相对路径：输出必须进 CI 输出目录
    timeout_minutes: 90

  # BEFT：mt0-small + financial_phrasebank，原样跑通（两套环境均 exit 0）
  - path: examples/beft_finetuning/beft_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 30

  # MiSS：Qwen2.5-0.5B + imdb 1%（trl 1.12 需 --loss_type nll 绕开 chunked_nll patch）
  - path: examples/miss_finetuning/miss_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}   # HfArgumentParser 必填：注入 setup 预下载的 0.5B
      - --dataset_field text label   # upstream bug：ScriptArguments(SFTConfig) dataclass 默认 None，但 miss_finetuning.py:89 直接 dataset_field[0]/[1] 取下标，CUDA 也一样 TypeError（纯 Python 逻辑与硬件无关）。text=imdb 评论, label=0/1 情感
      - --loss_type nll   # 绕开 trl 1.12+ 默认 chunked_nll：miss_finetuning.py:61 用 device_map="auto" 加载模型，accelerate.add_hook_to_module 把 model.forward 替换成 functools.partial；trl 1.12 sft_trainer.py:383 (1.13 在 386) 的 _patch_chunked_ce_lm_head 走 inspect.signature(original_forward.__func__) 假设 forward 是普通 method，partial 没 __func__ → AttributeError（纯 PyTorch + accelerate，硬件无关，CUDA 同问题）。nll 走标准 cross-entropy 跳过整个 chunked patch。注：sft_trainer.py:1331 isinstance(BaseTunerLayer) guard 在这两例不会触发——target_modules=["q_proj","o_proj","k_proj","v_proj","gate_proj","up_proj","down_proj"] 不含 lm_head，model.get_output_embeddings() 还是普通 Linear，guard 放过后 patch 内部才崩
    timeout_minutes: 30

  # MiCA：同上配方（Qwen2.5-0.5B + imdb 1% + nll）
  - path: examples/mica_finetuning/mica_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}   # HfArgumentParser 必填：注入 0.5B
      - --loss_type nll   # 同 miss：mica_finetuning.py:52 同样 device_map="auto" 触发 accelerate add_hook_to_module；chunked_nll patch 在 functools.partial 上 inspect.signature(__func__) 崩
    timeout_minutes: 30

  # PVeRa：dinov2-base + beans，原样跑通
  - path: examples/pvera/confidence_interval_generation.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 30

  # 序列分类（非 LoRA 方法）：bert-base + GLUE
  - path: examples/sequence_classification/peft_no_lora_accelerate.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${BERT_BASE_UNCASED_PATH}   # argparse 必填：setup 预下，避开 hf-mirror xet
      - --output_dir ${CI_OUTPUT_DIR}   # argparse 断言必填（脚本硬校验）
    timeout_minutes: 45

  # AdaMSS GLUE：roberta-base + mrpc 单 epoch
  - path: examples/adamss_finetuning/glue_adamss_asa_example.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${ROBERTA_BASE_PATH}   # argparse 收：setup 预下，避开 hf-mirror xet
      - --dataset_name mrpc   # 默认 cola；mrpc 数据量小跑得快（docstring 推荐用法）
      - --num_epochs 1   # 默认 100：压到单 epoch（mrpc 3.7k 样本几分钟）
    timeout_minutes: 45

  # AdaMSS manual：手动 API 演示，roberta-base 单 epoch
  - path: examples/adamss_finetuning/glue_adamss_asa_manual_example.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --num_epochs 1   # 默认 100：压到单 epoch
    # argparse schema 不收 --model_name_or_path（model 靠 output_dir 含
    # 'roberta-large' 选 roberta-large，否则硬编码 roberta-base）；roberta-base
    # 走 setup cp plant 进 hub cache，从 HF 走 from_pretrained('roberta-base')
    # 命中本地快照，不打 xet
    timeout_minutes: 45

  # Supertuning：Qwen2.5-0.5B + guanaco 完整 1 epoch（308 步 exit 0）
  - path: examples/supertuning_finetuning/supertuning_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}   # 默认 meta-llama/Llama-3.2-1B（gated + 大）：换 0.5B
      - --data_path ${TARGET_ROOT}/fixtures/ci_supertuning_8.jsonl   # 默认 timdettmers/openassistant-guanaco：该仓文件已转 xet 存储，hf-mirror 的 resolve 对 xet 文件 302 直指 cas-bridge.xethub.hf.co（runner 不可达，HF_HUB_DISABLE_XET 也救不了 plain 路径；ModelScope 无此数据集）。换 8 行真实样本 fixture（{"text": "### Human:...### Assistant:..."} 同上游 schema），run_example.sh 的 load_dataset 垫片会映射 train/test 双 split
      - --batch_size 2   # 默认 1：控时长
    timeout_minutes: 45

  # CorDA：Qwen2.5-0.5B + 走 --corda_mode False + --lora_r 8 退化普通 LoRA（避开
  # preprocess.py SVD 产物 + 默认 MetaMathQA 10 万条），coder npu-3 2026-09-17
  # 实跑 1 epoch 4.35s exit 0，adapter 落 ft/
  - path: examples/corda_finetuning/corda_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}   # 默认 facebook/opt-125m：换 setup 预下载的 0.5B
      - --corda_mode False   # 默认 True：走 preprocess.py SVD 产物，NPU 上没 preprocess 跑不通
      - --lora_r 8   # corda_mode=False 时必传（:212 elif 分支判 lora_r），否则落 full finetuning
      - --data_path ${TARGET_ROOT}/fixtures/ci_corda_8   # load_dataset 须**目录**（含 train.jsonl + test.jsonl），单文件路径报 FileNotFoundError
      - --dataset_field instruction response   # 默认 None：TrainingArguments:69 必填（preprocess 用作 query/response 取字段名）
      - --dataset_split train   # 默认 train[:100000]：fixture 只有 8 行
      - --dataloader_num_proc 1   # 默认 16：CI 容器 datasets 多进程不稳
      - --max_steps 5   # 1 epoch 跑通即可
      - --per_device_train_batch_size 2   # 默认 8 + Qwen2.5-0.5B fp16 ≈ 10GB HBM，batch 2 安全
      - --report_to none   # 默认 wandb：未装会报错
      - --output_dir ${CI_OUTPUT_DIR}   # 默认仓内相对路径：输出必须进 CI 输出目录
    timeout_minutes: 30

  # Glora / GraLoRA 变体：Qwen2.5-0.5B + 10 行 alpaca-style fixture + 小 val_size
  # 1 epoch；coder npu-3 2026-09-17 实跑 4 步 5.68s exit 0 train_loss 3.26，
  # adapter 落盘。无任何源码 patch——用 Trainer 默认 fp16=False，load_dataset
  # + train_test_split（无 max_steps 硬编码），兼容 fixtures/ci_alpaca_10 目录
  - path: examples/glora_finetuning/glora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_10   # 默认 yahma/alpaca-cleaned 52k：换 fixture
      - --num_epochs 1
      - --batch_size 2
      - --val_set_size 2
      - --eval_step 100
      - --save_step 100
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # HiRA（GraLoRA 的 rank-α 变体）：同 glora 配方 + 同 fixture；coder npu-3
  # 2026-09-17 实跑 4 步 4.39s exit 0 train_loss 3.26，0 patch
  - path: examples/hira_finetuning/hira_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_10
      - --num_epochs 1
      - --batch_size 2
      - --val_set_size 2
      - --eval_step 100
      - --save_step 100
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # OLoRA（正交 LoRA）：同 glora 配方 + 同 fixture；coder npu-3 2026-09-17
  # 实跑 4 步 3.33s exit 0 train_loss 3.25，0 patch（quantize 默认关时无 bnb 依赖）
  - path: examples/olora_finetuning/olora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_10
      - --num_epochs 1
      - --batch_size 2
      - --val_set_size 2
      - --eval_step 100
      - --save_step 100
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # WaveFT（FFT 频域初始化 + LoRA）：同 glora 配方 + 同 fixture；coder npu-3
  # 2026-09-17 实跑 4 步 4.22s exit 0 train_loss 3.23，0 patch
  - path: examples/waveft_finetuning/waveft_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_10
      - --num_epochs 1
      - --batch_size 2
      - --val_set_size 2
      - --eval_step 100
      - --save_step 100
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # AdaMSS image：vit-base + cifar10；coder npu-3 2026-09-17 实跑 e2e 通过
  # train 625 steps @1.34 it/s ≈7.5min + best eval exit (eval_acc=0.0 因 _StubAccuracy 总是返回 0);
  # 3 patch：(1) `model = model.to("npu")` 在 AdaMSSConfig 构造之前（AdaMSS layer.py device=weight.device，
  #   不 patch 永远 CPU SVD）；(2) stub evaluate.load("accuracy") 同 [[peft-monteclora-evaluate-load-hangs-offline]]；
  # (3) PYTHONPATH=/home/coder/work/peft-b-venv/stubs 提供 torchvision.transforms stub（pytorch.org/whl/cpu
  #   的 torchvision 0.22-0.29 与 torch 2.9.0+cpu ABI 不匹配，见 [[torchvision-v29-stable-abi]]）。
  # 以上 3 patch 均为 coder 验证机本地补丁，CI 不需要：(1) 脚本不 .to()，get_peft_model
  #   时权重在 CPU 上做 SVD（等价），Trainer 再搬 NPU；(2) evaluate.load 走 hf-mirror
  #   小文件（glue_adamss_asa 同用法已过）；(3) CI 装 aarch64 torchvision 0.24.0 与
  #   torch 2.9.0 ABI 匹配。
  # CI 资产（run 35222723526 302 cas-bridge 超时根因）：脚本 DATASET_CONFIGS["cifar10"]
  #   硬编码 Multimodal-Fatima/CIFAR10_train + CIFAR10_test（不是 uoft-cs/cifar10），
  #   模型默认 google/vit-base-patch16-224-in21k —— ModelScope 均无镜像，走
  #   cache-seed/peft bundle 投递（见 cache-seed/README.md peft 节）。
  # test eval 全量 10000 samples/1250 steps 长跑 ≈15min 是脚本默认行为（无 max_eval_samples 参数）；
  # 训练 + best eval 已经覆盖主要验证面，test eval 默认跑通但不开 overlay flag。
  - path: examples/adamss_finetuning/image_classification_adamss_asa.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --max_train_samples 200   # 默认整 cifar10 train 50k：压到 200 = 25 step 即可验证
      - --num_epochs 1            # 默认 10：压训练
      - --batch_size 8            # 默认 32：910B4 单卡 32GB 够
      - --output_dir ${CI_OUTPUT_DIR}
      # 不传 --cache_dir：coder 机的 /home/coder/.hdc/... 持久缓存路径在 CI 无意义；
      # 数据文件命中 seed 的 hub cache（refs/main sha 对齐），arrow 处理走默认
      # ~/.cache/huggingface/datasets（同 glue 例）。
    timeout_minutes: 30

# ===== unsupported（每条附理由：coder npu-3 2026-09-14 逐例验证 / 静态分析；
# 2026-09-17 对照上游 main db7d68a 源码逐条审计 + 实测复跑取证；
# 2026-09-18 复审（peft HEAD = a5526d2 复测后）：
#   - 删 9 条 utility 误收录（convert_*/eval/load-only/HTTP client/synth 等
#     非 training example——audit 工具按 .py/.sh 文件名扫描，不区分
#     utility 与 example，误将 9 条非训练脚本纳入 unsupported，现移除）
#   - 2 条 upstream 已删（kasa_finetuning/、shadow_finetuning/），归类归到
#     末尾「archived」说明
#   - 修 3 条过期注释（idx 8/10/25，详见条目）
# 行号以 db7d68a 为准；"待复跑取证" = 实测挂但源码找不到对应阻塞点，
# "翻案候选" = 无后端硬编码，换模型/换数据/多卡 runner 即可能转 supported，
# "翻案前置 patch" = NPU 实测可通，但需要源码侧 patch 才能进 supported
#  （如硬编码 fp16=True、pin_memory=True、network 依赖）；
# 已迁移：corda / glora / hira / olora / waveft / adamss_image /
# sft_(fsdp/multigpu/qlora_fsdp) / pissa / deft / delora / randlora /
# dora_caching / (lora/oft/deft/hra/stable_diffusion)_dreambooth → supported，
# 详见 entry 备注） =====
  # SFT + FSDP1：t5-base + FSDP + 2 卡 NPU exit 0（loss 4.12, 11.5s）；
  # overlay 关 bnb 4bit + flash-attn + gradient_checkpointing；
  # FSDP config num_processes 写死 8，overlay 加 --num_processes 2 即可
  - path: examples/sft/run_peft_fsdp.sh
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --config_file configs/fsdp_config.yaml
      - --num_processes 2
      - --num_machines 1
      - --use_4bit_quantization False
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # SFT + torchrun DDP：bloomz-7b1（默认）+ 2 卡 NPU exit 0（loss 4.11, 3.5s）
  - path: examples/sft/run_peft_multigpu.sh
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --nproc_per_node 2
      - --nnodes 1
      - --use_4bit_quantization False
      - --use_nested_quant False
      - --use_flash_attn False
      - --push_to_hub False
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # SFT + QLoRA-FSDP：t5-base + FSDP1 + 2 卡 NPU exit 0（loss 4.12, 13.1s）；
  # bnb 4bit 在 NPU 上无 kernel，overlay 关掉退化为 LoRA+FSDP
  - path: examples/sft/run_peft_qlora_fsdp.sh
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --config_file configs/fsdp_config_qlora.yaml
      - --num_processes 2
      - --num_machines 1
      - --use_4bit_quantization False
      - --use_nested_quant False
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant True
      - --bnb_4bit_compute_dtype bfloat16
      - --bnb_4bit_quant_storage_dtype bfloat16
      - --push_to_hub False
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # PiSSA：Qwen2.5-0.5B + ci_alpaca_10_dir fixture + trl 1.12 NLL loss，
  # 1 epoch 5.17s exit 0（loss 5.33→1.59）。
  # 关键 overlay：--loss_type nll 绕开 [[trl-chunked-nll-functools-partial-bug]]
  # （pissa 用 device_map="auto" 触发 accelerate.add_hook_to_module 把 forward
  # 包成 functools.partial，trl chunked_nll inspect.signature(__func__) 崩）；
  # --bits bf16（脚本默认 fp32，省内存）
