  # 最易候选
  - examples/conditional_generation/peft_lora_seq2seq_accelerate_fsdp.py
  # SD dreambooth：bnb 可选 flag 默认关——原 bnb 理由不成立；真因全量训练时长 +
  # 200 类图生成
  - examples/deft_dreambooth/train_dreambooth.py
  # llama-7b：dtype 自动 bf16（is_bf16_supported）7B≈14G——原"单卡 32G"不成立；
  # 阻塞为家族推断：默认 sdpa 在 NPU dispatch 到 FA 内核（dora 实测 aclnn 207001）
  - examples/deft_finetuning/deft_finetuning.py
  # 同 deft（bf16 加载，家族 FA 推断；脚本未硬编码 flash_attention_2）
  - examples/delora_finetuning/delora_finetuning.py
  # Llama-3.1-8B bf16≈16G 单卡 32G 可容——原"HBM 溢出"不必然；device_map 传单
  # 设备名不切分多卡；前向走默认 sdpa → FA 内核问题（同 dora 实测）仍适用
  - examples/dora_finetuning/dora-caching.py
  # 家族代表实测：载入 OK（Using device: npu），首步前向 aclnnFlashAttentionScore
  # 207001（CANN 9.1）；注：脚本未硬编码 flash_attention_2，是 transformers 默认
