version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。exclude 项为目录
  # 路径（递归剪枝）或 glob（`**` 跨目录，匹配相对 target root 的路径），
  # 排除"不是 example 的配套物"：共享 helper 模块、上游自测、运行配置、
  # 入口脚本背后的实现文件。扫描工具的 exclude 支持随发现 workflow 的
  # PR 落地；examples 引擎不扫描，本段当前只是声明。
  exclude:
    - examples/sft/configs           # deepspeed/fsdp 配置，被 run_peft_*.sh 引用
    - examples/sft/train.py          # run_peft.sh 背后的实现，入口是 .sh
    - '**/utils'                    # 各 example 的共享 helper 模块目录
    - '**/__init__.py'
    - '**/utils.py'                 # 单文件版 helper
    - '**/datautils.py'
    - '**/preprocess.py'            # 数据预处理脚本
    - '**/test_*'                   # 上游自测（.py / .sh）
    - '**/*config*.yaml'            # accelerate 等运行配置

supported:
  # Upstream's only fully-parameterized shell training entry (drives
  # train.py: TRL SFTTrainer + LoRA). The script defaults to
  # Mistral-7B + bnb 4bit + flash-attn + push_to_hub; the overlay swaps
  # in the ModelScope-predownloaded Qwen2.5-0.5B (SFT_MODEL_PATH,
  # exported by setup_example.sh), an 8-row chatml fixture copied to
  # $TARGET_ROOT/fixtures/, disables the NPU-unavailable switches and
  # scales training down to 1 step. Later CLI args win (argparse), so
  # these override the values hardcoded earlier in run_peft.sh.
  - path: examples/sft/run_peft.sh
    profile: peft
    runner: linux-aarch64-a2-1              # 单卡 runner；卡数由 runner 标签钉死
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl
      - --use_4bit_quantization False
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --packing False
      - --max_length 512
      - --per_device_train_batch_size 1
      - --per_device_eval_batch_size 1
      - --gradient_accumulation_steps 1
      - --max_steps 1
      - --logging_steps 1
      - --dataset_num_proc 1
      - --eval_strategy no
      - --save_strategy no
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 90
