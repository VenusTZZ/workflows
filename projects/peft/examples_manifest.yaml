version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py']  # 仅 .sh/.py；peft/examples 下的所有 .yaml 都是 accelerate/deepspeed/fsdp 运行配置，非 training recipe，不纳入审计
  # files-only 模型（docs/examples-guard-engine.md §2.7）。扫描范围是 examples/
  # 下的 .sh/.py；所有被发现的文件必须在 supported[*].path 或 unsupported
  # 列表里。不再使用 exclude 字段——所有"非 supported 但存在"的 .sh/.py
  # 都归 unsupported(末尾的"非 example utility"子段)，与 audit_examples_manifest.py
  # 的 listed_paths() 语义一致(它只 union supported + unsupported)。

supported:
  # TRL SFTTrainer LoRA，1 卡 1 step
  - path: examples/sft/run_peft.sh
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}   # 脚本默认 Mistral-7B：换 setup 预下载的 0.5B（CI 规模 + 避 HF 下载）
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl   # 默认拉 HF hub：换仓内 8 行 fixture
      - --use_4bit_quantization False   # bnb 4bit 无 NPU 后端
      - --use_flash_attn False          # flash-attn 仅 CUDA
      - --gradient_checkpointing False  # 0.5B 无需省显存；关掉避免 NPU reentrant 兼容问题
      - --use_reentrant False           # 同上（checkpointing 已关，双保险）
      - --push_to_hub False             # 默认 True：CI 不推模型仓
      - --packing False                 # 8 行样本无需打包，行为更可预期
      - --max_length 512                # 默认 2048：压序列长度
      - --per_device_train_batch_size 1 # 默认 8：压批
      - --per_device_eval_batch_size 1  # 同上
      - --gradient_accumulation_steps 1 # 默认 8：1 step 即可验证
      - --max_steps 1                   # 默认整 epoch：1 步压到 CI 规模
      - --logging_steps 1               # 默认 5：确保 1 步内也有日志
      - --dataset_num_proc 1            # 避免 datasets 多进程在 CI 容器的不稳定
      - --report_to none                # 关闭 wandb 等外部上报（未装会报错）
      - --output_dir ${CI_OUTPUT_DIR}   # 默认仓内相对路径：输出必须进 CI 输出目录
    timeout_minutes: 90

  # SFT + FSDP1（Llama-2-70b 换 0.5B）：fsdp_config.yaml num_processes: 8
  # 原样跑 a2-8；npu-5 2 rank 实跑 1m07s exit 0
  - path: examples/sft/run_peft_fsdp.sh
    profile: peft
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}   # 默认 gated meta-llama/Llama-2-70b-hf：换 seed 的 0.5B
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl   # 默认 smangrul/ultrachat-10k-chatml：换仓内 fixture（messages 字段，chatml 模板兼容）
      - --use_flash_attn False          # .sh 默认 True，flash-attn 仅 CUDA
      - --gradient_checkpointing False  # 0.5B 无需省显存；避开 NPU reentrant 兼容问题
      - --use_reentrant False           # 双保险
      - --push_to_hub False             # 默认 True：CI 不推模型仓
      - --hub_private_repo False        # 同上
      - --packing False                 # 8 行样本无需打包
      - --per_device_train_batch_size 2   # 8 行 / bs2 / 2 rank = 各 2 步，DDP/FSDP 均衡
      - --per_device_eval_batch_size 2
      - --gradient_accumulation_steps 1 # 1 step 即可验证
      - --max_steps 1
      - --logging_steps 1
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # SFT + torchrun DDP（Mistral-7B 换 0.5B）：首行 --nproc_per_node 8
  # 原样跑 a2-8；npu-5 2 rank hccl exit 0（56s）
  - path: examples/sft/run_peft_multigpu.sh
    profile: peft
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}   # 默认 mistralai/Mistral-7B-v0.1：换 0.5B
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl
      - --use_4bit_quantization False   # .sh 默认 True：bnb 无 NPU 后端
      - --use_nested_quant False        # 同上（bnb_4bit_* 残留参数 4bit 关时不被消费）
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --hub_private_repo False
      - --packing False
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      - --gradient_accumulation_steps 1
      - --max_steps 1
      - --logging_steps 1
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # SFT + QLoRA-FSDP（Llama-2-70b 换 0.5B，bnb 关掉退化成 LoRA+FSDP1）：
  # fsdp_config_qlora.yaml 本就 num_processes: 2，只需 a2-2（不必占 a2-8）；
  # npu-5 2×910B4 2 rank 实跑 1m18s exit 0
  - path: examples/sft/run_peft_qlora_fsdp.sh
    profile: peft
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl
      - --use_4bit_quantization False   # .sh 默认 True：bnb 无 NPU 后端，关掉退化 LoRA+FSDP
      - --use_nested_quant False
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --hub_private_repo False
      - --packing False
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      - --gradient_accumulation_steps 1
      - --max_steps 1
      - --logging_steps 1
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # SFT + DeepSpeed ZeRO-3（Llama-2-70b 换 0.5B）：deepspeed_config.yaml
  # num_processes: 8 + gradient_accumulation_steps: 4 原样跑 a2-8，overlay
  # grad_accum 必须跟 4（transformers 硬校验）；profile peft_ds 装
  # deepspeed 0.19.7（npu accelerator 自动识别，DS_BUILD_OPS=0 免编译）；
  # npu-5 1m40s exit 0
  - path: examples/sft/run_peft_deepspeed.sh
    profile: peft_ds
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --hub_private_repo False
      - --packing False
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      - --gradient_accumulation_steps 4 # 必须与 deepspeed_config.yaml 硬编码的 4 一致（transformers 硬校验）
      - --max_steps 1
      - --logging_steps 1
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # SFT + QLoRA-DeepSpeed-Z3（Llama-2-70b 换 0.5B，bnb 关掉退化 ZeRO-3+
  # LoRA）：deepspeed_config_z3_qlora.yaml 本就 num_processes: 2 且无
  # gradient_accumulation_steps 键（transformers 不做硬校验），只需 a2-2
  # （不必占 a2-8）；npu-5 2 rank 实跑 1m38s exit 0
  - path: examples/sft/run_peft_qlora_deepspeed_stage3.sh
    profile: peft_ds
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path ${SFT_MODEL_PATH}
      - --dataset_name ${TARGET_ROOT}/fixtures/ci_sft_8.jsonl
      - --use_4bit_quantization False
      - --use_nested_quant False
      - --use_flash_attn False
      - --gradient_checkpointing False
      - --use_reentrant False
      - --push_to_hub False
      - --hub_private_repo False
      - --packing False
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      - --gradient_accumulation_steps 1
      - --max_steps 1
      - --logging_steps 1
      - --report_to none
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # ===== fp16 硬编码家族 ×6 + lora_ga 设备分支：coder npu-5 2026-09-18
  # 逐条实跑 exit 0。此前判"翻案前置 patch"的两个坑现在由 CI shim 绕过
  # （sitecustomize，见 run_example.sh 三号 patch 注释）：
  # - TrainingArguments(fp16=True) 硬编码（gralora/lily/peanut/alora/dora/
  #   road）：torch_npu amp.GradScaler 与 accelerate 1.15 fp16 链路不兼容
  #   （Adam.step 拒收 grad_scaler kwarg）。shim 把 fp16 kwarg 强制 False；
  #   全部 supported 条目无一依赖 fp16=True，全局中性化是 no-op。
  # - lora_ga :178 `device = torch.device("cuda" if torch.cuda.is_available()
  #   else "cpu")`：原判"落 CPU"是 coder 裸跑没挂 transfer_to_npu；CI shim 下
  #   is_available()→True、.to()→npu，实测梯度估计 + 训练 + 落盘全通。
  # gralora/lily/peanut/dora/road 用 ci_text_8_hf（text 字段，train+test 双
  # split 是脚本硬需求）；alora 用新 fixture ci_alpaca_train_test
  # （input/output 字段 + 双 split，:149 直接 dataset["test"]） =====

  # GraLoRA：0.5B + ci_text_8_hf，npu-5 实跑 1 epoch exit 0（loss 2.37）
  - path: examples/gralora_finetuning/gralora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # LiLY：同 gralora 配方（npu-5 exit 0，loss 2.37）
  - path: examples/lily_finetuning/lily_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # Peanut：同 gralora 配方（npu-5 exit 0，loss 2.37）
  - path: examples/peanut_finetuning/peanut_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # ALoRA：0.5B + ci_alpaca_train_test（input/output 字段）；npu-5 exit 0
  # （loss 7.83，alora invocation tokens 路径）
  - path: examples/alora_finetuning/alora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_train_test
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 2
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # DoRA（训练脚本，区别于已支持的 dora-caching.py）：同 gralora 配方
  # （npu-5 exit 0，loss 2.37）
  - path: examples/dora_finetuning/dora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # RoAD：同 dora 配方，**必须 a2-1 单卡**——:76 device_map="auto" 在 2 卡
  # 会把模型切开（mat1 npu:1 vs npu:0 崩），单卡全部落 npu:0（npu-5 单卡
  # 实测 exit 0，loss 2.37）
  - path: examples/road_finetuning/road_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # LoRA-GA：0.5B + wikitext-2（默认 gpt2 换 seed 的 0.5B，target_modules
  # 换 Qwen 系；c_attn 是 gpt2 专用）。梯度估计（device 分支）+ 4590 步
  # 全量 1 epoch 训练 + adapter 落盘，npu-5 实跑 30.7min exit 0
  # （train_loss 4.43）。eval/save_steps 拉满跳过中途评估与存点（只留最终
  # save_pretrained）；num_epochs 默认 3 压到 1。
  - path: examples/lora_ga_finetuning/lora_ga_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --target_modules q_proj k_proj v_proj o_proj
      - --grad_estimate_iters 8
      - --num_epochs 1
      - --eval_steps 1000000
      - --save_steps 1000000
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # AdaLoRA seq2seq：零 CLI 入口（模块常量 facebook/bart-base + 8 epochs +
  # bs 8），npu-5 原样实跑 exit 0（8 epochs 训完 + accuracy 打印 + adapter
  # 落盘 + 末段 generate 复现）。全量 ≈105-110 min（1074 步/epoch @~2.6 it/s
  # + 每 epoch eval），是全部条目中最长的腿，timeout 120。模型由 cache-seed
  # 补种（facebook/bart-base，ModelScope 原 id 有镜像）；数据集
  # zeroshot/twitter-financial-news-sentiment 走 hf-mirror 运行时下载。
  # pin_memory=True 纯 DataLoader（无 accelerator.prepare）实测不挂。
  - path: examples/conditional_generation/peft_adalora_seq2seq.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    timeout_minutes: 120

  # ===== 2026-09-20 npu-1 第二批翻案 ×7（标准 CI 环境：sitecustomize 三
  # patch shim + HF_ENDPOINT=hf-mirror + 0.5B/seed 资产；上一批"归因待
  # 复跑"的 backward 崩与 evaluate/pin_memory 挂在标准环境下全部证伪） =====

  # MonteCLoRA 序列分类：原判 evaluate.load("glue","mrpc") import 时挂
  # （:33）——那是 npu-3 裸跑离线环境；CI 环境下 evaluate metric 走
  # hf-mirror 小文件正常（与 adamss_image 同路径）。npu-1 实跑 1 epoch
  # 173s exit 0，eval_accuracy 0.74 / eval_f1 0.83（glue 真 metric）。
  # glue/mrpc 数据与 roberta-base 均在 seed 缓存
  - path: examples/monteclora_finetuning/sequence_classification_finetune_monteclora.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${ROBERTA_BASE_PATH}   # 默认 roberta-base：seed 已种，显式注入本地路径
      - --num_epochs 1
      - --batch_size 16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # 语义检索 LoRA：原判两坑（pin_memory+accelerator.prepare 挂 do_sys_poll、
  # evaluate.load("roc_auc") 离线挂）均为 npu-3 裸跑环境假象——npu-1 标准
  # shim 下原样通过：pin_memory 不挂、roc_auc 走 hf-mirror 真值 0.767。
  # sanity_test 走 smangrul/amazon_esci 前 1024 行（运行时 mirror 下载）。
  # 注意 --sanity_test/--use_peft 是 store_true 裸开关（hra 教训：不能带值）
  - path: examples/feature_extraction/peft_lora_embedding_semantic_search.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path sentence-transformers/all-MiniLM-L6-v2   # seed 已种（bare id 走 hub cache 解析）
      - --sanity_test
      - --use_peft
      - --num_train_epochs 1
      - --per_device_train_batch_size 16
      - --per_device_eval_batch_size 16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # KaSA（SVD 正则 LoRA）：原"backward ERR00100 归因待复跑"是 npu-3 裸跑
  # 环境假象。与 miss/mica 同构（SFTConfig 子类 + device_map="auto" +
  # imdb 1%），同配方 --loss_type nll 绕 chunked_nll；a2-1 单卡下
  # device_map 全落 npu:0。npu-1 实跑 5 步 exit 0（loss 6.83 含 kasa 正则项）
  - path: examples/kasa_finetuning/kasa_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}
      - --loss_type nll   # device_map="auto" 触发 functools.partial forward，trl 1.12 chunked_nll 崩（同 miss/mica）
      - --max_steps 5
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # UniLoRA：同 kasa 配方（原 backward 崩同为环境假象），npu-1 5 步 exit 0
  # （loss 3.31）
  - path: examples/unilora_finetuning/unilora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}
      - --loss_type nll
      - --max_steps 5
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # PSoft：原判"trl 1.10 可跑、1.12 backward 崩"版本敏感——1.12 崩点实为
  # chunked_nll 与 device_map="auto" 的组合（同 miss/mica），--loss_type nll
  # 后通过。npu-1 5 步 exit 0（loss 3.31）
  - path: examples/psoft_finetuning/psoft_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
