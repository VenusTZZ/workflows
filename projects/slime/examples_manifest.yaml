version: 1
# slime-ascend examples ledger.
#
# Ledger baseline tree: gitcode.com/Ascend/slime-ascend main examples/
# (the NPU adaptation fork; 81 files). The engine validates supported
# paths against the monitored upstream checkout (THUDM/slime @ release
# tag) - every supported path below exists in both trees (verified
# 2026-09-20 against v0.3.2 and fork main e5cf8dc).
#
# The fork's own CI never runs examples/ (pr-test.yml only runs
# tests/test_*.py), but its NPU CI suite (tests/tests_npu/) proves the
# runtime end to end on Ascend; supported entries below reuse those
# verified configs as their CI recipe.
#
# Execution never uses the upstream .sh launchers directly: they
# hardcode absolute paths (/root/slime, /path/to/...), large models,
# 8-16 GPU layouts and multi-thousand-rollout schedules without "$@"
# passthrough. projects/slime/scripts/ci_train_driver.py re-assembles
# the same train.py/train_async.py invocation with CI-sized parameters
# instead; no example source is modified.
scan:
  root: examples
  include_extensions: ['.sh', '.py']
supported:
  # Fully-async rollout 全链路（Qwen2.5-0.5B + dapo-math-17k）。CI 复刻 fork 昇腾
  # nightly 测试 tests/tests_npu/nightly_CI/test_qwen2.5_0.5B_fully_async_short_npu.py
  # 的已验证配方：train_async.py、actor 1 卡 + rollout 3 卡（每 engine 1 卡）、
  # TP/PP/CP/EP 全 1、GRPO、--num-rollout 2；仅两处压缩偏离（response 8192→1024、
  # 数据换仓内 16 行 fixture）。模型走 ModelScope 本地路径（Qwen2.5-0.5B-Instruct），
  # ref-load 用 tools/convert_hf_to_torch_dist.py 现转的 _torch_dist 目录。
  - path: examples/fully_async/run-qwen2.5-0.5B-fully_async.sh
    profile: slime_fully_async
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
unsupported:
