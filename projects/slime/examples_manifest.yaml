  # GLM-4.7-355B-A32B（bf16 约 700GB+）16 节点 128 卡全硬编码（actor 8 节点 x 8 卡、
  # rollout 64 卡、TP8/PP4/CP2/EP16、/shared/fs 跨节点共享盘），source 绝对路径
  # /root/slime，零参数覆盖；delta 特性本身模型无关，属特性级测试而非 example 看护。
  - examples/delta_weight_sync/run-glm4.7-355B-A32B-delta.sh
  # ===== eval_multi_task：阶段三候选（需 CI 专用 eval 配置） =====
