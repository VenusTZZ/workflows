  - examples/__init__.py
  # ===== coding_agent_rl：硬阻塞（集群级外部服务 + 无公开模型/数据） =====
  # 8 节点 64 rollout 卡硬编码（examples/coding_agent_rl/run_qwen36_35b_a3b_swe_8nodes.sh：
  # --rollout-num-gpus 64、CP=8/EP=8/TP=2、hostfile /root/mpi_rack_hostfile 逐 IP
  # ssh 组网）；硬依赖 E2B 兼容 sandbox 集群（docker_sandbox.py 默认内网 IP
  # 80.48.5.89）、Node 22 / Claude Code tarball、SLIME_HEAD_HOST 反连（缺失即
  # RuntimeError）；MOCK_SANDBOX 分支 import 的 sandbox_mock.py 在仓内不存在；
  # Qwen3.6-35B-A3B 与 swe_train.jsonl 均无公开下载源。
  - examples/coding_agent_rl/run_qwen36_35b_a3b_swe_8nodes.sh
  # aiohttp_threaded.py 被 generate.py 的 sandbox 路径 import（aiohttp 并发工具），非独立入口。
  - examples/coding_agent_rl/aiohttp_threaded.py
  # docker_sandbox.py 被 generate.py 按 SANDBOX 实现选择 import（远程 Docker sandbox 适配），非独立入口。
  - examples/coding_agent_rl/docker_sandbox.py
  # generate.py 被 run_qwen36_35b_a3b_swe_8nodes.sh 以
  # --custom-generate-function-path examples.coding_agent_rl.generate.generate 调用（SWE 工程智能体
  # rollout 与奖励逻辑），非独立入口。
  - examples/coding_agent_rl/generate.py
  # sandbox.py 被 generate.py import（sandbox 抽象 + SWE-bench 环境整备），非独立入口。
  - examples/coding_agent_rl/sandbox.py
  # ===== delta_weight_sync：硬阻塞（模型规模 + 零覆盖入口） =====
