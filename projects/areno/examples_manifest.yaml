version: 1
# AReno examples 对账快照：以 inclusionAI/AReno 最新 release examples/ 为准
# （v0.9.0：已含昇腾后端；examples/ 共 67 个 .py / .sh 单元，当前无 .sh——
# .sh 一并纳入扫描，为上游将来新增 shell 入口兜底）。files-only 扫描模型
# （docs/examples-guard-engine.md 2.7）：对账单位是单个 .py / .sh 文件。
# supported 登记被 CI 调度的入口文件（每个用例锚在它的 agentic 入口
# run_agent.py，或 math/alpaca 的 dataset_loader.py）；同一用例里被连带运行或
# 交互的其余文件登记在 unsupported（不用目录条目，避免按前缀把整目录误判为
# 已覆盖）。unsupported 分两段：先按用例目录分组登记组件，再把「被其他
# example 文件 import 的共享模块」（工具依赖）统一挪到末尾；README /
# dataset.jsonl / 图片资产不进扫描。supported 与 unsupported 的区分是「本看护
# 体系是否调度它」，不代表昇腾原理上能否运行；unsupported 里的硬阻塞（如外部
# 依赖无法自包含）在注释中标明。构建栈：CANN 9.0.0 + torch
# 2.10.0+cpu + torch_npu 2.10.0.post2，源码安装现场编译
# areno.accel._areno_accel_npu。
scan:
  root: examples
  include_extensions: ['.py', '.sh']
supported:
