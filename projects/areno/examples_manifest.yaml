  # （fixtures/ci_tictactoe_image_8.jsonl，上游 dataset_generator.py seed 2026
  # 生成的图文行）；组件、数据生成器与 web_ui 见 unsupported。
  - path: examples/vl/tictactoe_image/run_agent.py
    profile: tictactoe_image_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 120
    overlay_args:
      - --ckpt Qwen/Qwen3.5-0.8B
      - --dataset-path ${FIXTURE_DIR}/ci_tictactoe_image_8.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/vl/tictactoe_image/dataset_loader.py
