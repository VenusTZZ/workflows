version: 1
# AReno examples 对账快照：以 inclusionAI/AReno 最新版本仓 examples/ 为准
# （v0.0.8 与 main 的 examples/ 树一致：59 个 .py，当前无 .sh——.sh 一并
# 纳入扫描，为上游将来新增 shell 入口兜底）。files-only 扫描模型
# （docs/examples-guard-engine.md 2.7）：对账单位是单个 .py / .sh 文件。
# supported 只登记真正被 CI 调度的那一个入口文件（每个用例锚在它的
# agentic 入口 run_agent.py）；同一用例里被连带运行或交互的其余文件仍登记在
# unsupported——不使用目录条目，因为目录会按前缀把整目录误判为已覆盖。
# unsupported 分两段：先按用例目录分组登记入口文件，再把「被其他 example
# 文件 import 的共享模块」（工具依赖）统一挪到末尾；README /
# dataset.jsonl / 图片资产不进扫描。
#
# 阶段 A 接入：manifest 登记 supported 的链路 —— bash_game、codebreaker、
# coding、duelgrid（已上卡跑绿、当前把 supported 条目注释禁用省卡，其
# run_agent.py 暂列 unsupported，启用时移回），以及生效的 shopping、
# terminal_hacking、tictactoe（tool-call 与 XML no-tool 两变体）、math
# （无入口，非 agentic GSPO-on-GSM8K，与 quick-start 同构）。其余文件共 54 个
# 写入 unsupported「待验证」。quick-start 已在单卡 910B4 跑通同构的
# GSPO-on-GSM8K 1 步 RLVR + areno serve 冒烟（NPU 栈 CANN 9.0.0 + torch 2.10
# + torch_npu 2.10.0.post2，源码装 main 现场编译
# areno.accel._areno_accel_npu）。unsupported 的语义是「本看护体系当前不跑
# 它」，不等于「昇腾原理上跑不了」：注释区分待上卡实测后可升级的项与需先解决
# 外部依赖才能升级的项。
scan:
  root: examples
  include_extensions: ['.py', '.sh']
