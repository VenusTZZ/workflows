      - --algo gspo
      - --batch-size 2
      - --n-samples 4
      - --mini-bs 1
      - --max-steps 1
      - --max-prompt-tokens 8192
      - --max-new-tokens 64
      - --drop-rollout-state
  # ave_event_recognition：Gemma4 音视频事件识别 agentic GRPO（RLVR）。
