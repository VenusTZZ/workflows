version: 1
# AReno examples 对账快照：以 inclusionAI/AReno 最新版本仓 examples/ 为准
# （v0.0.8 与 main 的 examples/ 树一致：59 个 .py，当前无 .sh——.sh 一并
# 纳入扫描，为上游将来新增 shell 入口兜底）。files-only 扫描模型
# （docs/examples-guard-engine.md 2.7）：对账单位是单个 .py / .sh 文件。
# supported 只登记真正被 CI 调度的那一个入口文件（每个用例锚在它的
# agentic 入口 run_agent.py）；同一用例里被连带运行或交互的其余文件仍登记在
# unsupported——不使用目录条目，因为目录会按前缀把整目录误判为已覆盖。
# unsupported 分两段：先按用例目录分组登记入口文件，再把「被其他 example
# 文件 import 的共享模块」（工具依赖）统一挪到末尾；README /
# dataset.jsonl / 图片资产不进扫描。
#
# 阶段 A 接入：bash_game、codebreaker、coding、duelgrid 四条 agentic 训练
# 链路已升级 supported；其余 55 个文件先写入 unsupported「待验证」。
# quick-start 已在单卡 910B4 跑通同构的 GSPO-on-GSM8K 1 步 RLVR + areno serve
# 冒烟（NPU 栈 CANN 9.0.0 + torch 2.10 + torch_npu 2.10.0.post2，源码装 main
# 现场编译 areno.accel._areno_accel_npu）；四条用例同样装 main，覆盖 agentic
# rollout + 工具调用链路。unsupported 的语义是「本看护体系当前不跑它」，
# 不等于「昇腾原理上跑不了」：注释区分待上卡实测后可升级的项与需先解决外部
# 依赖才能升级的项。
scan:
  root: examples
  include_extensions: ['.py', '.sh']
supported:
  # # bash_game：巴什博弈单轮策略游戏 RLVR（GSPO）。条目锚在 agentic 入口
  # # run_agent.py；bash_game_npu 例程跑 1 步训练——run_agent.py 经本地
  # # rollout 代理做单轮 submit_move 工具调用，reward.py 确定性打分，覆盖
  # # NPU 上的 agentic rollout + 工具调用链路（quick-start 只覆盖非 agentic
  # # GSPO）。数据走本仓 fixture（fixtures/ci_bash_game_8.jsonl，由上游
  # # dataset_generator.py 以 seed 42 离线生成、schema 完全一致），经
  # # overlay_args 的 ${FIXTURE_DIR} 传入，不在腿里重跑生成脚本。同一用例的
  # # 其余文件（组件 dataset_generator/loader/reward/game 与伴随物 eval/
  # # web_ui）见 unsupported。
  # - path: examples/agentic/bash_game/run_agent.py
  #   profile: bash_game_npu
  #   runner: linux-aarch64-a2-1
  #   image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
  #   timeout_minutes: 90
  #   overlay_args:
  #     - --dataset-path ${FIXTURE_DIR}/ci_bash_game_8.jsonl
  #     - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/bash_game/dataset_loader.py
  #     - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/bash_game/reward.py
  #     - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/bash_game/run_agent.py
  #     - --algo gspo
  #     - --batch-size 2
  #     - --n-samples 4
  #     - --mini-bs 1
  #     - --max-steps 1
  #     - --max-new-tokens 48
  #     - --max-prompt-tokens 2048
  # # codebreaker：多轮 Bulls and Cows 演绎游戏 RLVR（GSPO）。条目锚在 agentic
  # # 入口 run_agent.py；codebreaker_npu 例程跑 1 步训练——run_agent.py 经本地
  # # rollout 代理做最多 6 轮 guess_code 工具调用 + 收尾总结，状态仅经 tool
  # # result 累积（部分可观测），reward.py 按解题效率打分，覆盖 NPU 上的多轮
  # # agentic rollout 链路。数据走本仓 fixture（fixtures/ci_codebreaker_8.jsonl，
  # # 由上游 dataset_generator.py 以 seed 2026 离线生成、schema 一致），经
  # # overlay_args 的 ${FIXTURE_DIR} 传入。同一用例的其余文件（dataset_generator/
  # # loader/reward/tui 与 game）见 unsupported。
  # - path: examples/agentic/codebreaker/run_agent.py
  #   profile: codebreaker_npu
  #   runner: linux-aarch64-a2-1
  #   image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
  #   timeout_minutes: 90
  #   overlay_args:
  #     - --dataset-path ${FIXTURE_DIR}/ci_codebreaker_8.jsonl
  #     - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/codebreaker/dataset_loader.py
  #     - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/codebreaker/reward.py
  #     - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/codebreaker/run_agent.py
  #     - --algo gspo
  #     - --batch-size 1
  #     - --n-samples 2
  #     - --mini-bs 1
  #     - --max-steps 1
  #     - --max-new-tokens 64
  # coding：SWE-bench 风格多轮编码智能体 RLVR（GSPO）。条目锚在 agentic 入口
  # run_agent.py（薄封装，调用包内 areno.agent.run_agentic_coding_loop，agent
  # 循环与九工具实现都在包里）；coding_npu 例程跑 1 步训练——模型在任务
  # workspace 内 inspect/read/rg/apply_patch/run_command/submit，reward.py 按
  # 测试通过 + solved 打分，覆盖 NPU 上的多轮 coding agent + 有界 shell 工具
  # 链路（rg 为纯 Python，run_command 经 subprocess 有超时/rm 拦截）。数据走
  # 本仓 fixture（fixtures/ci_coding_2.jsonl：取上游 dataset.jsonl 前 2 条并把
  # max_turns 压到 2——上游默认 8 轮的 4096/256 长轨迹在 NPU native attention
  # 下会把 rollout 与 train 拖到十几分钟），并加 --max-new-tokens 128 与
  # --max-context-len 4096 兜底；setup 装 pytest 供 run_command 执行测试。
  # 同一用例的其余文件（agent_loop / coding_tools 兼容 shim、code_cli 交互、
  # dataset_loader、reward）见 unsupported。
  - path: examples/agentic/coding/run_agent.py
    profile: coding_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 240
    overlay_args:
      - --dataset-path ${FIXTURE_DIR}/ci_coding_2.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/coding/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/coding/reward.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/coding/run_agent.py
      - --algo gspo
      - --batch-size 1
      - --n-samples 2
      - --mini-bs 1
      - --max-steps 1
      - --max-prompt-tokens 4096
      - --max-new-tokens 128
      - --max-context-len 4096
  # duelgrid：回合制网格战术游戏 RLVR（GSPO）。条目锚在 agentic 入口
  # run_agent.py；duelgrid_npu 例程跑 1 步训练——run_agent.py 经本地 rollout
  # 代理做一次 choose_action 工具调用（结构化 JSON 动作列表），reward.py 用
  # 规则引擎打分（含未耗能量惩罚），覆盖 NPU 上的 agentic 工具调用链路。数据
  # 走本仓 fixture（fixtures/ci_duelgrid_8.jsonl，由上游 dataset_generator.py
  # 以 seed 2026 离线生成、schema 一致），经 overlay_args 的 ${FIXTURE_DIR}
  # 传入。同一用例的其余文件（dataset_generator/game、dataset_loader/reward
  # 组件与 web_ui 交互）见 unsupported。
  - path: examples/agentic/duelgrid/run_agent.py
    profile: duelgrid_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 90
    overlay_args:
      - --dataset-path ${FIXTURE_DIR}/ci_duelgrid_8.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/duelgrid/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/duelgrid/reward.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/duelgrid/run_agent.py
      - --algo gspo
      - --batch-size 2
      - --n-samples 2
      - --mini-bs 1
      - --max-steps 1
      - --max-prompt-tokens 2048
      - --max-new-tokens 64
unsupported:
  # ===== bash_game 其余文件：训练链路组件与伴随物，不单独调度（链路锚在
  # supported 的 run_agent.py，由 bash_game_npu 例程读取仓内 fixture 跑
  # 1 步训练）。 =====
  # 数据生成器：(n,m) 指纹去重 + 自校验的确定性 JSONL；CI 改用仓内
  # fixtures/ci_bash_game_8.jsonl（本脚本离线生成），不在腿里重跑。
  - examples/agentic/bash_game/dataset_generator.py
  # 训练加载器：附 prompt，oracle 藏于 record（被 --dataset-loader-fn 调用）。
  - examples/agentic/bash_game/dataset_loader.py
  # 确定性奖励（exact / 合法近似 / 非法），被 --reward-fn-path 调用。
  - examples/agentic/bash_game/reward.py
  # served 策略 held-out 评测：需先 areno serve，非 CI 训练用例。
  - examples/agentic/bash_game/eval.py
  # 人机对玩 WebUI：浏览器交互，非 CI 形态。
  - examples/agentic/bash_game/web_ui.py

  # ===== codebreaker 其余文件：训练链路组件与伴随物，不单独调度（链路锚在
  # supported 的 run_agent.py，由 codebreaker_npu 例程读取仓内 fixture 跑
  # 1 步训练）。 =====
  # 数据生成器：隐藏四位数谜题 JSONL；CI 改用仓内
  # fixtures/ci_codebreaker_8.jsonl（本脚本离线生成），不在腿里重跑。
  - examples/agentic/codebreaker/dataset_generator.py
  # 训练加载器（附 prompt，隐藏 secret）。
  - examples/agentic/codebreaker/dataset_loader.py
  # 解题效率奖励（valid/solved/部分分与非法路径惩罚）。
  - examples/agentic/codebreaker/reward.py
  # 终端对玩 TUI（可指向 OpenAI 兼容端点），人工交互入口。
  - examples/agentic/codebreaker/tui.py
  # ===== coding 其余文件：训练链路组件、兼容 shim 与交互入口，不单独调度
  # （链路锚在 supported 的 run_agent.py，由 coding_npu 例程读仓内
  # dataset.jsonl 跑 1 步训练）。 =====
  # 多轮 agent 循环兼容 shim（re-export areno.agent.agent_loop，实现已上移，
  # 示例流程不再引用）。
  - examples/agentic/coding/agent_loop.py
  # 交互式编码 CLI（在 --repo 目录内跑同一循环），人工交互入口。
  - examples/agentic/coding/code_cli.py
  # 九工具兼容 shim（re-export areno.agent.tools，实现已上移，流程不再引用）。
  - examples/agentic/coding/coding_tools.py
  # dataset.jsonl（100 条本地任务）加载器。
  - examples/agentic/coding/dataset_loader.py
  # 奖励：patch + 必要测试全过 + submit solved 才满分，含部分分/负分。
  - examples/agentic/coding/reward.py
  # ===== duelgrid 其余文件：训练链路组件与伴随物，不单独调度（链路锚在
  # supported 的 run_agent.py，由 duelgrid_npu 例程读取仓内 fixture 跑
  # 1 步训练）。 =====
  # 训练加载器（把生成的状态转成 prompt record）。
  - examples/agentic/duelgrid/dataset_loader.py
  # 规则引擎奖励（含未耗能量惩罚）。
  - examples/agentic/duelgrid/reward.py
  # 浏览器对玩 UI（键盘操控 + LLM 控制 A 方），人工交互入口。
  - examples/agentic/duelgrid/web_ui.py
  # ===== shopping：多轮工具调用购物 kit 任务（search_catalog ->
  # inspect_items -> check_kit -> submit_bundle 四轮固定序列，奖励校验
  # 类别/特征/预算约束）。待验证：多轮工具调用路径在昇腾实测。 =====
  # 数据生成：购物 kit 任务 JSONL。
  - examples/agentic/shopping/dataset_generator.py
  # 训练加载器。
  - examples/agentic/shopping/dataset_loader.py
  # 奖励：工具序列正确 + 约束全满足才满分。
  - examples/agentic/shopping/reward.py
  # 四轮固定工具序列 rollout。
  - examples/agentic/shopping/run_agent.py
  # ===== terminal_hacking：单步候选词演绎（上下文老虎机式，一次
  # submit_candidates + 非对称稠密奖励；README 以 ling-3.0-tiny + 8192
  # 上下文演示）。待验证：单步 agentic 路径与该底座在昇腾实测。 =====
  # 可观测 prompt 构造（隐藏密码不出现在 prompt）。
  - examples/agentic/terminal_hacking/dataset_loader.py
  # 非对称稠密候选集奖励（多猜重罚、漏猜轻罚）。
  - examples/agentic/terminal_hacking/reward.py
  # 单步 submit_candidates rollout（一次完成、不跑回合）。
  - examples/agentic/terminal_hacking/run_agent.py
  # CRT 风格对玩 WebUI（多端点选择），人工交互入口。
  - examples/agentic/terminal_hacking/web_ui.py
  # ===== tictactoe：井字棋 RLVR 双变体（tool-call 三件套 + XML no-tool
  # 三件套，minimax 最优步校验）。待验证：两种 rollout 形态（工具调用 /
  # 纯文本 XML）在昇腾实测，接入时选其一作代表。 =====
  # XML no-tool 变体加载器（复用 tool 变体 loader 的格式化）。
  - examples/agentic/tictactoe/dataset_loader_no_tool.py
  # tool-call 变体奖励。
  - examples/agentic/tictactoe/reward.py
  # no-tool 变体奖励（<move> 标签解析）。
  - examples/agentic/tictactoe/reward_no_tool.py
  # choose_square 工具调用 rollout。
  - examples/agentic/tictactoe/run_agent.py
  # XML 输出（<move>N</move>）rollout。
  - examples/agentic/tictactoe/run_agent_no_tool.py
  # 浏览器对玩 UI（LLM / minimax 双模式），人工交互入口。
  - examples/agentic/tictactoe/web_ui.py
  # ===== math：数学 RLVR 组件（无独立入口，由 areno train 以
  # --dataset-loader-fn / --reward-fn-path 组合引用；quick-start 的
  # GSPO-on-GSM8K 冒烟即同构组合）。待验证：以 examples 形态完整接入 CI
  # 后升级 supported——首个升级候选。 =====
  # GSM8K / NuminaMath 行归一化（question/answer、problem/solution -> prompt）。
  - examples/math/dataset_loader.py
  # math_verify 符号验证奖励（\\boxed{} 答案比对）。
  - examples/math/math_verify_reward.py
  # ===== ave_event_recognition：AVE 音视频事件识别（Gemma 4 多模态
  # agentic GRPO：report_events 工具调用 + 外部 OpenAI 兼容 judge 模型打分
  # JUDGE_*，数据来自 HF 镜像 AVE 数据集 + ffmpeg 抽音频）。待验证之外另
  # 有外部依赖：judge 服务与数据集获取需先落 CI 本地方案，VLM 多模态路径
  # 在昇腾亦未实测。 =====
  # 数据生成：AVE 下载 + 16 kHz 单声道 WAV 抽取 + 事件区间 manifest。
  - examples/multimodal/ave_event_recognition/dataset_generator.py
  # 视频 + 同步音频的多模态 prompt 构造。
  - examples/multimodal/ave_event_recognition/dataset_loader.py
  # 外部 judge 模型语义比对奖励（score/10 归一化，失败即报错）。
  - examples/multimodal/ave_event_recognition/reward.py
  # report_events 工具调用 rollout。
  - examples/multimodal/ave_event_recognition/run_agent.py
