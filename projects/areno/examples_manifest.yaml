  # ave_event_recognition：Gemma4 音视频事件识别 agentic GRPO（RLVR）。
  # run_agent.py 把 10s 视频 + 同步音频以 OpenAI video_url / audio_url 发进本地
  # rollout 代理，做一次 report_events 工具调用；reward.py 调外部 OpenAI 兼容
  # judge 语义比对事件集合（CI 由 run_example.sh 的标准库存根 judge 提供，引擎
  # 只认退出码、不校验奖励数值）。底座 google/gemma-4-E2B-it（权重 10.25GB）：
  # 单卡 rollout 可跑通（视频/音频/judge 全过），但全参训练 backward 单卡 29.5GB
  # 放不下（权重+梯度+优化器状态 ≈41GB），故沿用 duelgrid 同款 gemma 配置——
  # a2-2 + TP2 + --adam-4bit。上游数据是整包 AVE，CI 用 setup 生成的 10s 合成
  # 音视频 + 单行 manifest（${AVE_DATASET}）代替；Gemma4 视觉塔此前在
  # transformers 5.19 的 create_bidirectional_mask 抛 IndexError，看护已统一钉
  # transformers==5.15.*（areno 声明的 gemma4 多模态基线）。组件、数据生成器与
  # common 见 unsupported。
  - path: examples/multimodal/ave_event_recognition/run_agent.py
    profile: ave_event_recognition_npu
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 240
    overlay_args:
      - --ckpt google/gemma-4-E2B-it
      - --tp-size 2
      - --world-size 2
      - --adam-4bit
      - --dataset-path ${AVE_DATASET}
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/multimodal/ave_event_recognition/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/multimodal/ave_event_recognition/reward.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/multimodal/ave_event_recognition/run_agent.py
      - --algo grpo
      - --batch-size 1
      - --n-samples 2
      - --mini-bs 1
      - --max-steps 1
      - --max-running-prompts 1
      - --max-new-tokens 64
      - --max-prompt-tokens 8192
      - --max-context-len 8192
      - --drop-rollout-state
