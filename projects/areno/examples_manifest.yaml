version: 1
# AReno examples 对账快照：以 inclusionAI/AReno 最新版本仓 examples/ 为准
# （v0.0.8 与 main 的 examples/ 树一致：59 个 .py，当前无 .sh——.sh 一并
# 纳入扫描，为上游将来新增 shell 入口兜底）。files-only 扫描模型
# （docs/examples-guard-engine.md 2.7）：对账单位是单个 .py / .sh 文件，
# 每个文件一条 unsupported 记录（按用例目录分组注释）；README /
# dataset.jsonl / 图片资产不进扫描。
#
# 阶段 A 接入：全部 59 个用例先写入 unsupported「待验证」。quick-start 已在
# 单卡 910B4 跑通同构的 GSPO-on-GSM8K 1 步 RLVR + areno serve --backend npu
# 冒烟（NPU 栈 CANN 9.0.0 + torch 2.10 + torch_npu 2.10.0.post2，源码装
# main 现场编译 areno.accel._areno_accel_npu），但各 example 的入口形态
# （数据生成/加载、agentic 多轮 rollout、SFT/DPO/PPO 算法、VLM 多模态、
# 4bit 优化器）均未在昇腾实测。unsupported 的语义是「本看护体系当前不跑
# 它」，不等于「昇腾原理上跑不了」：注释区分待上卡实测后可升级 supported
# 的项与需先解决外部依赖才能升级的项；升级时注意安装源仍是 main-only
# （同 quick-start 的临时处理，v0.0.8 尚未包含 NPU 后端）。
scan:
  root: examples
  include_extensions: ['.py', '.sh']
supported: []
unsupported:
  # ===== bash_game：巴什博弈单轮策略游戏 RLVR（GSPO + --adam-4bit，
  # 确定性奖励；README 以 Ling-3.0-tiny / GB10 演示）。待验证：4bit 优化
  # 器与该数据/奖励组合在昇腾单卡实测。 =====
  # 数据生成：(n,m) 指纹去重 + 自校验的确定性 train/val/test JSONL。
  - examples/agentic/bash_game/dataset_generator.py
  # 训练加载器：附 prompt，oracle 藏于 record。
  - examples/agentic/bash_game/dataset_loader.py
  # served 策略 held-out 评测：mean reward / solve rate / 分 m 统计。
  - examples/agentic/bash_game/eval.py
  # 规则 oracle + prompt 渲染 + submit_move 解析（训练/奖励/评测/WebUI 共用）。
  - examples/agentic/bash_game/game.py
  # 确定性奖励：exact 1.0 / 合法近似 dense / 非法 0。
  - examples/agentic/bash_game/reward.py
  # 单工具调用 rollout（无环境循环、无多轮轨迹）。
  - examples/agentic/bash_game/run_agent.py
  # 人机对玩 WebUI（LLM 或完美 oracle），需 served 端点，人工交互入口。
  - examples/agentic/bash_game/web_ui.py
  # ===== codebreaker：多轮 Bulls and Cows 演绎游戏（guess_code 最多 6 轮，
  # 部分可观测、状态仅经 tool result 累积）。待验证：多轮工具调用 agentic
  # rollout 在昇腾实测。 =====
  # 数据生成：隐藏四位数谜题 JSONL。
  - examples/agentic/codebreaker/dataset_generator.py
  # 训练加载器。
  - examples/agentic/codebreaker/dataset_loader.py
  # Bulls and Cows 规则与 prompt 渲染。
  - examples/agentic/codebreaker/game.py
  # 猜中/失败奖励。
  - examples/agentic/codebreaker/reward.py
  # 多轮 guess_code 工具调用 rollout。
  - examples/agentic/codebreaker/run_agent.py
  # 终端对玩 TUI（可指向 OpenAI 兼容端点），人工交互入口。
  - examples/agentic/codebreaker/tui.py
  # ===== coding：SWE-bench 风格多轮编码智能体（dataset.jsonl 100 条自
  # 包含任务；inspect/read/rg/apply_patch/run_command 等九工具）。待验证：
  # 多轮长轨迹与 run_command 有界 shell 执行在 CI 容器内的稳定性。 =====
  # 多轮 agent 循环共享实现（训练与 CLI 同一循环）。
  - examples/agentic/coding/agent_loop.py
  # 交互式编码 CLI（在 --repo 目录内跑同一循环），人工交互入口。
  - examples/agentic/coding/code_cli.py
  # 九工具实现（路径解析限制在临时 workspace、rm 拦截、输出截断）。
  - examples/agentic/coding/coding_tools.py
  # dataset.jsonl（100 条本地任务）加载器。
  - examples/agentic/coding/dataset_loader.py
  # 奖励：patch + 必要测试全过 + submit solved 才满分，含部分分/负分。
  - examples/agentic/coding/reward.py
  # 多轮编码 rollout。
  - examples/agentic/coding/run_agent.py
  # ===== duelgrid：回合制网格战术游戏多轮 RLVR（结构化 JSON 动作 + 规则
