  #     - --batch-size 2
  #     - --n-samples 2
  #     - --mini-bs 1
  #     - --max-steps 1
  #     - --max-new-tokens 128
  # terminal_hacking：单步候选词演绎 RLVR（GSPO，上下文老虎机式）。条目锚在
  # agentic 入口 run_agent.py；terminal_hacking_npu 例程跑 1 步训练——
  # run_agent.py 经本地 rollout 代理做一次 submit_candidates 工具调用（对可
  # 观测内存转储里的候选词过滤），reward.py 用稠密非对称奖励（多猜重罚、漏猜
  # 轻罚），覆盖 NPU 上的单步 agentic 工具调用链路。底座用 Qwen3-0.6B（README
  # 的 ling-3.0-tiny 是 KDA 模型，NPU 未实测）。数据走本仓 fixture
  # （fixtures/ci_terminal_hacking_8.jsonl，由上游 dataset_generator.py 以
  # seed 2026 离线生成、schema 一致），经 overlay_args 的 ${FIXTURE_DIR} 传入。
  # 同一用例的其余文件（dataset_generator/game、dataset_loader/reward 组件与
  # web_ui 交互）见 unsupported。
  - path: examples/agentic/terminal_hacking/run_agent.py
    profile: terminal_hacking_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 90
    overlay_args:
      - --dataset-path ${FIXTURE_DIR}/ci_terminal_hacking_8.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/terminal_hacking/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/terminal_hacking/reward.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/terminal_hacking/run_agent.py
      - --algo gspo
      - --batch-size 2
      - --n-samples 2
      - --mini-bs 1
      - --max-steps 1
      - --max-new-tokens 256
      - --max-prompt-tokens 4096
  # tictactoe（tool-call 变体）：井字棋单步 RLVR（GSPO）。条目锚在 agentic 入口
  # run_agent.py；tictactoe_npu 例程跑 1 步训练——run_agent.py 经本地 rollout
  # 代理做一次 choose_square 工具调用，reward.py 用 minimax 最优步校验打分，
  # 覆盖 NPU 上的单步工具调用链路。数据走本仓 fixture（fixtures/ci_tictactoe_8.jsonl，
  # 由上游 dataset_generator.py 以 seed 2026 离线生成、schema 一致），两个变体
  # 共用该 fixture，经 overlay_args 的 ${FIXTURE_DIR} 传入。同一用例的其余文件
  # 见 unsupported。
  - path: examples/agentic/tictactoe/run_agent.py
    profile: tictactoe_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 90
    overlay_args:
      - --dataset-path ${FIXTURE_DIR}/ci_tictactoe_8.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/tictactoe/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/tictactoe/reward.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/tictactoe/run_agent.py
      - --algo gspo
      - --batch-size 2
      - --n-samples 4
      - --mini-bs 1
      - --max-steps 1
      - --max-new-tokens 32
  # tictactoe（XML no-tool 变体）：同一棋盘，改为纯文本 `<move>N</move>` 输出
  # （无工具）。覆盖 NPU 上的非工具文本 rollout 形态；reward_no_tool.py 解析
  # XML 标签后用同一 minimax 打分。共用上面的 fixture。
  - path: examples/agentic/tictactoe/run_agent_no_tool.py
    profile: tictactoe_no_tool_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 90
    overlay_args:
      - --dataset-path ${FIXTURE_DIR}/ci_tictactoe_8.jsonl
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/tictactoe/dataset_loader_no_tool.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/tictactoe/reward_no_tool.py
      - --agent-fn ${EXAMPLES_ROOT}/examples/agentic/tictactoe/run_agent_no_tool.py
      - --algo gspo
      - --batch-size 2
      - --n-samples 4
      - --mini-bs 1
      - --max-steps 1
      - --max-new-tokens 64
  # math：数学 RLVR（无独立入口文件——由 areno train 组合 dataset_loader +
  # math_verify_reward）。条目锚在 dataset_loader.py；math_npu 例程跑 1 步非
  # agentic GSPO：Qwen3-0.6B 在 ModelScope 的 gsm8k:main 上做 RLVR，reward 用
  # math_verify 校验 \boxed{}。与 quick-start 的 GSPO-on-GSM8K 冒烟同构（两者会
  # 各占一条腿，如嫌重复可注释本条）。同一用例的 math_verify_reward.py 见
  # unsupported。
  - path: examples/math/dataset_loader.py
    profile: math_npu
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    timeout_minutes: 90
    overlay_args:
      - --dataset-path gsm8k:main
      - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/math/dataset_loader.py
      - --reward-fn-path ${EXAMPLES_ROOT}/examples/math/math_verify_reward.py
      - --algo gspo
      - --batch-size 1
      - --max-steps 1
      - --max-new-tokens 256
