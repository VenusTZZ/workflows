  # # shopping：多轮工具调用购物 kit 任务 RLVR（GSPO）。条目锚在 agentic 入口
  # # run_agent.py；shopping_npu 例程跑 1 步训练——固定四轮工具序列
  # # search_catalog -> inspect_items -> check_kit -> submit_bundle（每轮
  # # tool_choice 强制单工具），reward.py 校验最终 bundle 满足类别/特征/预算
  # # 约束并按工具序列正确性给分，覆盖 NPU 上的多轮工具调用链路。数据走本仓
  # # fixture（fixtures/ci_shopping_8.jsonl，由上游 dataset_generator.py 以
  # # seed 2026 离线生成、schema 一致），经 overlay_args 的 ${FIXTURE_DIR} 传入。
  # # 同一用例的其余文件（dataset_generator/game、dataset_loader/reward 组件）
  # # 见 unsupported。
  # - path: examples/agentic/shopping/run_agent.py
  #   profile: shopping_npu
  #   runner: linux-aarch64-a2-1
  #   image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
  #   timeout_minutes: 90
  #   overlay_args:
  #     - --dataset-path ${FIXTURE_DIR}/ci_shopping_8.jsonl
  #     - --dataset-loader-fn ${EXAMPLES_ROOT}/examples/agentic/shopping/dataset_loader.py
  #     - --reward-fn-path ${EXAMPLES_ROOT}/examples/agentic/shopping/reward.py
