  # UPSTREAM_REF pinning). Weights are pulled by the script's embedded
  # `snapshot_download('stabilityai/stable-diffusion-3-medium-diffusers')`
  # into the default modelscope hub cache (full repo ~30 GB; persisted
  # on /data/ci-cache/modelscope/xdit).
  # xfuser's NPU dispatch (envs.py `_is_npu()` / hccl) is verified by
  # the install-verify block. Multi-card (USP / DP / TP) is
  # pointer-only in the doc. Use the Contents API URL (same as xtuner
  # / specforge / aibrix / colossalai) so doc-hash monitoring sees
  # edits with matching auth headers. timeout_minutes=90 covers cold
