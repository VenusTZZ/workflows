  # specforge quick start runs an end-to-end 1-step training smoke on
  # 4-card NPU: installs torch 2.11.0 / torch_npu 2.11.0 / sglang 0.5.14
  # (matching specforge's pinned pyproject), then a single #test block
  # in Quick-start-Ascend.md starts mooncake_master + SGLang capture
  # server on card 0 + specforge trainer on card 1, runs 1 step, tears
  # down via trap. 1-card runner is too small (capture + trainer on one
  # device OOMs on Qwen3.5-4B + activations). specforge docs live on
  # the docs site (not flat markdown in the source tree), so doc-hash
  # monitoring has to live in this fork rather than on
  # raw.githubusercontent.com — the Contents API URL in
  # specforge-quick-start.yml is what makes that work.
  - name: specforge
    category: 训练加速
    support_level: 基础支持
    upstream_repo: sgl-project/SpecForge
    phase: A
    runner: linux-aarch64-a2-4
    dir: projects/specforge
    workflows:
      quick_start: .github/workflows/specforge-quick-start.yml
  # include_prerelease=true used to be wired in the workflow for
  # torchtitan because every pre-stable release is marked prerelease
  # and /releases/latest 404s. Now the engine does the fallback
  # automatically (/releases/latest -> /releases?per_page=20 picking
  # the latest non-draft -> /tags?per_page=1), so no caller input is
  # needed and the workflow no longer passes this.
  - name: torchtitan
    category: 训练加速
    support_level: 新兴适配
    upstream_repo: pytorch/torchtitan
    phase: A
    runner: linux-aarch64-a2-2
    dir: projects/torchtitan
    workflows:
      quick_start: .github/workflows/torchtitan-quick-start.yml
      # Release-only examples guard on the shared engine
      # example-template.yml (design: docs/examples-guard-engine.md).
      # First supported entries (4) all run on debugmodel / sft_debugmodel
      # (dim=256 / 6L / 16H / vocab 2048, ~6 M params — fits single 30 GB
      # card, FSDP shard=2 splits cleanly on 2-card): 1-card debugmodel,
      # 1-card debugmodel_ce_loss (drift signal for patch 4 vs upstream
      # CE config), 2-card full_dtensor + bf16 (HCCL + DTensor), 1-card
      # sft_debugmodel. Smoke = 2 steps, ~5 min each. unsupported covers
      # 8B/70B/405B (CPU-offload 活锁 + OOM), all float8/MXFP8/NVFP4
      # variants (no NPU backend), torch 2.13+ deps (dist_gemm /
      # varlen_attn / spmd_types default), every other model family
      # (qwen3 / qwen35 / gpt_oss / deepseek_v3 / kimi / flux /
      # muse_glimmer — flex + custom kernels unverified), RL
      # (vllm-ascend ABI mismatch torch 2.12), and forge / graph_trainer
      # / torchft / transformers_modeling_backend (CUDA-only cudagraph /
      # torchft NCCL / HF AutoModel untested).
      examples: .github/workflows/torchtitan-examples.yml
