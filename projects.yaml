  # xDiT guard scope: single-card SD3 medium smoke on NPU through a
  # minimal script (torchrun --nproc_per_node=1, hccl runtime,
  # xFuserStableDiffusion3Pipeline). The doc installs the pinned torch
  # stack itself (torch 2.9.0 + torch_npu 2.9.0.post2 + triton 3.5.* —
  # xfuser >= 0.6.0 imports triton unconditionally without declaring
